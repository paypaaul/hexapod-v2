# Problemi trovati scrivendo la sezione 6, la zampa (D-075, formato in guida/schema.md "Problemi"). F2: tibia.
# Coordinate nella terna della zampa (mm): X verso l'esterno (il fronte della tibia), Y lungo l'asse del femore verso
# il lato A, Z in alto; asse del ginocchio in X 120, Z 0. Le misure sulle mesh sono raggi lanciati su
# build/guida/cad/mesh/*.ply con le trasformate di guida/dati/manifest.json (posa di riferimento, gamma 90).
# Campo in piu' rispetto allo schema: domanda (cosa chiedere all'utente, quando serve).

- titolo: Il guscio della tibia copre una vite delle alette, che D-049 vuole stretta per ultima
  gravita: importante
  dove: "6.04, 6.10"
  cosa: >-
    Il fianco +Y del guscio (Y 24,55-26,15, da X 120 al fronte, da Z -16 in giu') sta sopra la vite d'aletta lato coda
    verso il fronte (X 125, Z -34,25): un fascio di raggi Ø2,8 lungo +Y dalla testa della vite lo incontra a 9,6 mm.
    Con il guscio montato la vite non si avvita ne' si stringe con una chiave dritta. D-049 dice di stringere le
    quattro viti delle alette per ultime, a femore montato; il piano della guida (sezione 6) mette il guscio nella
    tibia, prima della coxa e del femore. Le altre tre viti non sono coperte dal guscio. Il guscio invece si monta
    anche a femore montato: lungo -X la sua corsa e' libera da femori, lame, squadretta e perno (posa di riferimento).
  prove:
    - "docs/decisioni.md D-049 (alette strette per ultime), docs/progetto-meccanico.md 'Modello in Fusion (zampa v0)'"
    - "docs/piano-guida.md, sezione 6: tibia (... guscio, piedino) -> coxa -> ... -> alette strette per ultime"
    - "cad/script/zampa.py fai_cover_tibia: y1 = -(zy_fondo_est - cov_tib_gio - cov_tib_sp) = 26,15; via_fianco_piu toglie il fianco solo sopra Z -16"
    - "guida/dati/fori.json: alette del Servo_ginocchio a X 115/125, Z -34,25 e 13,75"
  opzioni:
    - "Guscio dopo le alette strette, in fondo alla sezione 6 (nessun cambio al CAD; e' quello che fa la bozza: 6.10 va spostato dalla F3)."
    - "Foro d'accesso Ø3 nel fianco +Y del guscio, in asse con la vite (si vede sul fianco)."
    - "Stringere le alette prima di montare il femore (contro D-049: il servo non si allinea al cuscinetto)."
  consiglio: Guscio dopo le alette; il diffusore (6.09) si prepara quando si vuole. Nessun cambio al CAD.

- titolo: Le viti delle alette lato albero del ginocchio si raggiungono solo con la lama A tolta e il ginocchio ruotato
  gravita: importante
  dove: "6.04 e il passo delle alette strette (F3)"
  cosa: >-
    Nella posa di riferimento (gamma 90) la chiave lungo +Y sulla vite lato albero verso la coxa (X 114,4, Z 13,75)
    incontra Femore_A a 13,3 mm e la lama A a 15,7; quella verso il fronte (X 125,6) incontra la lama A. Ruotando il
    femore attorno all'asse del ginocchio a passi di 15 gradi, Femore_A libera le due viti lato albero da gamma 75 in
    giu' (femore ripiegato verso la tibia), mentre le viti lato coda restano libere fino a gamma 45: con gamma fra 45
    e 75 le quattro viti si raggiungono, a lama A tolta. La lama A le copre a ogni angolo. Il passo delle alette
    strette deve dire l'angolo del ginocchio, e la lama A va dopo (il piano la mette gia' in fondo).
  prove:
    - "Raggi su Femore_A, Cover_Femore_A, Femore_B, Squadretta_ginocchio, Ingombro_Teste_A ruotati attorno a X 120, Z 0"
    - "docs/piano-guida.md 'Candidati problema': vite d'aletta del servo del femore sotto Femore_A (stesso tipo, all'anca)"
  opzioni:
    - "Nel passo delle alette strette: ginocchio fra 45 e 75 gradi (gamma minimo 43 con il femore a 0, tabella di progetto-meccanico.md), lama A non ancora montata."
    - "Accesso con una chiave a testa sferica inclinata (da provare sul pezzo)."
  consiglio: La F3 verifichi l'angolo nel CAD con i giunti veri e lo scriva nel passo; lama A dopo le alette.

- titolo: La testa della vite del guscio appoggia su una faccia curva, e l'avviso dei 0,03 mm oltre il fondo e' falsato
  gravita: importante
  dove: "6.10"
  cosa: >-
    La vite M3 x 10 del guscio entra dal fronte (X circa 133) verso -X. Sotto la testa Ø5,5 la faccia esterna del
    guscio e' il fronte convesso R 288: va da X 133,37 (Z -85,25) a 132,14 (Z -90,75), 1,23 mm di dislivello, senza
    una lamatura piana. La testa tocca solo sul bordo alto. Il controllo 'lunghezze' prende come appoggio l'estremo
    piu' basso del foro passante (X 132,39) e trova la punta 0,03 mm oltre il fondo del foro dell'inserto (X 122,42).
    Con l'appoggio sul bordo alto la punta resta circa 0,95 mm sopra il fondo, ma il PLA sotto il bordo della testa
    si segna e la vite puo' allentarsi; se il PLA cede di 1 mm la vite tocca il fondo.
  prove:
    - "costruisci controlla: 'zampa/guscio_tibia: la vite arriva a -0.03 mm dal fondo del foro'"
    - "Raggi -X sul guscio a Y 0: X 133,37 a Z -85,25; 132,77 a Z -88; 132,14 a Z -90,75"
    - "guida/dati/fori.json: Cover_Tibia foro_vite X 129,366-132,388; Tibia ins_guscio X 129,123-122,423 (6,7 di foro, inserto da 5)"
    - "cad/script/zampa.py fai_cover_tibia: bossolo_vite e foro_vite, nessuna lamatura"
  opzioni:
    - "Lamatura piana Ø6 sul fronte, profonda quanto serve a togliere il dislivello (cambia la faccia in vista)."
    - "Vite M3 x 8: presa di 4,7 mm nell'inserto da 5 (cambia il BOM: M3 x 8 da 106 a 112, M3 x 10 da 18 a 12)."
    - "Testa svasata o rondella sagomata (pezzo in piu')."
  consiglio: Lamatura piana nella 2.1.7; fino ad allora 'stringi piano' con il dato C, come nella bozza.

- titolo: La striscia delle luci (6 pixel, 50 mm) e' piu' lunga della sua sede (47,5 mm)
  gravita: minore
  dove: "6.05"
  cosa: >-
    D-068 porta le tibie a 6 pixel a 120 LED/m, 50 mm. La sede piana sul fronte va da Z -33,0 (fondo della culla) a
    -80,5: 47,5 mm, misurata sulla mesh e uguale ai parametri (luc_tib_z0 = cul_coda 32,95; luc_tib_z1 =
    cov_tib_fin_z1 80, piu' 0,5). Con il capo dei fili in alto a Z -33 (docs/cablaggio.md 3.3) il capo basso esce di
    2,5 mm dalla sede e appoggia 0,5 piu' in alto. Sul pezzo che esce restano da 0,8 a 1,2 mm fino al diffusore
    (striscia spessa 1-1,4); i sei LED stanno tutti nella finestra (da Z -37,2 a -78,8).
  prove:
    - "D-066 (sede pensata per 3 pixel a 60 LED/m, 50 mm), D-068 (6 pixel a 120 LED/m, 'le sedi del CAD non cambiano')"
    - "Raggi -X sulla tibia a Y 0 e Y -4: sede da Z -33,0 a -80,5"
    - "Raggi sul diffusore: faccia interna a X 131,91 per Z -81,5; stinco fuori sede a 129,71"
  opzioni:
    - "Allungare la sede di 3 mm verso il piede (luc_tib_z1 = cov_tib_fin_z1 + 3) nella 2.1.7."
    - "Lasciare cosi': il capo basso sporge 2,5 mm, c'e' aria."
    - "5 pixel (41,7 mm): il ramo delle tibie ne ripete 6, il firmware andrebbe cambiato."
  consiglio: Allungare la sede nella 2.1.7; nella bozza l'avviso [C].

- titolo: Nella gola del fermo i fili stanno a filo (3,3-4,05 mm in 4)
  gravita: minore
  dove: "6.08"
  cosa: >-
    La gola del fermo sulla parete +X della culla e' larga 4,0 e sotto i tre ponticelli ha 1,1 mm di luce: i fili
    stanno in un solo strato. Il doppino dell'FSR (2 x 28 AWG, Ø0,9 S) e i tre fili delle luci (30 AWG, Ø0,5-0,75)
    occupano 3,3-4,05 mm affiancati (commento di tib_fermo_w). Con i 30 AWG piu' grossi non entrano. La tacca del
    piedino (2 x 2) e la gola dello stinco (2 x 2) portano il solo doppino: 1,8 su 2.
  prove:
    - "cad/script/zampa.py: tib_fermo_w 4, tib_ponte_luce 0,3 + 0,8 di gola, pied_tacca 2, tib_gola_w 2"
    - "D-067 (fermo dei fili), D-073 (il 26 AWG non va)"
  opzioni:
    - "Misurare i fili comprati (BOM X5 e X31) e, se servono, ponticelli 0,4 piu' alti o gola da 4,5 nella 2.1.7."
  consiglio: Misurare i fili prima di stampare le tibie.
  domanda: "Che diametro esterno hanno i fili siliconici 28 AWG e 30 AWG che hai comprato (o che comprerai) per FSR e luci?"

- titolo: Mancano i dati per saldare e fissare FSR e striscia nella tibia
  gravita: minore
  dove: "6.05, 6.06"
  cosa: >-
    Le fonti dicono dove vanno FSR e striscia, non come si fissano ne' come si saldano. L'FSR 400 Short ha le
    linguette su una pellicola di poliestere: temperatura e tempo di saldatura non sono scritti. La coda si piega
    sul raccordo R 1 della punta: il raggio minimo di piega non e' noto (predisposizioni X5: 'C piega della coda').
    Non e' scritto se l'FSR e la striscia hanno l'adesivo sul retro: la bozza dice 'posa' per l'FSR (lo tiene il
    piedino) e 'incolla con il suo adesivo [C]' per la striscia. Le lunghezze dei fili (0,5 m) sono S.
  prove:
    - "docs/predisposizioni.md X5 e X31; docs/cablaggio.md 3.3; D-066 'Blocco A'"
  opzioni:
    - "Leggere la guida d'integrazione Interlink e la scheda della striscia comprata; provare piega e saldatura sul provino del piedino (predisposizioni.md, verifica dopo D-066)."
  consiglio: Provino del piedino con un FSR vero prima delle sei tibie.
  domanda: "La striscia e gli FSR che hai (o comprerai) hanno l'adesivo sul retro?"

- titolo: predisposizioni.md descrive ancora la finestra del guscio chiusa da 0,6 di bianco
  gravita: minore
  dove: "6.09"
  cosa: >-
    Nella tabella delle predisposizioni, X31 dice 'finestra chiusa da 0,6 di bianco, sede sullo stinco: da decidere
    prima di stampare i gusci. Cambia il guscio approvato in D-061: domanda 5'. D-066 ha scelto il diffusore
    separato a incastro (Cover_Tibia_Diffusore) e il guscio approvato non cambia; D-069 ha approvato X31. La bozza
    segue D-066.
  prove:
    - "docs/predisposizioni.md, riga di X31; D-066 'Luci nelle tibie, predisposizione'; D-069"
  opzioni:
    - "Aggiornare la riga di X31 in predisposizioni.md."
  consiglio: Aggiornarla con la 2.1.7.

- titolo: Fascette dei cavi della zampa con quote e riferimenti diversi fra cablaggio.md e D-061
  gravita: minore
  dove: "passi dei cavi della zampa (F3)"
  cosa: >-
    docs/cablaggio.md 3.2 dice che la fascetta del ponte sta nelle feritoie a X 28 (D-058) e cita D-060 per la
    fascetta dentro il blocco del femore. D-061 ha spostato la fascetta del ponte a X 24 (cox_fascetta_x 24 in
    zampa.py) e ha introdotto la fascetta nel blocco.
  prove:
    - "docs/cablaggio.md 3.2 'Femore' e 'Ginocchio'; D-061 'B1, femore'; cad/script/zampa.py cox_fascetta_x"
  opzioni:
    - "Correggere cablaggio.md (X 24, D-061)."
  consiglio: Correggerlo con la 2.1.7; la F3 usi X 24.

- titolo: Luci nelle tibie e colore del diffusore non ancora decisi
  gravita: minore
  dove: "6.05, 6.08, 6.09"
  cosa: >-
    X31 e' approvata come predisposizione (D-069) ma l'utente non ha deciso se montare le luci, ne' il colore del
    diffusore (PLA bianco o PETG traslucido fume', D-066, provino X10). La bozza li tratta come opzionali 'solo ora':
    dopo il guscio, piedino e fascette, aggiungerli vuol dire smontare.
  prove:
    - "CLAUDE.md, 'Aperti e prossimi passi' punto 1; D-066; D-069"
  opzioni:
    - "Decidere prima di montare la prima zampa."
  consiglio: Decidere prima della sezione 6; il provino di luce (X10) dice il colore.
  domanda: "Monti le luci nelle tibie? Se si', diffusore bianco o fume' (dopo il provino di luce)?"
