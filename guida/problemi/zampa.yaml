  opzioni:
    - "Aggiornare la riga di X31 in predisposizioni.md."
  consiglio: Aggiornarla con la 2.1.7.
  esito: "consiglio approvato dall'utente (11 ottobre 2026); le modifiche al CAD e ai documenti vanno nella 2.1.7"

