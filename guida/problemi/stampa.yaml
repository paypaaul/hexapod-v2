# Problemi trovati scrivendo la sezione 2, stampa e controllo dei pezzi (D-075, formato in guida/schema.md "Problemi").
# Campo in piu' rispetto allo schema: domanda (cosa chiedere all'utente), esito (risposta trovata nelle fonti).
# Le quote vengono da guida/dati/manifest.json e fori.json (CAD 2.1.6) e da cad/script/*.py.

- titolo: "Il vassoio dell'ESP32 e' in PETG per un documento e in PLA per gli altri"
  gravita: minore
  dove: "2.03, 2.18"
  cosa: >-
    docs/progetto-meccanico.md lo descrive "in PETG". Il README degli STL, D-065, la riga E2 del BOM e il colore del
    componente nel CAD ("Esa PLA placche") lo danno in PLA bianco, "perche' sta sotto l'antenna: niente carbonio". D-065
    segna la scelta del PLA per il vassoio fra le "proposte mie", cioe' non confermata dall'utente. La bozza scrive PLA
    [S].
  prove:
    - "docs/progetto-meccanico.md:117 (Corpo_Vassoio in PETG)"
    - "cad/stl/README.md:31 (Corpo_Vassoio.stl: PLA, sta sotto l'antenna: niente carbonio)"
    - "docs/decisioni.md D-065 (vassoio in PLA, proposta) e docs/BOM.md E2 (vassoio nel PLA colorato)"
    - "guida/dati/manifest.json: Corpo_Vassoio aspetto 'Esa PLA placche'"
  opzioni:
    - "PLA bianco, come BOM, README e CAD (antenna senza carbonio, come D-065)."
    - "PETG-CF nero, come progetto-meccanico.md: ma sotto l'antenna dell'ESP32 il carbonio puo' schermare."
    - "PETG senza carbonio: un altro materiale in casa."
  consiglio: PLA bianco; correggere progetto-meccanico.md nella 2.1.7.
  domanda: "Il vassoio dell'ESP32 va in PLA bianco (BOM E2) o in PETG? D-065 lo dava come proposta."

- titolo: "Slitte e supporti degli INA260: l'orientamento sul piatto non e' dato dalle fonti"
  gravita: minore
  dove: "2.16, 2.17"
  cosa: >-
    Il README scrive per le slitte solo "due copie" e per i supporti degli INA260 "piastra sul piatto", senza dire
    quale faccia. La slitta e' una piastra di 44,1 × 5,0 × 38,8 con quattro bugne per gli inserti M2 su una faccia; il
    supporto e' una piastra di 23,2 × 7,8 × 28,9. La bozza propone per le slitte la faccia piana (senza bugne) sul
    piatto e le bugne in alto [C], e per i supporti "piastra sul piatto" come da README.
  prove:
    - "cad/stl/README.md:32-33"
    - "guida/dati/manifest.json: bbox Corpo_Slitta_Regolatore [13,559; 43,0; -29,75]-[57,621; 48,0; 9,0]"
    - "guida/dati/fori.json: Corpo_Slitta_Regolatore ins_a..ins_d (4 inserti M2) e foro_vite (M3)"
  opzioni:
    - "Piano sul piatto e bugne in alto, come la bozza."
    - "Bugne sul piatto con supporti (peggio: sbalzi su fori per inserti)."
  consiglio: Faccia piana sul piatto; l'utente la conferma nello slicer.

- titolo: "La slitta destra e' la stessa della sinistra, non uno specchio"
  gravita: minore
  dove: "2.02, 2.16, 2.22"
  cosa: >-
    Il piano della guida segnava fra i candidati problema "slitta destra: specchiata o la stessa". Nel manifest la
    trasformata della slitta D e' una rotazione di 180° attorno a Z (matrice con determinante +1, X -> 71,18 - X,
    Y -> -Y), non uno specchio; gli inserti M2 e il foro M3 della D coincidono con quelli della S ruotati. Anche i
    regolatori e gli INA260 sono posati ruotati, non specchiati. Per questo la guida stampa due copie dello stesso STL
    e non marca le slitte. I supporti degli INA260 sono invece l'uno lo specchio dell'altro: i 3544 vertici del D
    coincidono con quelli dell'S specchiato rispetto a Y (confronto arrotondato a 0,01 mm).
  prove:
    - "guida/dati/manifest.json: occorrenze corpo/Corpo_Slitta_Regolatore_S (identita') e _D (-1 0 0 71,18 / 0 -1 0 0 / 0 0 1 0)"
    - "guida/dati/fori.json via guida.lib.fori: foro_vite S a (35,6; 48; 6) e D a (35,6; -48; 6)"
    - "build/guida/cad/mesh/Corpo_Supporto_INA260_S.ply e _D.ply: Y specchiato, 3544 vertici su 3544 uguali"
    - "docs/piano-guida.md, 'Candidati problema'"
  opzioni:
    - "Due copie dello stesso STL, ruotate, come nella bozza."
    - "Specchiare la seconda copia nello slicer: sbagliato, il pezzo e' simmetrico per rotazione e non va specchiato."
  consiglio: Nessuna azione, salvo scrivere nel README degli STL che le slitte sono due copie dello stesso pezzo, la destra ruotata.
  esito: "risolto con il manifest: stesso pezzo, nessuno specchio"

- titolo: "Gli inserti M3 del corpo sono 28 nel CAD e 30 nel BOM, e la somma del BOM fa 96"
  gravita: minore
  dove: "2.25"
  cosa: >-
    La riga "Inserti a caldo" del BOM dice 94 M3 ("30 nel corpo, nelle gondole e nella chiglia, 24 nelle coxe, 18 nelle
    tibie, 24 nei femori"): 30 + 24 + 18 + 24 = 96. Dai fori del CAD: Base 26, chiglia 2 (28 nel corpo), coxe 4 × 6,
    tibie 3 × 6, femori B 4 × 6: 94, come il totale del BOM e come il controllo totali_inserti della guida. Anche M2:
    28 dal CAD senza le predisposizioni, come il BOM.
  prove:
    - "docs/BOM.md:120"
    - "guida.lib.fori su guida/dati/fori.json: Corpo_Base inserto_m3 26, Corpo_Chiglia 2, Coxa 4, Tibia 3, Femore_B 4"
    - ".venv/bin/python -m guida.costruisci controlla: totali_inserti ok"
  opzioni:
    - "Correggere il testo del BOM in '28 nel corpo' nella 2.1.7."
  consiglio: "Correggere il BOM: i 94 vengono dal CAD."
  esito: "il totale 94 e' giusto; il '30 nel corpo' del BOM e' un errore di testo"

- titolo: "Il README dice un pixel nelle sedi del fondo dell'anello, D-068 ne mette due"
  gravita: minore
  dove: "2.19"
  cosa: >-
    cad/stl/README.md (Corpo_Fondo_Anello.stl) scrive "nelle due sedi va un pixel di striscia ciascuna". D-068 porta la
    striscia a 120 LED/m e dice che una sede da 16,7 mm porta 2 pixel: l'anello ne ha 4, come docs/predisposizioni.md
    (X11). Il README e' del 10 ottobre, precedente a D-068.
  prove:
    - "cad/stl/README.md:35"
    - "docs/decisioni.md D-068 (sede da 16,7 mm = 2 pixel)"
    - "docs/predisposizioni.md, riga X11 (4 pixel di X9, 2 per sede)"
  opzioni:
    - "Correggere il README nella 2.1.7."
  consiglio: Correggere il README; la guida dice 2 pixel per sede.

- titolo: "Il colore delle lunette dei microfoni non e' dato"
  gravita: minore
  dove: "2.03, 2.20"
  cosa: >-
    Il README scrive solo "PLA" per Corpo_Lunette_Microfoni, il BOM non le cita fra i pezzi in E2b (nero), il componente
    nel CAD ha l'aspetto "Esa PLA nero". La bozza scrive PLA nero [S].
  prove:
    - "cad/stl/README.md:38"
    - "docs/BOM.md E2b (fascia, visiera, gonne, sportellino, intarsi)"
    - "guida/dati/manifest.json: Corpo_Lunette_Microfoni aspetto 'Esa PLA nero'"
  opzioni:
    - "PLA nero, come l'aspetto nel CAD."
    - "PLA bianco: stanno sotto il carapace e non si vedono."
  consiglio: PLA nero; aggiungere le lunette alla riga E2b del BOM.
  domanda: "Le lunette dei microfoni vanno in PLA nero o bianco? Stanno sotto il carapace."

- titolo: "Parametri di stampa dati solo per il PETG-CF e il piedino"
  gravita: minore
  dove: "2.01, 2.23"
  cosa: >-
    Il README dice 3 perimetri, 4-5 strati sopra e sotto e riempimento 25 % per il PETG-CF, e D-064 4 perimetri per il
    piedino. Per il PLA, per il PETG fumé del diffusore e per il TPU (velocita', temperature, riempimento) non ci sono
    valori. Le tolleranze accettabili sui pezzi stampati non sono date: c'e' solo il restringimento dei fori di
    0,1-0,2 mm (D-056, scritto per lo sportellino). La bozza lascia la scelta allo slicer, come CLAUDE.md ("stampa e
    supporti li controlla l'utente") e marca [C] le tolleranze.
  prove:
    - "cad/stl/README.md:40 (parti in PETG-CF: 3 perimetri, 4-5 strati, 25 %)"
    - "docs/decisioni.md D-064 (piedino: parete e suola da 1,6, quattro perimetri), D-056 (fori piu' stretti di 0,1-0,2)"
    - "CLAUDE.md, 'Produzione': stampa e supporti li controlla l'utente nello slicer"
  opzioni:
    - "Lasciare allo slicer, come ora."
    - "Registrare nei documenti i valori che l'utente usa, dopo i provini."
  consiglio: Lasciare allo slicer; dopo i provini scrivere nel README i valori e le tolleranze che funzionano.

# --- Passata di qualita' F3c (immagini con zone, etichette e attrezzi stampati) ---

- titolo: "La dima di posa 2 non si vede sulla zampa in posa"
  gravita: minore
  dove: "2.27"
  cosa: >-
    La dima 2 fissa imbardata 30, femore 45, ginocchio 135. Con posa: {alfa: 45, gamma: 135, coxa: 30} la zampa si
    muove ma la dima resta dov'e' (gli attrezzi stanno nella loro terna e non seguono la posa), quindi i denti non
    toccano coxa e tibia. La posa corretta e' relativa al femore: la dima sta sui perni del femore e la coxa e la tibia
    si muovono rispetto a lui. In 2.26 la dima 1 (posa come costruita) combacia: i denti toccano coxa e tibia. In 2.27
    ho tolto la posa e mostrato la dima 2 con il solo femore B e i perni.
  prove:
    - "build/guida/img/stampa/2.26.png (dima 1 con coxa, femore B, perni e tibia: combacia)"
    - "guida/lib/dati.py: matrice() restituisce o['T'] per gli attrezzi, senza la posa"
    - "bbox di Dima_Posa_2 nel manifest: x 24,9...134, y -33,5...-20, z -32,1...38,8 (stessa piastra sui perni)"
  opzioni:
    - "Una posa con riferimento al femore, cosi' la dima segue il femore e coxa e tibia ruotano."
    - "Lasciare la dima 2 con i soli perni."
  consiglio: Lasciare com'e' per ora; la posa serve alla sezione 12 (12.11, 12.12), dove la dima e' sul robot.

- titolo: "Il tetto del tunnel misura 164 mm nel CAD, il testo dice 162"
  gravita: minore
  dove: "2.13"
  cosa: >-
    La zona interno_tunnel della base misura x da -85,4 a 79,0 (164,4 mm), y +-25 (50 mm), z da -31,9 a -11,4. Il testo
    di 2.13 (da D-056) dice "un ponte di 50 mm lungo 162". Se la zona include i raccordi alle testate, il ponte
    sospeso e' piu' corto; se no, la lunghezza e' 164. Il valore non cambia l'azione (supporti sotto il tetto).
  prove:
    - "build/guida/cad/zone/Corpo_Base__interno_tunnel.ply, bbox nella terna del robot"
    - "docs/decisioni.md D-056 (tetto del tunnel: ponte di 50 mm lungo 162)"
  opzioni:
    - "Verificare in Fusion la luce libera del tetto."
    - "Lasciare il testo di D-056."
  consiglio: Lasciare il testo; verificare quando si stampa la base.

- titolo: "Le bugne dei servo di coxa della base si vedono solo dall'alto, il tetto del tunnel solo dal basso"
  gravita: minore
  dove: "2.13"
  cosa: >-
    Un passo ha una sola vista. 2.13 mostra la base come si stampa, dall'alto, con i dodici fori pilota delle bugne in
    giallo (zona pilota_*: e' il foro, non l'intera bugna); il tetto del tunnel, che e' aperto sul fondo, si vede solo da
    sotto e ha l'etichetta TUNNEL (SOTTO) al suo posto. Non ci sono zone per la faccia inferiore delle bugne, dove
    vanno i supporti.
  prove:
    - "build/guida/cad/zone/Corpo_Base__pilota_*.ply: z da -5,1 a 1,7; le bugne sono a 25,6 mm dal piatto (z -6,35)"
    - "zone.yaml: Corpo_Base ha interno_tunnel e pilota_*, nessuna zona per la faccia inferiore delle bugne"
  opzioni:
    - "Aggiungere in zone.yaml bugna_servo_* (faccia inferiore) ed esportarle."
    - "Un secondo passo con la vista da sotto."
  consiglio: Aggiungere la zona bugna_servo_* nella prossima esportazione.

- titolo: "I supporti a cuneo e i supporti piccoli non sono nel CAD: le etichette SUPPORTO sono a stima"
  gravita: minore
  dove: "2.04"
  cosa: >-
    Il cuneo sotto lo stinco della tibia (circa 17 mm dal piatto) e i supporti piccoli del guscio non sono pezzi ne'
    zone. L'etichetta SUPPORTO di 2.04 sta nel punto [120, -22, -75] della terna della zampa, sotto lo stinco dal lato B:
    e' una stima per mostrare dove cade, non una posizione del CAD. In 2.10 i supporti sotto i tappi a rombo e il bossolo
    sono solo nel testo.
  prove:
    - "cad/stl/README.md 'Tibia.stl' (cuneo, fino a circa 17 mm) e 'Cover_Tibia.stl' (supporti piccoli)"
    - "build/guida/cad/zone/indice.json: nessuna zona per i supporti"
  opzioni:
    - "Lasciare l'etichetta a stima."
    - "Togliere l'etichetta e lasciare il testo."
  consiglio: Lasciare l'etichetta; lo slicer decide i supporti (CLAUDE.md, decisioni dell'utente).

- titolo: "Mancano zone per i controlli di 2.07, 2.10, 2.14, 2.18 e 2.19"
  gravita: minore
  dove: "2.07, 2.10, 2.14, 2.18, 2.19, 2.24"
  cosa: >-
    Femore A (12 fori passanti M3, 2 fori di accesso Ø6,0, sedi delle squadrette), guscio della tibia (tappi a rombo,
    bossolo della vite), chiglia (4 fori M3 da 3,4), vassoio (4 inserti M2 e 4 fori passanti M3; le zone esistenti sono
    asola_bus, sede_tof, mensola, torretta), sportello (2 fori passanti M3), gonna del fondo dell'anello e camera nera
    della fascia non hanno zone che coincidano con quello che il testo dice di controllare. Le immagini mostrano il
    pezzo con il piatto e, dove c'e' la zona, i fori in giallo.
  prove:
    - "guida/catalogo/zone.yaml: Femore_A, Cover_Tibia, Corpo_Chiglia assenti; Corpo_Vassoio senza gli inserti"
  opzioni:
    - "Aggiungere le zone alla prossima esportazione (esporta_guida.py zone)."
  consiglio: Aggiungere le zone; sono 5 pezzi.

- titolo: "La sezione 2 ha due passi in piu' per dima 2 e cavalletto"
  gravita: minore
  dove: "2.26, 2.27, 2.28"
  cosa: >-
    Per mostrare gli attrezzi stampati con la loro terna ho diviso gli attrezzi da banco: 2.26 ha la dima 1 sulla zampa,
    2.27 la dima 2, 2.28 il cavalletto con la base e la chiglia del robot appoggiate. La tabella resta in 2.26 con i tre
    attrezzi. Nessun altro passo e' stato rinumerato: i riferimenti da altre sezioni (12.11, 12.12) non cambiano.
  prove:
    - "guida/passi/02-stampa.yaml 2.26-2.28"
  opzioni:
    - "Tornare a un solo passo con la tabella e un'immagine."
  consiglio: Lasciare com'e'.
