- id: S-28
  titolo: La striscia dei partitori non ha un posto nel CAD, e la tasca libera accanto all'IMU e' al limite
  tipo: allocazione
  gravita: importante
  dove: "8.10, 8.22, 8.24; schemi.md 6.9; partitori.svg"
