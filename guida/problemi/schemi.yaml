  domanda: "Nel kit Temu da 918 viti ci sono M3 x 6 a testa bassa (DIN 7984) o bombata (ISO 7380)? Se no, preferisci comprarle o spostare le viti del vassoio nel CAD?"

- id: S-20
  titolo: Partitore, diodo e pull-down dell'abilitazione fuori dalla basetta
  tipo: allocazione
  gravita: importante
  dove: "4.04, 4.12, 8.18, 8.19, 8.25; schemi.md 1.6, 1.7 (scelte 6, 7)"
  cosa: >-
    La verifica elettrica ha trovato la rete EN (D2, R3) accanto a segnali alti a riposo (H1, L1, H4) e VBAT che
    attraversava la basetta fino a R6. Sulla basetta non c'e' un posto per l'abilitazione che non confini con una rete
    alta, e VBAT puo' arrivare solo a U2. Lo schema porta fuori: R6 (100 kOhm 1 %) saldata sull'uscita della 2813, in
    guaina, con un filo verso R-13; D2 (1N4148) in linea nella guaina del filo che parte da P-13 (GPIO42), anodo dal
    lato della basetta; una R3 per ogni D42V110F6, fra ENA e GND sul regolatore (22 kOhm, S-05); R9 (330 Ohm) in linea
    sul filo del dato delle tibie. Con la R3 sul regolatore un filo staccato lascia l'ENA a massa (rail spento); con la
    R3 sulla basetta lo lasciava al suo pull-up verso VIN (rail acceso). Con R6 alla 2813 un corto del filo del
    partitore non porta la batteria da nessuna parte.
  prove:
    - "docs/cablaggio.md:31-32, :78 (GPIO42 - 1N4148 - EN, 47 kOhm a massa; partitore 100 k / 47 k)"
    - "docs/BOM.md:52 (B10), :53 (B11: 47 kOhm e 22 kOhm)"
    - "pololu.com/product/5673 (ENA e ENB)"
    - "docs/decisioni.md D-019 (rail spento di default)"
  opzioni:
    - "Come lo schema: componenti in linea con guaina termorestringente (C6), R3 sui regolatori."
    - "R3 unica sulla basetta come in cablaggio.md: non c'e' un foro che non confini con una rete alta (schemi.md 5)."
  consiglio: Come lo schema; cablaggio.md 3.1 va aggiornato con la nuova posizione delle resistenze.

- id: S-21
  titolo: "GPIO38-40 sono anche le linee della microSD della scheda: il pull-down dei microfoni potrebbe non contare"
  gravita: importante
  dove: "4.03, 13.16; schemi.md 2.1 (R8), 2.4"
  cosa: >-
    Sulla UICPAL i GPIO38, 39 e 40 sono SD_CMD, SD_CLK e SD_DATA della sede microSD. Se la scheda ha i soliti pull-up da
    circa 10 kOhm su CMD e DATA, il pull-down R8 da 100 kOhm della linea dei microfoni (GPIO40, D-074) non porta la
    linea a 0: la tiene a circa 3,0 V quando i microfoni non trasmettono. Non e' un danno, ma R8 non fa quello che D-074
    chiede. Con una microSD inserita, la scheda TF userebbe le stesse linee dei microfoni e dell'audio (piano A: niente
    microSD).
  prove:
    - "docs/dimensioni-componenti.md:82-84 (GPIO38 SD_CMD, GPIO39 SD_CLK, GPIO40 SD_DATA)"
    - "docs/piano-elettronica-software.md:81, :105, :110 (piano A senza microSD)"
    - "docs/decisioni.md D-074 (pull-down da 100 kOhm)"
  opzioni:
    - "Al passo 4.03, a scheda spenta, misurare la resistenza fra GPIO40 e 3V3: se e' intorno a 10 kOhm c'e' il pull-up, R8 si toglie (o resta, annotato come inutile) e il firmware tiene conto del livello alto a riposo."
    - "Avviso al passo 4.03: nessuna microSD nella scheda."
  consiglio: Tutte e due; il risultato della misura va in cablaggio.md 3.5.
  domanda: "Quando arriva la scheda: puoi misurare con il multimetro la resistenza fra il pin GPIO40 e il pin 3V3, a scheda spenta?"

- id: S-22
