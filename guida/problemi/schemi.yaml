  cosa: >-
    La massa della seriale va dalla SSC-32 alla basetta (E-3), quella di VL dalla SSC-32 alla massa della 2813 (passo
    8.18), e la basetta e' a sua volta collegata alla 2813 (S-13). Se sul clone VL- e la massa di VS sono comuni, una
    parte del ritorno dei servo puo' passare sui 26 AWG della logica invece che sul 14 AWG verso il Wago: lo fa anche
    con il solo filo di VL-. Il filo di massa della seriale aggiunge un secondo giro.
  prove:
