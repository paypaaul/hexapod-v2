    - "Se sono uniti e si tiene il filo di massa della seriale: accettarlo e scriverlo, e misurare in P4 la caduta sulla massa della basetta con i servo sotto sforzo."
  consiglio: Misurare prima di 8.20; se uniti, senza il Dupont di massa.
  domanda: "Sulla SSC-32, con il multimetro: il morsetto VL- e' collegato alle file di massa dei servo?"

