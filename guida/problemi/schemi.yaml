  cosa: >-
    CE1 sdraiato occupa le colonne A e B fra le righe 5 e 9: ci sta con Ø 6,3, non con Ø 8 (predisposizioni.md: 6,3-8).
    La 100 kOhm dei microfoni (D-074) non trova tre passi liberi sul lato componenti e sta sdraiata sul lato saldature, con
