- id: S-19
  titolo: Le teste M3 del vassoio stanno 0,3 mm sotto la basetta, proprio sotto tre pin dell'ESP32 che servono
  gravita: bloccante
  dove: "4.04; schemi.md 1.0; basetta_saldature.svg (zone rosse)"
  cosa: >-
    Il vassoio si avvita sui distanziali con quattro M3 x 6 a testa cilindrica (DIN 912: Ø 5,5 x 3 [V norma]) a
    (30; +-12,5) e (75; +-12,5). Le teste arrivano a z 5,6, la basetta parte da z 5,9: restano 0,3 mm. Sotto le teste
    cadono i pin degli strip T-2 (3V3), D-12 (GPIO21, TX verso la SSC-32) e, al limite, B-2 (GPIO14): servono tutti e
    tre e non si possono spostare (GPIO21 e 14 decisi da D-012, nessun GPIO libero). Una saldatura, anche piatta, e' alta
    0,5-1 mm: la testa metallica toccherebbe il pin, e dove una testa sta sotto due pin vicini (C-12 e D-12, GPIO20 e 21)
    li unirebbe. Lo schema tiene tutto il resto fuori dalle zone (nessun altro giunto, nessun filo, pin non usati non
    saldati); quei tre pin restano.
  prove:
    - "guida/dati/fori.json, Corpo_Vassoio foro_pa/pb/aa/ab (piano del vassoio z 1,0-2,6)"
    - "cad/script/corpo.py:86 (cor_bas_luce 3,3: 'sotto ci sono le teste M3 alte 3')"
    - "docs/BOM.md:114 (vassoio sui distanziali con M3 x 6), :60 (B18)"
    - "docs/decisioni.md D-053 (basetta da z 5,9)"
    - "docs/piano-elettronica-software.md 2.3 (nessun GPIO libero)"
  opzioni:
    - "Teste basse per le quattro viti del vassoio: DIN 7984 (Ø 5,5 x 2,0) lascia 1,3 mm, ISO 7380 a testa bombata (Ø 5,7 x 1,65) lascia 1,65 mm [V norma]. Kapton sulle teste, code di T-2, D-12 e B-2 tagliate a filo prima di saldare, giunti piatti."
    - "CAD 2.1.7: viti del vassoio fuori dall'ingombro della basetta (|y| oltre 17,5 o x fuori da 22-78), oppure colonnine piu' alte (cor_bas_luce), se sopra l'ESP32 c'e' posto."
