    l'altezza) e un punto a X 79. Nell'immagine 7.11 un cuneo giallo grande sul lato destro della parete di coda
    sembra una seconda sede; le due fessure vere sono le macchie piccole ai lati del portafusibile. Il passo
    le nomina con due etichette "fessura" a X -77, |Y| 22,7 per non dipendere dal cuneo.
  prove:
    - "cad/script/corpo.py:408-410 (fessura_cavi_*: blocco alto cor_tetto_sp, lungo cor_cavi_x)"
    - "build/guida/cad/zone/Corpo_Base__fessura_cavi_s.ply e _d.ply: estremi X -85,4 / -70,4 / 79 (ply letto con numpy)"
    - "build/guida/img/corpo/7.11.png, cuneo giallo a destra della parete di coda"
  opzioni:
    - "Rifare l'esportazione della zona con le sole facce del taglio (esporta_guida.py zone, lista in guida/catalogo/zone.yaml)."
    - "Lasciare le due etichette e ignorare il cuneo."
  consiglio: "Rifare l'esportazione della zona; per ora il passo funziona con le etichette."

- titolo: "Prese delle luci contate come 'Prese dei piedi (X5)' nell'apertura della sezione 7 e nel riquadro del passo 7.10"
  gravita: minore
  dove: "apertura della sezione 7, 7.10"
  cosa: >-
    corpo/Prese_piedi e corpo/Prese_luci sono lo stesso componente (Rif_Prese_Piedi), e guida/catalogo/pezzi.yaml ha
    una sola voce, "Prese dei piedi", con x: X5. L'elenco dei pezzi dell'apertura e il riquadro di 7.10 mostrano quindi
