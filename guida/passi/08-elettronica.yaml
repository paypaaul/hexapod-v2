      - "Posa la spina IDC sopra l'ESP32, senza fissarla: si innesta nella scheda del carapace (sezione 13)."
    tabella:
      intestazione: [Polo, Segnale, Polo, Segnale]
      righe:
        - ["1", "+5 V (LED e audio)", "2", "+5 V (LED e audio)"]
        - ["3", "massa", "4", "dato dei LED a 5 V, dopo il buffer"]
        - ["5", "massa", "6", "SCL"]
        - ["7", "+3,3 V sensori", "8", "SDA"]
        - ["9", "massa", "10", "BCLK I2S"]
        - ["11", "WS I2S", "12", "dati dei microfoni"]
        - ["13", "dati verso l'amplificatore", "14", "riserva (XSHUT del ToF del mento, X25)"]
        - ["15", "pulsante A (2813)", "16", "pulsante B (2813)"]
    avvisi:
      - {tipo: opzionale, x: X2, quando: meglio_ora, testo: "Senza scheda del carapace salta questo passo: niente pulsante, luci del carapace né audio. Dopo costa smontare il carapace."}
      - {tipo: attenzione, testo: "I poli 1 e 2 portano il 5 V dei LED, il 7 il 3,3 V dei sensori: non scambiarli. Nella piattina il polo n sta accanto al n + 1: non cambiare l'ordine."}
      - {tipo: nota, testo: "I poli 10–13 sono l'I2S di microfoni e amplificatore: GPIO38, 39, 40 e 2. I poli 15 e 16 sono il pulsante, in parallelo al pulsantino della 2813 (D-059)."}
    attrezzi: [saldatore, tronchesino, multimetro]
    fonti:
      - "docs/cablaggio.md 3.5 (piedinatura 2 × 8)"
      - "docs/predisposizioni.md 2.3 (connettore del carapace)"
      - "docs/piano-elettronica-software.md 2.3 (GPIO38, 39, 40, 2, 48)"
      - "D-059, D-074"
      - "guida/passi/04-banco.yaml 4.05 (scheda del carapace)"
      - "guida/problemi/elettronica.yaml, schemi mancanti"

  - id: "8.24"
    titolo: Prese dei piedi verso l'ADC
    formato: grande
    vista: corpo_alto
    etichette:
      - {testo: "prese dei piedi", chiave: corpo/Prese_piedi}
      - {testo: "ADC", chiave: corpo/ADC}
    testo:
      - "Salda un filo per ogni presa: dal polo del segnale al suo ingresso della striscia dei partitori."
      - "Salda un filo di massa dal polo di massa di ogni presa alla massa della striscia."
      - "Porta i fili sul tetto, fino all'asola del vassoio."
      - "Annota nella tabella quale presa va a quale canale."
    tabella:
      intestazione: [Presa, "Zampa [C]", Canale ADS7830, Polarità]
      righe:
        - ["1", "AS", "0", "segnale e massa; il 3,3 V non esce dal corpo"]
        - ["2", "MS", "1", "come sopra"]
        - ["3", "PS", "2", "come sopra"]
        - ["4", "AD", "3", "come sopra"]
        - ["5", "MD", "4", "come sopra"]
        - ["6", "PD", "5", "come sopra"]
    avvisi:
      - {tipo: opzionale, x: X5, quando: anche_dopo, testo: "Senza FSR salta questo passo. Le prese si raggiungono a carapace tolto, i fili sotto il vassoio no."}
      - {tipo: nota, testo: "Il polo del 3,3 V di ogni presa resta vuoto: lungo la zampa passano solo massa e segnale (predisposizioni.md 2.5). Canali: AS, MS, PS, AD, MD, PD = 0…5, proposta di robot.yaml [C]."}
    attrezzi: [saldatore, spelafili]
    fonti:
      - "docs/cablaggio.md 3.3 (Sensore di forza: prese dei piedi, ADS7830 canali 0–5; spina JR a 2 poli su 3)"
      - "docs/predisposizioni.md X5 e 2.5 (masse)"
      - "robot/robot.yaml"
      - "guida/passi/07-corpo.yaml 7.11 (prese)"

  - id: "8.25"
    titolo: Prese delle luci
    formato: grande
    vista: corpo_alto
    etichette:
      - {testo: "prese delle luci", chiave: corpo/Prese_luci}
      - {testo: "basetta", chiave: corpo/Basetta}
    testo:
      - "Unisci in parallelo i poli omonimi delle sei prese con un filo di rame nudo."
      - "Salda un filo di massa, uno di +5 V e uno di dato dalla fila alla basetta."
      - "Porta i tre fili sul tetto, fino alla basetta."
    tabella:
      intestazione: [Polo della spina JR, Segnale, Va a]
      righe:
        - ["come il filo marrone di un servo", "massa", "massa della basetta"]
        - ["come il filo rosso", "+5 V, dopo il PTC", "5 V dei LED, basetta"]
        - ["come il filo arancio", "dato, dal buffer", "uscita del buffer SN74AHCT125N, dopo il 330 Ω"]
    avvisi:
      - {tipo: opzionale, x: X31, quando: anche_dopo, testo: "Senza luci nelle tibie salta questo passo."}
      - {tipo: attenzione, testo: "Qui ci sono +5 V e dato a 5 V, non servo: non collegare mai un servo alle prese delle luci (D-069). Le sei tibie ripetono i primi sei pixel: ramo in parallelo (cablaggio.md 5.2)."}
    attrezzi: [saldatore, spelafili]
    fonti:
      - "docs/cablaggio.md 3.3 (Luci della tibia: spina JR a 3 poli, massa, +5 V, dato) e 5 (punti 1, 2, 3)"
      - "D-069: seconda fila di sei prese, speculare a quella dei piedi"
      - "docs/predisposizioni.md 2.4 (protezioni, PTC) e X31"
      - "guida/passi/07-corpo.yaml 7.11"

  - id: "8.26"
    titolo: NTC sulle bobine dei regolatori
    formato: grande
    vista: {direzione: [0.85, 0.15, 0.85], su: [0, 0, 1]}
    etichette:
      - {testo: "NTC S", chiave: corpo/Regolatore_S}
      - {testo: "NTC D", chiave: corpo/Regolatore_D}
    testo:
      - "Controlla le NTC incollate sulle bobine e i loro fili, dal passo 4.10."
      - "Porta i fili dalle baie al vano sotto il vassoio, fuori dal camino d'aria dei regolatori."
      - "Collega la NTC sinistra al canale 6 e la destra al canale 7 della striscia dei partitori."
    avvisi:
      - {tipo: opzionale, x: X14, quando: meglio_ora, testo: "Senza NTC salta questo passo."}
      - {tipo: importante, testo: "Non coprire le feritoie né il camino d'aria delle baie anteriori (D-052): sotto il carapace il PLA rammollisce verso 55–60 °C."}
    attrezzi: [saldatore, spelafili]
    fonti:
      - "docs/cablaggio.md 3.4 (NTC dei regolatori: ADS7830 canali 6 e 7, fuori dal camino)"
      - "docs/piano-elettronica-software.md P4 (temperatura, regolatori)"
      - "D-052 (ventilazione dei regolatori)"
      - "docs/BOM.md X14"

  - id: "8.27"
    titolo: Controllo dei fili
    formato: mezzo
    vista: corpo_alto
    testo:
      - "Controlla che nessun filo sia teso, schiacciato sotto un pezzo o a contatto con una saldatura."
      - "Controlla che i fili dei rail e quelli del bus stiano a distanza, e si incrocino a 90°."
      - "Controlla che le spine IDC, Dupont e Qwiic siano innestate fino in fondo."
    avvisi:
      - {tipo: nota, testo: "Il carapace si toglie dall'alto con le viti, la spina IDC e il cicalino (cablaggio.md 4): lascia i fili del bus liberi sopra l'ESP32."}
    fonti:
      - "docs/cablaggio.md 3.4 e 4"
      - "docs/predisposizioni.md 2.2"

  - id: "8.28"
    titolo: Prove a freddo, ancora senza batteria
    formato: grande
    immagine: false
    testo:
      - "Controlla che il T-plug sia staccato e che F1 e F2 siano vuoti."
      - "Misura ogni riga della tabella con il multimetro in continuità o in resistenza."
      - "Annota il valore misurato."
      - "Se una riga non torna, fermati: trova il filo sbagliato prima di andare avanti."
    tabella:
      intestazione: [Punto, Atteso, Misurato]
      righe:
        - ["T-plug rosso, ingresso di F1", "continuità [V]", ""]
        - ["T-plug rosso, Wago +, con F1 vuoto", "aperto [V]", ""]
        - ["T-plug nero, Wago −", "continuità [V]", ""]
        - ["Wago + contro Wago −", "non 0 Ω; la lettura sale piano [S]", ""]
        - ["Barra VS1 contro barra VS2", "aperto [V]", ""]
        - ["Barra VS1 contro la sua massa", "non 0 Ω [V]", ""]
        - ["Uscita della 2813 contro massa", "non 0 Ω [V]", ""]
        - ["VL+ contro VL− della SSC-32", "non 0 Ω [V]", ""]
        - ["SDA contro 3,3 V, con ESP32 fuori", "1,0–1,4 kΩ, mai sotto 0,97 kΩ [S]", ""]
        - ["SCL contro 3,3 V, con ESP32 fuori", "1,0–1,4 kΩ, mai sotto 0,97 kΩ [S]", ""]
        - ["EN dei regolatori contro massa", "circa 47 kΩ [S]", ""]
        - ["GPIO1 contro massa", "circa 47 kΩ [S]", ""]
    avvisi:
      - {tipo: attenzione, testo: "Nessuna batteria: tutte le misure sono a freddo. La prima accensione è nella sezione 12, con F1 da 15 A."}
      - {tipo: prova, testo: "Con il pull-up sotto 0,97 kΩ stacca per primi i pull-up dei Pololu (IMU e ToF) e misura di nuovo [S] (piano-elettronica-software.md 2.4). Se non torna, annota il valore: dipende da uno schema non ancora disegnato [C]."}
    attrezzi: [multimetro]
    fonti:
      - "docs/piano-elettronica-software.md 2.4 (pull-up 1,0–1,4 kΩ, minimo 0,97 kΩ)"
      - "docs/BOM.md B10, B11 (47 kΩ, partitore 100 kΩ e 47 kΩ)"
      - "guida/passi/12-accensione.yaml 12.03 (stessa prova sul T-plug)"
      - "guida/problemi/elettronica.yaml, schemi mancanti"

rinviati: []
