      - "docs/cablaggio.md 3.3 (Sensore di forza) e 3.4 (NTC dei regolatori, canali 6 e 7)"
      - "docs/BOM.md X5 (partitori), X14"
      - "guida/problemi/elettronica.yaml, schemi mancanti"

