      - {chiave: corpo/Corpo_Base, lav: "guida_2813_*"}
    etichette:
      - {testo: "2813, A e B", chiave: corpo/Interruttore}
      - {testo: "cavo piatto, riga 13", punto: [50, -16, 9]}
    testo:
      - "Controlla il cavo piatto saldato al banco (4.15): il filo rosso è il polo 1."
      - "Porta i due fili dei poli 15 e 16 alla 2813 e saldali sui pin A e B [C]."
      - "Posa di lato sulla basetta, fuori dagli strip, la spina IDC con le due strisce: si innesta nel passo 13.19."
    tabella:
      intestazione: [Polo, Segnale, Polo, Segnale]
      righe:
        - ["1", "+5 V (LED e audio)", "2", "+5 V (LED e audio)"]
        - ["3", "massa", "4", "dato dei LED a 5 V, dopo il buffer"]
        - ["5", "massa", "6", "SCL"]
        - ["7", "+3,3 V sensori", "8", "SDA"]
        - ["9", "massa", "10", "BCLK I2S"]
        - ["11", "WS I2S", "12", "dati dei microfoni"]
        - ["13", "dati verso l'amplificatore", "14", "riserva, tagliato"]
        - ["15", "pulsante A (2813)", "16", "pulsante B (2813)"]
    avvisi:
      - {tipo: opzionale, x: X2, quando: meglio_ora, testo: "Senza scheda del carapace salta questo passo: niente pulsante, luci del carapace né audio. Dopo costa smontare il carapace."}
      - {tipo: importante, testo: "Tensione dei pin A e B misurata al banco (4.27, S-10): se supera 3,6 V, guarda S-10 prima di innestare la spina."}
      - {tipo: nota, testo: "Pulsante del carapace in parallelo al pulsantino della 2813 (D-059). Poli 10–13: I2S, GPIO38, 39, 40 e 2."}
    attrezzi: [saldatore, spelafili, multimetro]
    fonti:
      - "guida/schemi/schemi.md 1.6 (poli 1-13; 15 e 16 alla 2813) e sezione 3, riga 8.23"
      - "docs/cablaggio.md 3.5 (piedinatura 2 × 8)"
      - "guida/problemi/schemi.yaml S-10"
      - "D-059, D-074"

  # ------------------------------------------------------------------------------------------------ prese e sensori
  - id: "8.22"
    titolo: Prese dei piedi verso l'ADC
    formato: grande
    mostra: [corpo/Prese_piedi, corpo/ADC, corpo/IMU, corpo/Corpo_Piastrina_IMU, corpo/Corpo_Vassoio, corpo/SSC32]
    vista: {direzione: [0.3, 0.85, 0.45], su: [0, 0, 1]}
    evidenzia:
      - {chiave: corpo/Corpo_Base, lav: sede_prese}
    etichette:
      - {testo: "prese dei piedi", chiave: corpo/Prese_piedi}
      - {testo: "ADC", chiave: corpo/ADC}
    testo:
      - "Salda un filo per ogni presa: dal polo del segnale al suo ingresso della striscia dei partitori."
      - "Salda un filo di massa dal polo di massa di ogni presa alla massa della striscia."
      - "Porta i fili sul tetto, fino all'ADC."
      - "Annota nella tabella quale presa va a quale canale."
    tabella:
      intestazione: [Presa, "Zampa [C]", Canale ADS7830, Polarità]
      righe:
        - ["1", "AS", "0", "segnale e massa; il 3,3 V non esce dal corpo"]
        - ["2", "MS", "1", "come sopra"]
        - ["3", "PS", "2", "come sopra"]
        - ["4", "AD", "3", "come sopra"]
        - ["5", "MD", "4", "come sopra"]
        - ["6", "PD", "5", "come sopra"]
    avvisi:
      - {tipo: opzionale, x: X5, quando: anche_dopo, testo: "Senza FSR salta questo passo. Le prese si raggiungono a carapace tolto, i fili sotto il vassoio no."}
      - {tipo: nota, testo: "Il polo del 3,3 V di ogni presa resta vuoto: lungo la zampa passano solo massa e segnale (predisposizioni.md 2.5). Canali: AS, MS, PS, AD, MD, PD = 0…5, proposta di robot.yaml [C]."}
    attrezzi: [saldatore, spelafili]
    fonti:
      - "docs/cablaggio.md 3.3 (Sensore di forza: prese dei piedi, ADS7830 canali 0–5; spina JR a 2 poli su 3)"
      - "docs/predisposizioni.md X5 e 2.5 (masse)"
      - "robot/robot.yaml"
      - "guida/passi/07-corpo.yaml 7.11 (prese)"

  - id: "8.23"
    titolo: Prese delle luci
    formato: grande
    mostra: [corpo/Prese_luci, corpo/Basetta, corpo/Corpo_Vassoio, corpo/SSC32, corpo/IMU, corpo/Corpo_Piastrina_IMU]
    vista: {direzione: [0.3, -0.85, 0.45], su: [0, 0, 1]}
    evidenzia:
      - {chiave: corpo/Corpo_Base, lav: sede_prese_luci}
    etichette:
      - {testo: "prese delle luci", chiave: corpo/Prese_luci}
      - {testo: "K-13, B-13, T-13", punto: [50, -16, 9]}
    testo:
      - "Unisci in parallelo i poli omonimi delle sei prese con un filo di rame nudo."
      - "Accorcia i tre fili delle tibie che arrivano dalla basetta: massa (K-13), +5 V (B-13), dato con R9 (T-13)."
      - "Saldali sui tre poli della fila, come nella tabella."
      - "Controlla in continuità che nessun polo tocchi il vicino."
    tabella:
      intestazione: [Polo della spina JR, Segnale, Dalla basetta]
      righe:
        - ["come il filo marrone di un servo", "massa", "K-13"]
        - ["come il filo rosso", "+5 V, dopo il PTC", "B-13"]
        - ["come il filo arancio", "dato dal secondo canale del buffer, con R9 330 Ω", "T-13"]
    avvisi:
      - {tipo: opzionale, x: X31, quando: anche_dopo, testo: "Senza luci nelle tibie salta questo passo."}
      - {tipo: attenzione, testo: "Qui ci sono +5 V e dato a 5 V, non servo: non collegare mai un servo alle prese delle luci (D-069). Le sei tibie ripetono i primi sei pixel: ramo in parallelo (cablaggio.md 5.2)."}
      - {tipo: nota, testo: "Nessun condensatore sulle prese: si decide dopo la prova dei LED al massimo (S-23)."}
    attrezzi: [saldatore, spelafili, multimetro]
    fonti:
      - "guida/schemi/schemi.md 1.6 (K-13, B-13, T-13 con R9) e sezione 3, riga 8.25"
      - "guida/problemi/schemi.yaml S-23"
      - "docs/cablaggio.md 3.3 (Luci della tibia: spina JR a 3 poli, massa, +5 V, dato) e 5 (punti 1, 2, 3)"
      - "D-069: seconda fila di sei prese, speculare a quella dei piedi"

  - id: "8.24"
    titolo: NTC sulle bobine dei regolatori
    formato: grande
    vista: {direzione: [0.85, 0.15, 0.85], su: [0, 0, 1]}
    etichette:
      - {testo: "NTC S", chiave: corpo/Regolatore_S}
      - {testo: "NTC D", chiave: corpo/Regolatore_D}
    testo:
      - "Controlla le NTC incollate sulle bobine e i loro fili, dal passo 4.30."
      - "Porta i fili dalle baie al vano sotto il vassoio, fuori dal camino d'aria dei regolatori."
      - "Collega la NTC sinistra al canale 6 e la destra al canale 7 della striscia dei partitori."
    avvisi:
      - {tipo: opzionale, x: X14, quando: meglio_ora, testo: "Senza NTC salta questo passo."}
      - {tipo: importante, testo: "Non coprire le feritoie né il camino d'aria delle baie anteriori (D-052): sotto il carapace il PLA rammollisce verso 55–60 °C."}
    attrezzi: [saldatore, spelafili]
    fonti:
      - "docs/cablaggio.md 3.4 (NTC dei regolatori: ADS7830 canali 6 e 7, fuori dal camino)"
      - "docs/piano-elettronica-software.md P4 (temperatura, regolatori)"
      - "D-052 (ventilazione dei regolatori)"
      - "docs/BOM.md X14"

  # ------------------------------------------------------------------------------------------------ controlli, ESP32 e camera
  - id: "8.25"
    titolo: Controllo dei fili
    formato: mezzo
    vista: corpo_alto
    testo:
      - "Controlla che nessun filo sia teso, schiacciato sotto un pezzo o a contatto con una saldatura."
      - "Controlla che i fili dei rail e quelli del bus stiano a distanza, e si incrocino a 90°."
      - "Controlla che le spine Dupont e Qwiic siano innestate fino in fondo."
    avvisi:
      - {tipo: nota, testo: "Il carapace si toglie dall'alto con le viti, la spina IDC e il cicalino (cablaggio.md 4): lascia il cavo piatto libero sopra la basetta."}
    fonti:
      - "docs/cablaggio.md 3.4 e 4"
      - "docs/predisposizioni.md 2.2"

  - id: "8.26"
    titolo: Prove a freddo, ESP32 fuori
    formato: grande
    immagine: false
    testo:
      - "Controlla che il T-plug sia staccato, F1 e F2 vuoti, l'ESP32 fuori dagli strip."
      - "Misura ogni riga con il multimetro; per i pin dell'ESP32 metti il puntale nella presa dello strip."
      - "Annota il valore. Se una riga non torna, fermati: trova il filo sbagliato prima di andare avanti."
    tabella:
      intestazione: [Punto, Atteso, Misurato]
      righe:
        - ["T-plug rosso, ingresso di F1", "continuità [V]", ""]
        - ["T-plug rosso, Wago +, con F1 vuoto", "aperto [V]", ""]
        - ["T-plug nero, Wago −", "continuità [V]", ""]
        - ["Wago + contro Wago −", "non 0 Ω; la lettura sale piano [S]", ""]
        - ["Barra VS1 contro barra VS2; VS1 contro la sua massa", "aperto; non 0 Ω [V]", ""]
        - ["Uscita della 2813 contro massa; VL+ contro VL−", "non 0 Ω [V]", ""]
        - ["SDA (presa E-12) e SCL (presa I-2) contro 3V3 (presa T-2)", "circa 1,2–1,6 kΩ, mai sotto 0,97 [S]", ""]
        - ["ENA dei regolatori contro massa", "circa 11 kΩ, le due R3 in parallelo [S]", ""]
        - ["D2, prova diodi: rosso sulla presa P-12, nero su un ENA", "0,5–0,7 V; invertiti OL [S]", ""]
        - ["GPIO1 (presa R-12) contro massa", "32–47 kΩ [S]", ""]
        - ["GPIO41 (presa O-12) contro massa", "circa 100 kΩ, sulla 2813 [S]", ""]
    avvisi:
      - {tipo: attenzione, testo: "Nessuna batteria: tutte le misure sono a freddo. Il rail si accende solo nella sezione 12, con la batteria nel robot e F1 da 15 A (D-076, P-050)."}
      - {tipo: prova, testo: "Con il pull-up sotto 0,97 kΩ stacca per primi i pull-up dei moduli Pololu e dell'espansore e misura di nuovo (S-13). GPIO1 scende sotto 47 kΩ per R6 verso l'uscita della 2813."}
    attrezzi: [multimetro]
    fonti:
      - "guida/schemi/schemi.md 1.5 e sezione 3, riga 8.28"
      - "guida/problemi/schemi.yaml S-05 (R3 da 22 kΩ), S-13 (pull-up 1,2-1,6 kΩ)"
      - "docs/piano-elettronica-software.md 2.4 (pull-up 1,0–1,4 kΩ, minimo 0,97 kΩ)"
      - "guida/passi/12-accensione.yaml 12.03 (stessa prova sul T-plug)"

  - id: "8.27"
    titolo: ESP32 negli strip
    formato: grande
    nuovi: [corpo/ESP32]
    mostra: [corpo/Corpo_Vassoio, corpo/Basetta, corpo/ToF_frontale]
    esploso: {asse: [0, 0, 1], distanza: 40}
    vista: {direzione: [0.7, -0.45, 0.8], su: [0, 0, 1]}
    evidenzia:
      - {chiave: corpo/ESP32, lav: "corpo:usb_c"}
    etichette:
      - {testo: USB-C, punto: [16.4, 0, 64]}
    testo:
      - "Sposta di lato la spina IDC e i fili sopra la basetta."
      - "Posa l'ESP32 sugli strip: antenna verso la testa, USB-C verso la coda."
      - "Allinea i pin con gli strip, poi premi con i pollici ai lati dei pin, in piano."
      - "Controlla che la scheda sia piana e nessun pin sia fuori dallo strip."
    avvisi:
      - {tipo: attenzione, testo: "Non premere sull'antenna né sul modulo metallico: premi sul circuito, vicino agli strip."}
      - {tipo: nota, testo: "Il firmware è già caricato (sezione 4). USB-C e BOOT si raggiungono dallo sportellino (D-056)."}
    fonti:
      - "D-050: ESP32 con l'antenna in avanti, fuori dal carbonio"
      - "D-053: strip femmina"
      - "D-056: sportellino di servizio sopra USB-C e pulsanti"
      - "docs/dimensioni-componenti.md, ESP32-S3-CAM (nessun foro; USB-C sul lato corto opposto all'antenna)"

  - id: "8.28"
    titolo: Camera e flat
    formato: grande
    nuovi: [corpo/Camera]
    mostra: [corpo/Corpo_Vassoio, corpo/Basetta, corpo/ESP32, corpo/ToF_frontale]
    esploso: {asse: [0, 0, 1], distanza: 22}
    vista: {direzione: [0.15, -0.95, 0.3], su: [0, 0, 1]}
    evidenzia:
      - {chiave: corpo/ESP32, lav: "corpo:connettore_fpc"}
      - {chiave: corpo/Corpo_Vassoio, lav: mensola}
    etichette:
      - {testo: FPC, punto: [43, -9, 21]}
    testo:
      - "Controlla il connettore FPC al centro dell'ESP32, in giallo: se ha una levetta, alzala [C]."
      - "Infila il flat della camera nel connettore, fino in fondo, contatti contro contatti [C], e chiudi la levetta."
      - "Posa la testa della camera sulla mensola, contro la torretta: obiettivo verso la testa, flat verso l'alto."
      - "Piega il flat all'indietro, sopra la torretta e l'antenna, con una curva larga."
    avvisi:
      - {tipo: attenzione, testo: "Il flat è largo 6 mm e spesso 0,15 [S]: non piegarlo a spigolo, non tirarlo, non infilarlo storto."}
      - {tipo: importante, testo: "La camera è girata di 180° sull'asse ottico: il flat esce dall'alto della testa (D-051). Restano 61,5 mm di flat utili [S]. Da qui l'ESP32 non si toglie più senza staccare il flat."}
      - {tipo: nota, testo: "La testa è solo posata: davanti la tiene la visiera del carapace, a 0,9 mm dalla lente (D-057) [C]."}
    attrezzi: [pinzetta]
    fonti:
      - "D-051: flat della camera, camera girata di 180° sull'asse ottico"
      - "D-050, D-057"
      - "docs/dimensioni-componenti.md, 'Camera UICPAL OV3660-75MM' (flat 6 mm × 0,15, testa 8,5 × 8,5 × 6)"
      - "docs/predisposizioni.md 'Corpo_Vassoio' (mensola, torretta)"
      - "guida/problemi/elettronica.yaml, ToF e camera senza ritegno; verso del flat"

