# Sezione 8, elettronica nel corpo e cablaggio (D-075, docs/piano-guida.md "Struttura della guida", fase B3 di
# docs/piano-elettronica-software.md). F3, estrattore della sezione 8. Terna del robot, zampa di riferimento AS.
# Pezzi nuovi: SSC-32, piastrina dell'IMU, IMU, ADC, vassoio, basetta, ESP32, ToF frontale, camera, T-plug. Entrano come
# assiemi (preparati nella sezione 4): slitte con regolatori, supporti e INA260. Giunzioni: slitte, ssc32,
# piastrina_imu, imu, vassoio, basetta. Il portafusibile F1, i Wago, la 2813 e le prese sono della sezione 7.
# Ordine dei pezzi (piano-guida): slitte, SSC-32, IMU su piastrina e ADC PRIMA del vassoio, vassoio PRIMA della basetta,
# ESP32, ToF, camera. Due scelte di ordine fuori dal piano, per la fisica dei pezzi (guida/problemi/elettronica.yaml):
#  - i fili d'ingresso dei regolatori e quelli dei rail vanno stesi e saldati alle barre PRIMA di avvitare la SSC-32:
#    il Wago + sta a sinistra e il Wago - a destra, quindi un filo per rail attraversa il tetto del tunnel, dove
#    resteranno 8 mm sotto la scheda;
#  - il ToF va nella mensola PRIMA della camera: la cima della sua scheda passa a 0,2 mm sotto la testa della camera.
# Dopo i pezzi viene il cablaggio: potenza (T-plug, F1, Wago, spie), logica (F2, 2813, 5 V, partitore, abilitazione),
# bus (seriale della SSC-32, I2C, I2S nel cavo piatto), prese dei piedi e delle luci, prove a freddo.
# Gli schemi della basetta e della scheda del carapace non esistono (guida/schemi/ e' vuota): i collegamenti sono
# tabelle dalle fonti, marcate [C], e i posti sulla millefori non si dicono (primo problema).
# T-plug staccato in tutta la sezione: la batteria non e' nel corpo (sezione 11) e nessun passo accende niente.
sezione:
  id: elettronica
  numero: 8
  titolo: Elettronica nel corpo e cablaggio
  colore: "#c2255c"
  terna: robot
  istanza: AS
  presenti_iniziali:
    - corpo/Corpo_Base
    - corpo/Corpo_Chiglia
    - "corpo/Cuscinetto_Coxa_*"
    - "corpo/Servo_Coxa_*"
    - "corpo/Wago_*"
    - corpo/Interruttore
    - corpo/Portafusibile_F1
    - corpo/Prese_piedi
    - corpo/Prese_luci
  obiettivo: >-
    Montare nel corpo l'elettronica preparata al banco, poi collegarla: potenza, logica, bus. Niente si accende: la
    prima accensione è nella sezione 12.
  prima:
    - "Banco finito: basetta, SSC-32, ESP32 e regolatori sulle slitte pronti (sezione 4)."
    - "Corpo finito: Wago, 2813, F1 e prese montati (sezione 7); inserti a filo (sezione 3)."
    - "Scelto se montare X4, X6, X7, X8, X13, X2, X5 e X31: sotto il vassoio non si arriva più."
    - "Batteria fuori dal corpo (sezione 11)."
  tempo: "circa 6 ore la prima volta, con le saldature [S]"
  stato_elettrico: "T-plug staccato per tutta la sezione, F1 e F2 vuoti. Solo saldatore e multimetro in continuità."
  fonti: [D-075, docs/piano-guida.md "Struttura della guida", docs/piano-elettronica-software.md "P3", docs/cablaggio.md]
  attrezzi: [saldatore, multimetro, spelafili, tronchesino, croce_ph0, brugola_1_3, brugola_2_5, termorestringente, pinzetta]
  controllo:
    - "Slitte, SSC-32, vassoio e basetta avvitati, senza gioco; l'ESP32 è negli strip, antenna verso la testa."
    - "Con IMU, ADC, ToF e camera: ognuno al suo posto, con i fili e il flat che non toccano le saldature."
    - "Potenza: T-plug, F1 e Wago collegati; fra Wago + e Wago − non c'è un corto."
    - "Logica: F2 e 2813 collegati; uscita della 2813 a basetta e VL della SSC-32; abilitazione e spegnimento collegati."
    - "Bus: seriale della SSC-32, I2C di IMU, ADC, INA260 e ToF, cavo piatto del carapace."
    - "Le prove a freddo del passo 8.28 hanno tutte il risultato atteso."
    - "T-plug ancora staccato; F1 e F2 vuoti."
  vista_finale: {direzione: [0.75, -0.55, 0.65], su: [0, 0, 1]}


passi:
  - id: "8.01"
    titolo: Slitte con i regolatori
    formato: grande
    assiemi:
      - {chiavi: "corpo/*_S", esclusi: ["corpo/Microfono_*", "corpo/INA260_*"], nome: Slitta sinistra con regolatore (sezione 4)}
      - {chiavi: "corpo/*_D", esclusi: ["corpo/Microfono_*", "corpo/INA260_*"], nome: Slitta destra con regolatore (sezione 4)}
    giunzioni: [slitte]
    esploso: {asse: [0, 0, 1], distanza: 48}
    vista: {direzione: [0.85, 0.15, 0.85], su: [0, 0, 1]}
    testo:
      - "Prendi la slitta con il regolatore e, se lo monti, il supporto dell'INA260."
      - "Cala la slitta nella baia anteriore, fra le due guide della parete esterna, fino al ripiano."
      - "Accosta la vite M3 nell'inserto della parete, sopra il circuito del regolatore."
      - "Stringi piano la vite: la slitta non deve ballare."
      - "Ripeti nella baia destra: è la stessa slitta, ruotata."
    avvisi:
      - {tipo: importante, testo: "Con il supporto la vite è più lunga: M3 × 10 [C]; senza supporto basta la M3 × 8, disegnata qui. Presa nell'inserto, dal CAD: 5,6 mm con la M3 × 8, 5,2 con la M3 × 10 [V]."}
      - {tipo: nota, testo: "Con l'INA260 sopra, la vite non si raggiunge: la fessura sotto la scheda è alta 6,1 mm [V] (guida/problemi/elettronica.yaml). La slitta destra è la sinistra ruotata (D-051, D-066)."}
    attrezzi: [brugola_2_5]
    fonti:
      - "D-051: slitte fra due guide, vite M3 orizzontale sopra il circuito"
      - "D-066: supporti degli INA260, slitta destra uguale alla sinistra"
      - "guida/catalogo/giunzioni.yaml, slitte (M3 × 8, 2 viti)"
      - "docs/BOM.md, riga 'Slitte dei regolatori' e 'Viteria in più' (viti M3 più lunghe di 2,4 mm con i supporti)"
      - "guida/passi/04-banco.yaml 4.09 e 4.13"
      - "guida/problemi/elettronica.yaml, vite delle slitte"
      - "cad/script/corpo.py fai_slitta"

  - id: "8.02"
    titolo: Fili d'ingresso dei regolatori nei Wago
    formato: grande
    vista: {direzione: [-0.35, 0.8, 0.75], su: [0, 0, 1]}
    etichette:
      - {testo: "Wago +", chiave: corpo/Wago_piu}
      - {testo: "Wago −", chiave: corpo/Wago_meno}
      - {testo: "reg. S", chiave: corpo/Regolatore_S}
      - {testo: "reg. D", chiave: corpo/Regolatore_D}
    testo:
      - "Porta i fili rossi d'ingresso dei due regolatori al Wago + a sinistra."
      - "Porta i fili neri d'ingresso dei due regolatori al Wago − a destra."
      - "Fai passare i due fili che attraversano il tunnel sul tetto, dove andrà la SSC-32."
      - "Apri la leva, infila il filo spelato di 11 mm [C] fino in fondo, chiudi la leva."
    tabella:
      intestazione: [Filo 14 AWG, Da, A, Colore]
      righe:
        - ["Ingresso + sinistro", "regolatore sinistro, VIN", "Wago + (sinistra)", "rosso"]
        - ["Ingresso − sinistro", "regolatore sinistro, GND", "Wago − (destra)", "nero"]
        - ["Ingresso + destro", "regolatore destro, VIN", "Wago + (sinistra)", "rosso"]
        - ["Ingresso − destro", "regolatore destro, GND", "Wago − (destra)", "nero"]
    avvisi:
      - {tipo: attenzione, testo: "Rosso al +, nero al −. Il + sta a sinistra (+Y), il − a destra (−Y): controlla due volte prima di chiudere la leva."}
      - {tipo: importante, testo: "Questi fili si stendono prima della SSC-32: sotto la scheda restano 8 mm [V] e dopo il 14 AWG non si infila. Vale anche per il passo 8.04."}
    attrezzi: [spelafili]
    fonti:
      - "docs/cablaggio.md 3.1 'Ingresso dei regolatori' e 5, punto 6 (Wago + a sinistra, Wago − a destra, massa a stella)"
      - "docs/BOM.md B1, B13, B15 (14 AWG, 0,5 m + 0,5 m), 'Schema di alimentazione'"
      - "D-050: 12 AWG sotto la SSC-32 dal lato posteriore"
      - "D-055: Wago in piedi, ingressi in alto"
      - "cad/script/rif_componenti.py ssc_dist, ssc_retro_h"
      - "guida/passi/04-banco.yaml 4.10"
      - "guida/problemi/elettronica.yaml, percorso dei cavi di potenza"

  - id: "8.03"
    titolo: INA260 sul filo del rail
    formato: grande
    vista: {direzione: [0.85, 0.15, 0.85], su: [0, 0, 1]}
    etichette:
      - {testo: "INA260 S", chiave: corpo/INA260_S}
      - {testo: "INA260 D", chiave: corpo/INA260_D}
      - {testo: "reg. S", chiave: corpo/Regolatore_S}
      - {testo: "reg. D", chiave: corpo/Regolatore_D}
    nuovi: [corpo/INA260_S, corpo/INA260_D]
    esploso: {asse: [0, 0, 1], distanza: 30}
    testo:
      - "Avvita l'INA260 sul supporto con le due viti M2 × 5 [C], morsettiera in basso."
      - "Infila il filo rosso d'uscita del regolatore nel morsetto VIN+ dell'INA260 e stringi il morsetto."
      - "Infila un filo rosso 14 AWG nel morsetto VIN−: l'altro capo andrà alla barra VS (8.04)."
      - "Se il 14 AWG non entra, salda l'ultimo tratto [C]. Ripeti a destra."
    tabella:
      intestazione: [Filo 14 AWG, Da, A]
      righe:
        - ["Uscita + sinistra", "regolatore S, VOUT", "INA260 S, VIN+"]
        - ["Rail + sinistro", "INA260 S, VIN−", "barra VS1 (8.04)"]
        - ["Uscita + destra", "regolatore D, VOUT", "INA260 D, VIN+"]
        - ["Rail + destro", "INA260 D, VIN−", "barra VS2 (8.04)"]
    avvisi:
      - {tipo: opzionale, x: X7, quando: meglio_ora, testo: "Senza INA260 il filo d'uscita va diretto alla barra VS (8.04)."}
      - {tipo: importante, testo: "Morsettiera da 3,5 mm: forse solo fino a 16 AWG [C], e il rail porta fino a 13 A. Prova il filo prima."}
    attrezzi: [saldatore, spelafili, croce_ph0]
    fonti:
      - "docs/cablaggio.md 3.1 'Rail servo' (INA260 in serie sul positivo all'uscita di ogni regolatore; morsettiera C)"
      - "docs/predisposizioni.md X7"
      - "docs/BOM.md B15 (con l'INA260 la morsettiera potrebbe non prendere il 14 AWG)"
      - "guida/passi/04-banco.yaml 4.10 e 4.13"
      - "guida/problemi/elettronica.yaml, morsettiera dell'INA260"

  - id: "8.04"
    titolo: Fili dei rail sulle barre della SSC-32
    formato: grande
    in_evidenza: [corpo/SSC32]
    mostra: []
    vista: {direzione: [0.35, -0.55, -0.75], su: [0, 0, 1]}
    etichette:
      - {testo: "VS1 e massa", punto: [-14.5, 24.7, -1.4]}
      - {testo: "VS2 e massa", punto: [-14.5, -24.7, -1.4]}
    testo:
      - "Appoggia la SSC-32 capovolta accanto al robot, con le barre verso di te."
      - "Salda il filo rosso del rail sinistro a metà della barra VS1."
      - "Salda il filo nero d'uscita del regolatore sinistro a metà della barra di massa dello stesso lato."
      - "Ripeti a destra con la barra VS2 e la sua massa."
      - "Controlla in continuità che VS e massa di ogni lato non si tocchino."
    tabella:
      intestazione: [Filo 14 AWG, Barra, Lato della SSC-32]
      righe:
        - ["Rail + sinistro, rosso", "VS1, fila di mezzo", "sinistro, canali 0–15"]
        - ["Massa d'uscita sinistra, nero", "massa, fila al bordo", "sinistro, canali 0–15"]
        - ["Rail + destro, rosso", "VS2, fila di mezzo", "destro, canali 16–31"]
        - ["Massa d'uscita destra, nero", "massa, fila al bordo", "destro, canali 16–31"]
    avvisi:
      - {tipo: attenzione, testo: "Non saldare ai morsetti né alle piste: non portano la potenza dei servo. Ogni rail va a metà fila, su 16 pin."}
      - {tipo: nota, testo: "Dal bordo verso l'interno le file sono: massa, VS, segnale. VS1 sta a sinistra e VS2 a destra: invertirle cambia i canali di ogni lato (7.06) [C]."}
    attrezzi: [saldatore, multimetro]
    fonti:
      - "docs/BOM.md 'Schema di alimentazione', B15, B16 (fili d'uscita 0,6 m)"
      - "docs/cablaggio.md 1 (file degli header a |y| 23,5) e 3.1 'Rail servo'"
      - "docs/dimensioni-componenti.md, 'Servo controller SSC32-V2.5' (file: massa, VS, segnale)"
      - "guida/passi/04-banco.yaml 4.02 (barre)"
      - "guida/problemi/elettronica.yaml, percorso dei cavi di potenza"

  - id: "8.05"
    titolo: SSC-32 sulle bugne del tetto
    formato: grande
    nuovi: [corpo/SSC32]
    giunzioni: [ssc32]
    esploso: {asse: [0, 0, 1], distanza: 40}
    vista: corpo_alto
    testo:
      - "Controlla che i fili dei rail escano da sotto la scheda, uno per lato, senza schiacciarsi."
      - "Posa la SSC-32 sulle quattro bugne del tetto: morsettiera verso la testa, canali 0–15 a sinistra [C]."
      - "Allinea i quattro fori con gli inserti M2."
      - "Accosta le quattro viti M2 × 5, poi stringile piano."
    avvisi:
      - {tipo: attenzione, testo: "Stringi piano: la testa Ø 4 appoggia su un foro da 3,0 [C] e il circuito si scheggia."}
      - {tipo: nota, testo: "Da ora la micro-USB non si raggiunge (D-051): la scheda è già configurata (sezione 4). Le spine dei servo si collegano con le zampe (sezione 9) [C]. Fra la scheda e il vassoio restano 4 mm [V]."}
    attrezzi: [croce_ph0]
    fonti:
      - "D-051: inserti M2 nelle bugne del tetto, viti M2 con testa da 3,8 sui fori da 3,0"
      - "D-050"
      - "guida/catalogo/giunzioni.yaml, ssc32"
      - "docs/BOM.md, riga 'SSC-32 → bugne del tetto'"
      - "docs/dimensioni-componenti.md, 'Servo controller SSC32-V2.5'"
      - "cad/script/corpo.py fai_base (ssc_bugna_*)"

  - id: "8.06"
    titolo: Piastrina dell'IMU
    formato: mezzo
    nuovi: [corpo/Corpo_Piastrina_IMU]
    giunzioni: [piastrina_imu]
    mostra: [corpo/Corpo_Base]
    esploso: {asse: [0, 0, 1], distanza: 25}
    vista: {direzione: [0.25, -0.85, 0.7], su: [0, 0, 1]}
    testo:
      - "Posa la piastrina sulle due bugne del tetto, a destra, sotto il posto del vassoio."
      - "Accosta le due viti M2 × 5 svasate, con la brugola da 1,3 mm."
      - "Stringi piano: le teste restano a filo."
    avvisi:
      - {tipo: opzionale, x: X4, quando: meglio_ora, testo: "Dopo, sotto il vassoio si arriva solo smontando vassoio, basetta, ESP32 e camera. Senza IMU salta questo passo e il 8.07."}
    attrezzi: [brugola_1_3]
    fonti:
      - "D-074: piastrina sulle stesse bugne, due M2 × 5 svasate (con la Pololu 2798 niente piastrina)"
      - "D-066, blocco B: IMU sotto il vassoio"
      - "guida/catalogo/giunzioni.yaml, piastrina_imu"
      - "docs/predisposizioni.md X4 e 2.8"

  - id: "8.07"
    titolo: IMU sulla piastrina
    formato: grande
    nuovi: [corpo/IMU]
    giunzioni: [imu]
    mostra: [corpo/Corpo_Piastrina_IMU]
    esploso: {asse: [0, 0, 1], distanza: 25}
    vista: {direzione: [0.25, -0.85, 0.7], su: [0, 0, 1]}
    testo:
      - "Salda quattro fili sulle piazzole della GY-6500, dal lato dei pin, senza pin."
      - "Posa la scheda sulla piastrina: fili verso sinistra (+Y), asse X del chip verso la testa."
      - "Accosta le due viti M2 × 6 a croce nei fori pilota, poi stringile piano."
      - "Porta i quattro fili verso sinistra, fino all'asola del vassoio."
    tabella:
      intestazione: ["Filo [S]", Piazzola della GY-6500, Va a]
      righe:
        - ["nero", "GND", "massa della basetta"]
        - ["rosso", "VCC", "3,3 V dei sensori"]
        - ["blu", "SDA", "GPIO47"]
        - ["giallo", "SCL", "GPIO3"]
    avvisi:
      - {tipo: attenzione, testo: "Solo 3,3 V: le schede tirano SDA e SCL alla loro alimentazione e a 5 V porterebbero 5 V sull'ESP32."}
      - {tipo: nota, testo: "NCS, AD0 e FSYNC sono già tirati sulla scheda, senza fili [S]: indirizzo 0x68. Fili di circa 15 cm [S]."}
    attrezzi: [saldatore, spelafili, croce_ph0]
    fonti:
      - "D-074: GY-6500 su piastrina, due M2 × 6 in fori pilota Ø 1,7, pin verso +Y, 4 fili saldati sulle piazzole"
      - "docs/cablaggio.md 3.4 (ramo 'vano sotto il vassoio')"
      - "docs/predisposizioni.md X4 e 2.1"
      - "docs/piano-elettronica-software.md 2.4 (0x68)"
      - "guida/catalogo/giunzioni.yaml, imu"
      - "colori dei fili: standard Qwiic, non scritti in cablaggio.md [S]"

  - id: "8.08"
    titolo: ADC sulle bugne
    formato: grande
    nuovi: [corpo/ADC]
    mostra: [corpo/Corpo_Base, corpo/Corpo_Piastrina_IMU, corpo/IMU]
    esploso: {asse: [0, 0, 1], distanza: 25}
    vista: {direzione: [0.25, 0.85, 0.7], su: [0, 0, 1]}
    testo:
      - "Posa l'ADS7830 sulle due bugne a sinistra dell'IMU, ingressi verso il bordo sinistro [C]."
      - "Avvita la scheda con due viti M2 × 5 negli inserti [C], piano."
      - "Collega un cavetto Qwiic alla presa: i fili andranno all'asola."
    avvisi:
      - {tipo: opzionale, x: X6, quando: meglio_ora, testo: "Senza ADC salta questo passo e il 8.09."}
      - {tipo: importante, testo: "Fori e viti dell'ADS7830 non sono nel CAD né nel BOM [C]: prova sul pezzo."}
    attrezzi: [croce_ph0]
    extra: [{nome: "cavetti Qwiic 100 mm", qta: 3, bom: X1}]
    fonti:
      - "D-066, blocco B: IMU e ADC sul tetto del tunnel, bugne con inserti M2"
      - "docs/predisposizioni.md X6"
      - "docs/BOM.md, 'Viteria in più se si montano tutte' (viti M2 corte per l'ADC), X1, X6"
      - "docs/piano-elettronica-software.md 2.4 (0x48)"
      - "guida/problemi/elettronica.yaml, ADC senza viti"

  - id: "8.09"
    titolo: Striscia dei partitori
    formato: grande
    immagine: false
    testo:
      - "Taglia dalla millefori avanzata una striscia di 9 colonne [C]: sei piedi, due NTC, la massa."
      - "Salda su ogni canale 0–5 una resistenza da 10 kΩ 1 % (BOM X5) fra l'ingresso e il 3,3 V."
      - "Salda su ogni canale 0–5 un condensatore ceramico da 100 nF (BOM B8) fra l'ingresso e la massa."
      - "Salda sui canali 6 e 7 una resistenza da 10 kΩ 1 % fra l'ingresso e il 3,3 V."
      - "Controlla in continuità ogni ingresso: nessun corto con il 3,3 V o con la massa."
    tabella:
      intestazione: [Canale ADS7830, Collegamento, Dove arriva il sensore]
      righe:
        - ["0, 1, 2, 3, 4, 5", "10 kΩ al 3,3 V, 100 nF a massa; l'FSR va fra l'ingresso e la massa [S]", "prese dei piedi: AS, MS, PS, AD, MD, PD [C]"]
        - ["6, 7", "10 kΩ al 3,3 V; la NTC va fra l'ingresso e la massa [S]", "NTC dei regolatori sinistro e destro (8.26)"]
    avvisi:
      - {tipo: opzionale, x: X6, quando: meglio_ora, testo: "Senza ADC salta questo passo. Con l'ADC ma senza FSR (X5) servono i canali 6 e 7 per le NTC (X14)."}
      - {tipo: importante, testo: "Non fissare la striscia: nel CAD non ha un posto e lo schema non è disegnato (guida/problemi/elettronica.yaml). Tienila accanto all'ADC [C]."}
    attrezzi: [saldatore, tronchesino, multimetro]
    fonti:
      - "docs/predisposizioni.md X5 (partitori: 10 kΩ 1 % verso il 3,3 V e 100 nF a massa sulla striscia dei partitori; lettura invertita) e X6"
      - "docs/cablaggio.md 3.3 (Sensore di forza) e 3.4 (NTC dei regolatori, canali 6 e 7)"
      - "docs/BOM.md X5 (partitori), X14"
      - "guida/problemi/elettronica.yaml, schemi mancanti"

  - id: "8.10"
    titolo: Vassoio sui distanziali
    formato: grande
    nuovi: [corpo/Corpo_Vassoio]
    giunzioni: [vassoio]
    mostra: [corpo/Corpo_Base, corpo/SSC32, corpo/Corpo_Piastrina_IMU, corpo/IMU, corpo/ADC]
    esploso: {asse: [0, 0, 1], distanza: 45}
    vista: {direzione: [0.7, -0.45, 0.8], su: [0, 0, 1]}
    testo:
      - "Avvita a mano i quattro distanziali maschio-femmina negli inserti delle bugne del tetto."
      - "Passa i fili di IMU e ADC nell'asola 6 × 3 del vassoio, a sinistra."
      - "Cala il vassoio sui distanziali: torretta della camera verso la testa."
      - "Accosta le quattro viti M3 × 6 dall'alto, nei distanziali, poi stringile piano."
    avvisi:
      - {tipo: importante, testo: "Prima del vassoio: IMU e ADC avvitati, con i loro fili. Dopo, sotto il vassoio si arriva solo smontando vassoio, basetta, ESP32 e camera (predisposizioni.md 2.8)."}
