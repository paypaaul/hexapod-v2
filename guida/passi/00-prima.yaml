# Sezione 0, prima di cominciare (D-075, docs/piano-guida.md "Struttura della guida"). F3, estrattore della sezione.
# Nessun pezzo montato. Passi solo testo e tabelle (come si legge, verbi, avvisi, sicurezza, opzioni X, inventario,
# ordine e tempi) e tre immagini con etichette (zampe, lati A e B, terne). Il foglio delle viti 1:1 e l'elenco generale
# dei pezzi li genera l'impaginatore; gli schemi elettrici li aggiunge la riconciliazione.
# Nelle tabelle piu' larghe del mezzo foglio (134 mm) le celle sono corte: i passi senza figura sono a mezzo foglio, due
# per pagina. Il "quando" delle opzioni X e i tempi non sono in nessun documento: vedi guida/problemi/prima.yaml.
sezione:
  id: prima
  numero: 0
  titolo: Prima di cominciare
  colore: "#0c8599"
  terna: robot
  istanza: AS
  obiettivo: >-
    Sapere come si legge la guida, quali regole di sicurezza valgono, come si chiamano le zampe e i lati, quali opzioni
    montare e in che ordine fare le sezioni. Poi controllare di avere tutto prima di cominciare.
  prima:
    - "Guida stampata in A4 orizzontale al 100 %, senza adattare alla pagina: le viti del riquadro dei pezzi sono a grandezza vera."
    - "docs/BOM.md, versione 2.2, a portata di mano per i codici delle voci (A1, B5, D4, X5)."
  tempo: "circa 1 ora per leggere e controllare l'inventario [S]"
  stato_elettrico: "nessuno: batteria e T-plug staccati, niente collegato."
  note: >-
    Questa sezione non monta niente. Le immagini mostrano il robot intero solo per dare i nomi delle zampe, dei lati e
    degli assi.
  attrezzi: [brugola_2_5, brugola_1_3, croce_ph0, saldatore_inserti, saldatore, calibro, multimetro, tronchesino, spelafili, termorestringente, alimentatore_limitato]
  fonti: [D-075, docs/piano-guida.md "Struttura della guida", guida/stile.md]
  controllo:
    - "Una vite M3 × 8 vera, appoggiata al suo disegno nella pagina di apertura della sezione 6, ne copre esattamente la lunghezza."
    - "Sai dire quale zampa è AS e quale PD, e dove sono il lato A e il lato B."
    - "Hai letto le regole di sicurezza: batteria, fusibili, saldatore e inserti, servo sotto tensione."
    - "Hai segnato quali opzioni X monti, e hai capito quali si decidono adesso."
    - "L'inventario è spuntato e i punti da guardare sono risolti o annotati."

passi:
  - id: "0.01"
    titolo: Come si legge la guida
    formato: mezzo
    immagine: false
    tabella:
      intestazione: [Segno, Significa]
      righe:
        - ["Numero grande, per esempio 6.04", "Sezione 6, passo 4. I passi si fanno nell'ordine dei numeri."]
        - ["Pezzo a colori pieni, contorno spesso", "Il pezzo che monti in questo passo. Quelli già montati sono sbiaditi."]
        - ["Freccia blu larga", "Il pezzo nuovo va da dove parte la freccia a dove arriva."]
        - ["Freccia blu stretta", "Una vite o un inserto: dalla punta della freccia al foro."]
        - ["Giallo", "La sede o il percorso da guardare: dove va quello che il modello non ha (fili, striscia luminosa)."]
        - ["Nome nero sull'immagine", "Il nome di un pezzo o di un verso. PIATTO è il piano della stampante: il pezzo si posa con quella faccia in basso."]
        - ["Pezzo a colori pieni, senza freccia", "Sezioni 1 e 2: un pezzo da stampare, provare o misurare, non da montare."]
        - ["Colore ottone", "Un inserto a caldo."]
        - ["Riquadro grigio con miniature", "I pezzi del passo, con le viti a grandezza vera (1:1)."]
        - ["Riquadro 2×", "Il passo si fa due volte uguale, per esempio sui due lati."]
        - ["6× nella fascia in alto", "La sezione si rifà sei volte, una zampa alla volta."]
        - ["Punto di controllo", "A fine sezione: spunta ogni frase prima di andare avanti."]
        - ["Scheda a spunta", "Una riga per zampa: annota il servo usato e le scelte fatte."]
    testo:
      - "Segui i passi nell'ordine dei numeri."
      - "Guarda prima l'immagine, poi leggi il testo."
      - "Appoggia la vite vera sul suo disegno 1:1 per riconoscerla."
      - "Spunta il punto di controllo di ogni sezione prima di passare alla successiva."
    avvisi:
      - {tipo: importante, testo: "Stampa la guida in A4 orizzontale al 100 %: con un adattamento alla pagina le viti 1:1 non hanno più la misura vera."}
      - {tipo: nota, testo: "La guida è una bozza: la prima zampa vera la corregge, in una versione 1.1 (docs/piano-guida.md). Se un passo non torna con il pezzo che hai in mano, fermati e annota."}
    fonti: [D-075, docs/piano-guida.md "Architettura" e "Struttura della guida", guida/css/guida.css, guida/catalogo/stile.yaml]

  - id: "0.02"
    titolo: I verbi della guida
    formato: mezzo
    immagine: false
    tabella:
      intestazione: [Verbo, Significa]
      righe:
        - ["Accosta", "Avvita finché la testa tocca, senza stringere."]
        - ["Stringi", "Stringi a fondo, senza forzare la plastica."]
        - ["Infila", "Fai scorrere un pezzo in una sede, senza forza."]
        - ["Premi", "Forzamento: con il pollice o con una morsa a ganasce morbide."]
        - ["Posa", "Appoggia nella posizione finale, senza fissare."]
        - ["Cala", "Fai scendere dall'alto in una sede o in una culla."]
        - ["Ruota", "Gira fino alla posizione indicata (angolo o riferimento)."]
        - ["Collega", "Innesta un connettore, nel verso indicato."]
        - ["Salda", "Saldatura a stagno."]
        - ["Controlla", "Verifica senza attrezzi. Se non va, fermati."]
        - ["Misura e annota", "Misura con l'attrezzo e scrivi il valore nel registro delle misure (appendice)."]
        - ["Annota", "Scrivi un dato (numero del servo, scelta fatta) nella scheda della sezione."]
        - ["Togli", "Stacca o rimuovi un pezzo o una parte (gommini, pellicole, un pezzo da rimontare dopo)."]
    testo:
      - "Leggi il verbo all'inizio di ogni riga: dice cosa fare e come."
      - "Fai un'azione per riga, nell'ordine in cui le leggi."
    avvisi:
      - {tipo: nota, testo: "Ogni verbo di questa tabella vale sempre lo stesso. Gli altri (Taglia, Incolla, Metti) hanno il significato di tutti i giorni (guida/stile.md)."}
    fonti: [D-075, guida/stile.md "Verbi con un significato fisso"]

  - id: "0.03"
    titolo: Viti, inserti e rondelle
    formato: mezzo
    immagine: false
    tabella:
      intestazione: [Pezzo, Come lo riconosci, Attrezzo]
      righe:
        - ["Vite M3 × 5, × 6, × 8, × 10, × 16", "Testa cilindrica con esagono incassato (ISO 4762). La lunghezza è sotto la testa.", "brugola 2,5"]
        - ["Vite M2 × 5 a croce", "Testa tonda con croce (ISO 7045). La lunghezza è sotto la testa.", "croce PH0"]
        - ["Vite M2 × 5 svasata", "Testa piana a cono, nera (ISO 10642). La lunghezza comprende la testa.", "brugola 1,3"]
        - ["Rondella M3", "Piatta, Ø7 con foro da 3,2 (DIN 125).", "–"]
        - ["Inserto M3 o M2", "Bussola di ottone, Ø4,2 o Ø3,2, filettata dentro.", "saldatore per inserti"]
        - ["Distanziale M3", "Maschio-femmina da 5 mm.", "a mano"]
    testo:
      - "Appoggia la vite vera sul suo disegno 1:1: lunghezza e testa devono coincidere."
      - "Misura la lunghezza sotto la testa; per le svasate, tutta."
      - "Controlla il tipo di testa prima di prendere il cacciavite."
    avvisi:
      - {tipo: importante, testo: "Le viti M3 × 8 delle alette lato albero non vanno in un inserto: si fanno il filetto da sole nei fori pilota Ø2,5 (D-049)."}
      - {tipo: nota, testo: "Le misure dei disegni sono quelle della norma (guida/catalogo/viteria.yaml); le viti del tuo kit possono differire di qualche decimo [C]."}
    fonti: [guida/catalogo/viteria.yaml, docs/BOM.md D4 D5 D6 D7 D8 D8b B18, D-049, D-073]

  - id: "0.04"
    titolo: Avvisi e dati marcati
    formato: mezzo
    immagine: false
    tabella:
      intestazione: [Segno, Significa]
      righe:
        - ["ATTENZIONE", "Pericolo per le persone o danno a un pezzo (batteria, saldatore, servo sotto carico, polarità)."]
        - ["IMPORTANTE", "Errore facile che costringe a smontare."]
        - ["NOTA", "Il perché, un trucco, un riferimento (D-0xx: la decisione in docs/decisioni.md)."]
        - ["OPZIONALE Xn", "Una predisposizione: salta il passo se non la monti."]
        - ["solo ora", "Dopo non si può più."]
        - ["meglio ora", "Dopo si può, ma costa smontare qualcosa."]
        - ["anche dopo", "Si aggiunge più avanti senza smontare."]
        - ["PROVA", "Una prova da fare prima di andare avanti, con il risultato atteso."]
        - ["[V]", "Dato verificato su fonte primaria o nel CAD."]
        - ["[S]", "Dato stimato o da fonte secondaria."]
        - ["[C]", "Dato da confermare, di solito con un provino o con il pezzo vero."]
    testo:
      - "Leggi gli avvisi prima di fare il passo."
      - "Ferma il lavoro davanti a un avviso ATTENZIONE finché non hai capito il rischio."
      - "Fidati di un dato [C] solo dopo la prova indicata."
    avvisi:
      - {tipo: nota, testo: "I dati [C] sono quelli che il progetto non ha potuto misurare da solo: servo e schede del venditore. I servo non si misurano (CLAUDE.md, decisioni dell'utente)."}
    fonti: [D-075, guida/stile.md "Avvisi" e "Numeri e nomi"]

  - id: "0.05"
    titolo: Sicurezza, la batteria
    formato: mezzo
    immagine: false
    testo:
      - "Tieni il T-plug staccato in ogni sezione che non lo chiede."
      - "Isola ogni capo scoperto prima di collegare la batteria."
      - "Controlla la batteria prima di ogni uso: non usarla se è gonfia, ammaccata o con i cavi danneggiati."
      - "Stacca il T-plug e la presa di bilanciamento a fine uso."
    avvisi:
      - {tipo: attenzione, testo: "Batteria OVONIC 2S 5200 mAh 50C: 260 A continui dichiarati [V]. Un cortocircuito fonde i cavi e può incendiare il pacco."}
      - {tipo: attenzione, testo: "Il cicalino BX100 assorbe sempre dalla presa di bilanciamento: scollegalo a fine uso, o scarica la batteria (BOM, schema di alimentazione)."}
      - {tipo: nota, testo: "Il T-plug è anche il sezionamento d'emergenza dei servo: sta in coda, a portata di mano (BOM B12, D-069)."}
      - {tipo: nota, testo: "Sotto 3,5 V per cella il firmware spegne il rail dei servo; la logica resta accesa fino a 3,3 V per cella (software.md 2.6) [S]."}
    fonti: [docs/BOM.md A5 e "Schema di alimentazione", docs/cablaggio.md 4, docs/software.md 2.6, D-069, D-045]

  - id: "0.06"
    titolo: Sicurezza, la carica
    formato: mezzo
    immagine: false
    testo:
      - "Carica solo con un caricabatterie per LiPo 2S con bilanciamento, sulla presa JST-XH."
      - "Imposta 2 celle: 8,4 V a fine carica [V], cioè 4,20 V per cella [S]."
      - "Imposta la corrente di carica dal manuale OVONIC [C]."
      - "Carica su una superficie che non brucia, e resta presente."
      - "Stacca il pacco quando la carica è finita."
    avvisi:
      - {tipo: importante, testo: "Il progetto non dice come si carica il pacco: il caricabatterie non è nel BOM, e corrente di carica e conservazione vanno lette sul manuale OVONIC [C]. Le altre regole di questa pagina sono regole generali sulle LiPo [S]."}
      - {tipo: attenzione, testo: "Non caricare un pacco gonfio, ammaccato o caldo."}
      - {tipo: nota, testo: "Per lasciare il pacco fermo per giorni portalo a metà carica, con la modalità di conservazione del caricabatterie [S]."}
    fonti: [docs/BOM.md A5, docs/studio-componenti.md "Batteria", D-045, guida/problemi/prima.yaml, guida/problemi/batteria.yaml]

  - id: "0.07"
    titolo: Sicurezza, pacco caldo o gonfio
    formato: mezzo
    immagine: false
    testo:
      - "Allontanati dalle zampe e dal pacco se senti calore o il pacco si gonfia."
      - "Stacca il T-plug solo se puoi farlo senza toccare il pacco."
      - "Porta il robot all'aperto, su una superficie che non brucia, se è sicuro farlo."
      - "Non usare e non caricare più un pacco che si è gonfiato."
      - "Chiama i soccorsi se c'è fuoco o fumo denso."
    avvisi:
      - {tipo: attenzione, testo: "Un pacco LiPo danneggiato può prendere fuoco anche a robot spento: non tenerlo in casa se è gonfio."}
      - {tipo: nota, testo: "Regole generali sulle LiPo [S]: nessun documento del progetto descrive cosa fare in caso di calore, fumo o gonfiore. Il manuale OVONIC va letto prima della sezione 12 [C]."}
    fonti: [docs/BOM.md "Schema di alimentazione", guida/problemi/prima.yaml, guida/problemi/accensione.yaml]

  - id: "0.08"
    titolo: Sicurezza, i fusibili
    formato: mezzo
    immagine: false
    tabella:
      intestazione: [Fusibile, Valore, Dove, Quando]
      righe:
        - ["F1", "3 A", "Linea principale, un solo regolatore", "Banco: sezioni 4 e 5 [V]"]
        - ["F1", "15 A", "Linea principale", "Prime accensioni: sezione 12, fino alla fine della taratura [V]"]
        - ["F1", "30 A", "Linea principale", "In uso, dopo la taratura (BOM B4) [V]"]
        - ["F2", "2 A", "Ramo logica: 2813, 5 V, VL", "Sempre. Con lo zaino vedi la nota [C]"]
    testo:
      - "Monta il fusibile della sezione che stai facendo: 3 A al banco, 15 A alla prima accensione."
      - "Sostituisci un fusibile bruciato con uno uguale, mai più grosso."
      - "Cerca la causa del guasto prima di rimetterlo."
      - "Tieni F1 nel suo portafusibile fissato al corpo, non appeso ai cavi."
    avvisi:
      - {tipo: attenzione, testo: "Non ponticellare mai un fusibile, nemmeno per provare."}
      - {tipo: importante, testo: "Il ramo logica chiede circa 1,35 A con le voci alte e medie, il 67 % di F2 [S]. Con lo zaino (computer di bordo, 4 W) chiede circa 2,04 A: il piano dice F2 da 3 A, ma il cavo della logica è da 26 AWG. Non cambiare F2 da solo: è un punto aperto del progetto [C]."}
      - {tipo: nota, testo: "Il rail dei servo non ha un fusibile suo: i due regolatori limitano la corrente e F1 protegge il cavo da 14 AWG (D-073)."}
    fonti: [docs/BOM.md B4 B5 B6, docs/piano-elettronica-software.md 3.3, docs/cablaggio.md 3.1, docs/software.md 6.7, guida/passi/04-banco.yaml, guida/passi/05-servo.yaml, guida/passi/12-accensione.yaml, D-073]

  - id: "0.09"
    titolo: Sicurezza, saldatore e inserti caldi
    formato: mezzo
    immagine: false
    testo:
      - "Appoggia il saldatore sul suo supporto ogni volta che lo lasci."
      - "Lavora in un posto arieggiato: il flussante fuma."
      - "Salda l'FSR in pochi secondi, con la punta a bassa temperatura [C]."
      - "Metti gli inserti con la punta e la temperatura trovate nel provino (sezione 1) [C]."
      - "Lascia raffreddare l'inserto prima di toccarlo."
    avvisi:
      - {tipo: attenzione, testo: "La punta per inserti fonde la plastica e ustiona. Il PLA di carapace e vassoio ammorbidisce verso 55–60 °C [V]: per quei pezzi usa la temperatura del provino per il PLA, più bassa di quella del PETG-CF (D-065)."}
      - {tipo: importante, testo: "Lo stagno \"a bassa temperatura\" che hai in casa va bene solo se la lega non è al bismuto: controlla prima di usarlo [C]."}
      - {tipo: nota, testo: "Come si mette un inserto, pezzo per pezzo, è nella sezione 3. Dopo il montaggio la maggior parte dei fori non si raggiunge."}
    attrezzi: [saldatore_inserti, saldatore]
    fonti: [D-065, docs/BOM.md B19 e "Attrezzi necessari", guida/passi/06-zampa.yaml 6.06, CLAUDE.md "Da guardare sui pezzi in casa"]

  - id: "0.10"
    titolo: Sicurezza, i servo sotto tensione
    formato: mezzo
    immagine: false
    testo:
      - "Tieni dita e cavi lontani dai giunti quando il rail dei servo è acceso."
      - "Comanda un giunto con il tester o con la SSC-32 per portarlo in posizione."
      - "Stacca il T-plug se un servo ronza contro un fermo."
      - "Metti il rail sotto tensione solo con la zampa libera di muoversi."
    avvisi:
      - {tipo: attenzione, testo: "MG996R: 2,5 A di stallo a 6 V, 9,4–11 kgf·cm [V]. Un giunto in movimento schiaccia un dito, e 18 servo bloccati insieme chiedono 45 A."}
      - {tipo: importante, testo: "Non girare a mano il riduttore di un servo e non trascinare il giunto: portalo in posizione comandandolo, con il rail acceso e il servo libero."}
      - {tipo: nota, testo: "Il rail dei servo è spento di default: lo accende l'ESP32 quando la SSC-32 manda già gli impulsi. Senza taratura valida non si accende (BOM, software.md 2.7)."}
    fonti: [docs/BOM.md A1 e "Schema di alimentazione", docs/studio-componenti.md, docs/software.md 2.6 e 2.7, guida/problemi/zampa.yaml]

  - id: "0.11"
    titolo: Le sei zampe
    formato: grande
    terna: robot
    istanza: AS
    in_evidenza: [corpo/Corpo_Base, corpo/Corpo_Chiglia, "zampa/*@AS", "zampa/*@AD", "zampa/*@MS", "zampa/*@MD", "zampa/*@PS", "zampa/*@PD"]
    nascondi: ["zampa/Cover_*"]
    vista: {direzione: [-0.1, 0.0, 1.0], su: [1.0, 0.0, 0.0]}
    etichette:
      - {testo: AS, punto: [183.9, 104.0, 0]}
      - {testo: AD, punto: [183.9, -104.0, 0]}
      - {testo: MS, punto: [0, 168.0, 0]}
      - {testo: MD, punto: [0, -168.0, 0]}
      - {testo: PS, punto: [-183.9, 104.0, 0]}
      - {testo: PD, punto: [-183.9, -104.0, 0]}
      - {testo: AVANTI, punto: [150, 0, 0]}
    testo:
      - "Guarda il robot da sopra, con la testa in alto."
      - "Leggi la prima lettera del nome: A anteriore, M media, P posteriore."
      - "Leggi la seconda: S sinistra, D destra."
      - "Annota il nome nella scheda di ogni zampa prima di montarla."
    avvisi:
      - {tipo: nota, testo: "Le sei zampe sono la stessa zampa ruotata, non specchiata: i pezzi sono uguali a destra e a sinistra (robot.yaml)."}
      - {tipo: nota, testo: "Le zampe d'angolo guardano a 30° e 150° dall'avanti, le medie di lato (D-050)."}
    fonti: [robot/robot.yaml "zampe", D-050, docs/progetto-meccanico.md "Corpo v0 e assieme", guida/dati/manifest.json istanze]

  - id: "0.12"
    titolo: Il lato A della zampa
    formato: grande
    terna: zampa
    in_evidenza: ["zampa/*"]
    nascondi: ["zampa/Cover_*"]
    vista: zampa_A
    etichette:
      - {testo: "LATO A", chiave: zampa/Femore_A}
      - {testo: squadretta, chiave: zampa/Squadretta_femore}
      - {testo: squadretta, chiave: zampa/Squadretta_ginocchio}
    testo:
      - "Riconosci il lato A: ha il femore lato A, le squadrette e gli alberi dei servo."
      - "Guarda il lato A prima di ogni passo che lo nomina."
    avvisi:
      - {tipo: importante, testo: "Il lato A e il lato B sono quelli del CAD: il lato del femore A e quello del femore B. Scambiarli costringe a smontare."}
      - {tipo: nota, testo: "Nel CAD il lato A è +Y. I servo hanno l'albero dal lato A (D-047, progetto-meccanico.md)."}
    fonti: [guida/stile.md "Numeri e nomi", docs/progetto-meccanico.md "Architettura", guida/glossario.yaml, D-047]

  - id: "0.13"
    titolo: Il lato B della zampa
    formato: grande
    terna: zampa
    in_evidenza: ["zampa/*"]
    nascondi: ["zampa/Cover_*"]
    vista: zampa_B
    etichette:
      - {testo: "LATO B", chiave: zampa/Femore_B}
      - {testo: perno, chiave: zampa/Perno_femore}
      - {testo: perno, chiave: zampa/Perno_ginocchio}
    testo:
      - "Riconosci il lato B: ha il femore lato B, i perni e i cuscinetti."
      - "Guarda il lato B prima di ogni passo che lo nomina."
    avvisi:
      - {tipo: nota, testo: "Nel CAD il lato B è −Y. Sulla zampa la lama B si avvita al femore lato B con due viti M2 svasate (D-065)."}
    fonti: [guida/stile.md "Numeri e nomi", docs/progetto-meccanico.md "Architettura", D-065]

  - id: "0.14"
    titolo: Terne e versi
    formato: grande
    terna: robot
    istanza: AS
    in_evidenza: [corpo/Corpo_Base, corpo/Corpo_Chiglia, corpo/Corpo_Carapace, "zampa/*@AS"]
    nascondi: ["zampa/Cover_*"]
    posa: {alfa: 20, gamma: 100, coxa: 0}
    vista: {direzione: [0.55, 0.5, 0.67], su: [0.0, 0.0, 1.0]}
    etichette:
      - {testo: "AVANTI X", punto: [150, 0, 0]}
      - {testo: "SINISTRA Y", punto: [0, 100, 0]}
      - {testo: "ALTO Z", punto: [0, 0, 60]}
      - {testo: "FEMORE +20°", chiave: "zampa/Femore_B@AS"}
      - {testo: "GINOCCHIO 100°", chiave: "zampa/Tibia@AS"}
    tabella:
      intestazione: [Terna o angolo, Verso]
      righe:
        - ["Robot", "X avanti, Y a sinistra, Z in alto; origine al centro del corpo, all'altezza degli assi dei femori [V]"]
        - ["Zampa", "X verso l'esterno, Y verso il lato A, Z in alto; origine sull'asse della coxa [V]"]
        - ["Imbardata", "Rotazione attorno a Z, da 0° nella direzione neutra della zampa"]
        - ["Femore α", "0° = orizzontale, positivo verso l'alto"]
