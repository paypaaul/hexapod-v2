        - ["Perno Ø5 nel cuscinetto: scorrevole o forzato?", "1", "forzato (BOM D2) [V]", ""]
        - ["Perno nella coxa: pollice o morsa?", "1", "da provino [C]", ""]
        - ["Servo nella culla: gioco con le viti strette", "1", "nessuno (D-049)", ""]
        - ["Piedino sullo stinco: presa e attrito", "1", "valore nel CAD", ""]
        - ["Cuscinetto del ginocchio nella tibia: basta il pollice?", "6", "da provino [C]", ""]
        - ["Cuscinetti e perni del femore: forzati?", "6", "da provino [C]", ""]
        - ["Cuscinetto della coxa nel corpo: basta il pollice?", "7", "da provino [C]", ""]
    testo:
      - "Misura e annota il forzamento appena lo fai."
      - "Se serve la morsa, annota anche con quali ganasce."
    avvisi:
      - {tipo: nota, testo: "Prima si provano i forzamenti nei provini (sezione 1), poi si fanno sui pezzi veri. Un forzamento troppo duro vuol dire riportare la sede nel CAD (D-049)."}
      - {tipo: attenzione, testo: "Premi il cuscinetto solo sulla flangia: sull'anello interno si rovina (sezione 6)."}
    fonti: [guida/passi/01-provini.yaml 1.06 1.07 1.11, guida/passi/06-zampa.yaml 6.02, docs/BOM.md D1 D2, D-049]

