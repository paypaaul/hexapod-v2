        - ["1, inserti", "ins_m2_d, ins_m2_l", "3,4 / 4,0", ""]
        - ["1, inserti", "temperatura della punta, raffreddamento", "–", ""]
        - ["2, squadretta", "sq_d, sq_sp, sq_h", "20 / 2,5 / 5,5", ""]
        - ["2, squadretta", "sq_mozzo_d, sq_fori_pcd, sq_fori_d", "9 / 14 / 3", ""]
        - ["3, culla", "gio_servo, vite_m3_pilota", "0,2 / 2,5", ""]
        - ["3, culla", "cus_sede_d, nervature", "10,0 / da disegnare", ""]
        - ["4, giunto", "perno_foro, cox_testa_vite_d", "5,0 / 5,6", ""]
        - ["4, giunto", "cox_disco_luce", "0,3", ""]
        - ["5, lama A", "cov_testa_d, oppure le costole", "5,6", ""]
        - ["6, piedino", "stretta del piedino", "0", ""]
        - ["7, luce", "luc_bianco, luc_dif_sp, luc_camera_h", "0,8 / 0,6 / 6", ""]
        - ["7, luce", "colore del diffusore", "bianco", ""]
    testo:
      - "Misura e annota ogni valore appena lo trovi."
      - "Riporta nel CAD i valori della colonna Valore trovato, prima di stampare i pezzi veri."
    avvisi:
      - {tipo: nota, testo: "Le righe sono quelle del passo finale della sezione 1. I nomi sono parametri del CAD (cad/script/zampa.py, rif_componenti.py)."}
      - {tipo: importante, testo: "ins_m3_d muove anche le bugne delle culle e sq_h le quote lungo Y di tutta la zampa: riportali nel CAD prima di stampare il resto (CLAUDE.md, aperti)."}
    attrezzi: [calibro]
    fonti: [guida/passi/01-provini.yaml, CLAUDE.md "Provini da stampare prima dei pezzi", D-046, cad/script/zampa.py, cad/script/rif_componenti.py]

  - id: "A.04"
    titolo: Registro, forzamenti
    formato: mezzo
    immagine: false
    tabella:
