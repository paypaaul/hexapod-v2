        - ["Ogni cella, a fine carica", "4,20 V [S]", "", "11"]
        - ["Uscita del regolatore 5 V", "5,0 V [V]", "", "4"]
        - ["GPIO1 con il pacco a 8,4 V", "2,69 V [V]; 2,37 V a 7,4 V", "", "4"]
        - ["GPIO42, rail spento", "0 V [V]", "", "4"]
