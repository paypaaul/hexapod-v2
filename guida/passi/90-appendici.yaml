      - {tipo: nota, testo: "Le tolleranze non sono scritte nei documenti: lontano dal valore atteso, fermati e controlla i collegamenti [C]. Le prove B0–B6 sono quelle di software.md 6.7."}
    attrezzi: [multimetro]
    fonti: [guida/passi/04-banco.yaml 4.07 e 4.11, guida/passi/12-accensione.yaml, guida/passi/11-batteria.yaml 11.01, docs/BOM.md B1 B2 B10, docs/software.md 6.7, docs/piano-elettronica-software.md 3.2]

