# Appendici (D-075, docs/piano-guida.md "Struttura della guida"). F3, estrattore della sezione.
# Tutto a tabelle, passi senza figura a mezzo foglio (due per pagina). Canali, registro delle misure da compilare,
# opzionali X, inserti a caldo (dove, quali, quando) e glossario. Il foglio delle viti 1:1 e l'elenco dei pezzi li
# aggiunge l'impaginatore. F3c: A.15-A.19 sono gli schemi elettrici (figure da guida/schemi/, formato grande) e la
# tabella dei collegamenti esterni; seguono i passi generati A.20 (glossario, pagine A.20-A.25) e A.26 (viti 1:1),
# che restano in fondo (guida/problemi/appendici.yaml, numerazione: la pagina prende il numero dalla posizione).
# Il glossario e' una copia di guida/glossario.yaml e di guida/glossario.d/*.yaml fatta con uno script a fine lavoro:
# l'impaginatore non legge il glossario (guida/problemi/appendici.yaml, difetto della pipeline).
sezione:
  id: appendici
  numero: "A"
  titolo: Appendici
  colore: "#495057"
  terna: robot
  istanza: AS
  obiettivo: >-
    Avere sotto mano le tabelle che servono durante il montaggio: i canali della SSC-32, il registro delle misure da
    compilare, le opzioni X con la viteria in più, gli inserti a caldo, gli schemi della basetta e della scheda del
    carapace con i collegamenti verso il resto del robot, e il glossario.
  tempo: "da consultare quando serve"
  stato_elettrico: "nessuno: sono tabelle."
  fonti: [D-075, docs/cablaggio.md, robot/robot.yaml, docs/BOM.md, docs/predisposizioni.md, guida/schemi/schemi.md]

passi:
  - id: "A.01"
    titolo: Canali della SSC-32
    formato: mezzo
    immagine: false
    tabella:
      intestazione: [Zampa, Coxa, Femore, Ginocchio, Fila, Prolunga]
      righe:
        - ["AS", "0", "1", "2", "VS1", "sul ginocchio"]
        - ["MS", "6", "7", "8", "VS1", "no"]
        - ["PS", "13", "14", "15", "VS1", "sul ginocchio"]
        - ["AD", "16", "17", "18", "VS2", "sul ginocchio"]
        - ["MD", "22", "23", "24", "VS2", "no"]
        - ["PD", "29", "30", "31", "VS2", "sul ginocchio"]
    testo:
      - "Collega la spina di ogni servo al canale della tabella."
      - "Annota il canale nel registro, accanto al numero del servo."
      - "Ricontrolla il canale al banco, con un servo alla volta (B1, B2)."
    avvisi:
      - {tipo: importante, testo: "I canali sono una proposta di robot.yaml [C]: confermali al banco, con la scheda montata e la morsettiera in avanti. Se i canali 0–15 sono sul lato destro, cambiano robot.yaml, il firmware e questa tabella."}
      - {tipo: nota, testo: "VS1 alimenta i canali 0–15 (regolatore sinistro), VS2 i canali 16–31 (regolatore destro) [S]. Canali liberi: 3–5 e 9–12 a sinistra, 19–21 e 25–28 a destra."}
      - {tipo: nota, testo: "Il ginocchio delle zampe d'angolo ha un percorso di 267–295 mm contro circa 300 utili: serve una prolunga JR da 15 cm (BOM C5)."}
    fonti: [robot/robot.yaml "canali", docs/cablaggio.md 3.2, docs/dimensioni-componenti.md "SSC-32", docs/BOM.md C5 e "Schema di alimentazione", D-073]

  - id: "A.02"
    titolo: ADC dei piedi e prese
    formato: mezzo
    immagine: false
    tabella:
      intestazione: [Zampa, "Canale dell'ADS7830 (FSR)"]
      righe:
        - ["AS", "0"]
        - ["MS", "1"]
        - ["PS", "2"]
        - ["AD", "3"]
        - ["MD", "4"]
        - ["PD", "5"]
        - ["NTC dei regolatori (X14)", "6 e 7"]
    testo:
      - "Collega il doppino dell'FSR di ogni zampa alla sua presa dei piedi."
      - "Collega la spina delle luci di ogni zampa alla sua presa delle luci."
      - "Annota nel registro quale presa va a quale zampa."
    avvisi:
      - {tipo: nota, testo: "Canali nell'ordine di robot.yaml: AS, MS, PS, AD, MD, PD [C]. L'ADS7830 sta all'indirizzo 0x48 [V]."}
      - {tipo: nota, testo: "Le prese dei piedi (due poli) e le prese delle luci (massa, +5 V, dato) sono due file da sei spine JR sul tetto del tunnel (D-069)."}
      - {tipo: importante, testo: "Lungo la zampa passano solo massa e segnale dell'FSR, mai il 3,3 V."}
    fonti: [docs/cablaggio.md 3.3 e 3.4, docs/predisposizioni.md X5 e X14, D-069]

