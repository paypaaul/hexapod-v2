        - ["ToF posteriore (X19), pavimento dietro la coda", "da 11 a 31 cm a 100/45 [S]", ""]
        - ["INA260 sinistro e destro (X7)", "ognuno legge la corrente del suo rail; la somma torna con 14.07 [C]", ""]
