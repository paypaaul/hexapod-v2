# Sezione 12, prima accensione e taratura (D-075, docs/piano-guida.md "Struttura della guida"). F3.
# Ordine del piano: cavalletto, F1 da 15 A, cicalino di sottotensione (BOM B9, BX100), prima accensione per gradi con
# le misure (software.md 6.7, B3), dime 1 e 2 della taratura (D-066 blocco C, software.md 2.7), poi lame B e F1 da 30 A.
# La lama B non e' mai stata montata (sezione 6: "la lama B dopo la taratura"): qui si monta per la prima volta.
# La posa del manifest (imbardata 0, femore 0, ginocchio 90) e' la posa della Dima_Posa_1: l'immagine di 12.11 la
# mostra con la dima. Dime e cavalletto sono nel manifest (attrezzo/*) nella loro terna: il cavalletto in quella del
# robot (12.02), le dime in quella della zampa come costruita, legate al femore (cad/script/attrezzi.py). Gli attrezzi
# non seguono la posa: in 12.12 il femore resta fermo, la tibia va a 135 gradi e la coxa non si disegna.
# Comandi della console e stato CALIBRAZIONE vengono da software.md 2.6, 2.7 e 2.9: il firmware S2 non c'e' ancora,
# per questo sono marcati [C] (guida/problemi/accensione.yaml).
# Dopo l'arresto 2 (D-076): pulsante provvisorio sui pin A e B della 2813, il secondo B3b, come accensione e arresto
# d'emergenza fino al carapace (P-031, 12.03); rail acceso per la prima volta qui, con la batteria nel robot, senza
# alimentatore da banco (P-050); soglia del cicalino a 3,3 V per cella (P-066, 12.04).
sezione:
  id: accensione
  numero: 12
  titolo: Prima accensione e taratura
  colore: "#e8590c"
  terna: robot
  istanza: AS
  presenti_iniziali:
    - corpo/Corpo_Base
    - corpo/Corpo_Chiglia
    - "corpo/Corpo_Slitta_Regolatore_*"
    - "corpo/Servo_Coxa_*"
    - "corpo/Cuscinetto_Coxa_*"
    - corpo/SSC32
    - corpo/Basetta
    - corpo/ESP32
    - corpo/Camera
    - corpo/Portafusibile_F1
    - corpo/Tplug
    - "corpo/Wago_*"
    - "corpo/Regolatore_*"
    - "corpo/Corpo_Supporto_INA260_*"
    - "corpo/INA260_*"
    - corpo/Corpo_Vassoio
    - corpo/Partitori
    - corpo/Prese_luci
    - corpo/ToF_frontale
    - corpo/Interruttore
    - corpo/ADC
    - corpo/Corpo_Piastrina_IMU
    - corpo/IMU
    - corpo/Batteria
    - corpo/Corpo_Sportello
    - "zampa/Coxa@*"
    - "zampa/Coxa_Ponte@*"
    - "zampa/Cuscinetto_*@*"
    - "zampa/Perno_*@*"
    - "zampa/Squadretta_*@*"
    - "zampa/Servo_*@*"
    - "zampa/Femore_A@*"
    - "zampa/Femore_B@*"
    - "zampa/Tibia@*"
    - "zampa/Piedino@*"
    - "zampa/FSR_piede@*"
    - "zampa/Cover_Tibia@*"
    - "zampa/Cover_Tibia_Diffusore@*"
    - "zampa/Cover_Femore_A@*"
    - "zampa/Cover_Femore_A_Feritoia@*"
  obiettivo: >-
    Accendere il robot la prima volta, un pezzo alla volta e misurando ogni tensione; tarare i 18 servo con le due
    dime; montare le sei lame B e mettere il fusibile da 30 A. Alla fine il robot ha la taratura salvata ed è pronto
    per il carapace.
  prima:
    - "Batteria nel tunnel, T-plug staccato, F1 vuoto (sezione 11)."
    - "Spine dei 18 servo sui loro canali (sezioni 9 e 10)."
    - "Firmware con console e taratura nell'ESP32 [C] (sezione 4)."
    - "Cavalletto e dime 1 e 2 stampati (sezione 2)."
  tempo: "circa 2 ore, metà per la taratura [S]"
  stato_elettrico: >-
    T-plug collegato da 12.06 a 12.13, F1 da 15 A fino a 12.15. Pulsante provvisorio (12.03) per accendere e
    spegnere; il T-plug è il sezionamento d'emergenza.
  note: >-
    Un elemento nuovo alla volta (software.md 6.7). Il rail si accende qui la prima volta, con la batteria nel robot
    (D-076). Lama B: 6 volte.
  attrezzi: [multimetro, cavalletto, computer_usb]
  fonti: [D-066, D-073, D-075, D-076, "docs/software.md 2.6, 2.7, 6.7", "docs/BOM.md 'Schema di alimentazione', B4, B9", docs/piano-guida.md "Struttura della guida"]
  controllo:
    - "Le tensioni annotate da 12.06 a 12.10 sono quelle attese; nessun pezzo scalda."
    - "Taratura salvata: 18 servo, due pose ciascuno; il rail si accende solo con la taratura valida."
    - "Le sei lame B sono avvitate, con le teste a filo nell'intarsio nero."
    - "In F1 c'è il fusibile da 30 A; T-plug e cicalino sono staccati."
    - "Il pulsante provvisorio è ancora sui pin A e B: resta fino al pulsante del carapace (sezione 13)."
  vista_finale: {direzione: [0.55, -0.6, 0.55], su: [0, 0, 1]}

passi:
  - id: "12.01"
    titolo: Se qualcosa va storto
    formato: grande
    immagine: false
    testo:
      - "Leggi questa tabella prima di collegare la batteria e tienila aperta per tutta la sezione."
      - "Tieni a portata di mano il pulsante provvisorio (12.03) e il T-plug: staccare il T-plug toglie la corrente a tutto il robot."
    tabella:
      intestazione: [Cosa succede, Cosa fai]
      righe:
        - ["Un servo si muove da solo, urta o ronza fermo", "Premi il pulsante provvisorio: la logica si spegne e il rail dei servo si spegne con lei [V]. Poi stacca il T-plug."]
        - ["Odore di bruciato, una scheda o un cavo scalda, fumo", "Stacca subito il T-plug [V]. Non toccare la scheda finché non è fredda; non riaccendere prima di aver trovato la causa."]
        - ["La batteria scalda, si gonfia, sibila o fuma", "Stacca il T-plug e la prolunga di bilanciamento solo se puoi farlo senza toccare il pacco; allontanati. Non usare acqua sul pacco; se puoi farlo senza rischi, porta il robot all'aperto su una superficie che non brucia [S]."]
        - ["Il cicalino suona", "Pacco scarico o cella sbilanciata: spegni, stacca il T-plug e ricarica (11.01) [V]."]
        - ["F1 salta", "Stacca il T-plug. Cerca il corto o il servo bloccato prima di cambiarlo; mai un fusibile più grande [S]."]
    avvisi:
      - {tipo: attenzione, testo: "Con il rail acceso le zampe possono scattare all'improvviso: mani, viso e cavi fuori dal giro delle zampe, nessuno vicino al robot."}
      - {tipo: nota, testo: "Il pulsante è anche l'arresto d'emergenza: spegne la logica, GPIO42 resta flottante e il rail si spegne (software.md 2.6). Fino al carapace è il pulsante provvisorio sui pin A e B, perché il pulsantino della 2813 forse non si raggiunge (D-076, P-031). Il T-plug resta il sezionamento dei servo."}
    fonti: [D-076, "docs/software.md 2.6 'Sicurezza e macchina a stati'", "docs/BOM.md 'Schema di alimentazione', B9", docs/cablaggio.md 4 "T-plug", guida/problemi/accensione.yaml]

  - id: "12.02"
    titolo: Robot sul cavalletto
    formato: grande
    vista: {direzione: [-0.95, -0.35, 0.2], su: [0, 0, 1]}
    in_evidenza: [attrezzo/Cavalletto]
    etichette:
      - {testo: "culla e labbri: sotto la chiglia", punto: [0, -39, -47]}
      - {testo: "sportello libero", punto: [-86, 0, -6]}
    testo:
      - "Posa il cavalletto sul tavolo, lontano dal bordo."
      - "Cala il robot sul cavalletto: chiglia nella culla, fra i due labbri."
      - "Controlla che nessun piede tocchi il tavolo o il cavalletto."
      - "Controlla che lo sportello della batteria e le sue viti restino liberi."
    avvisi:
      - {tipo: nota, testo: "Il cavalletto tiene il robot sotto la chiglia, fra x −30 e +30, con le zampe libere: nessun urto nelle 18 pose basse provate nel CAD (D-066)."}
    attrezzi: [cavalletto]
    fonti: ["D-066, blocco C: cavalletto", cad/stl/README.md "attrezzi/Attrezzo_Cavalletto.stl", "docs/software.md 2.7 e 6.7 (B5, B6)"]

  - id: "12.03"
    titolo: Pulsante provvisorio e controlli a batteria staccata
    formato: grande
    vista: {direzione: [-0.55, -0.6, 0.6], su: [0, 0, 1]}
    mostra: [corpo/Corpo_Base, corpo/Interruttore, corpo/SSC32, corpo/Corpo_Vassoio, corpo/Basetta, corpo/Tplug, corpo/Portafusibile_F1]
    in_evidenza: [corpo/Interruttore]
    evidenzia:
      - {chiave: corpo/Corpo_Base, lav: "guida_2813_*"}
    etichette:
      - {testo: "2813: pin A e B", chiave: corpo/Interruttore}
    testo:
      - "Controlla che il T-plug sia staccato e F1 vuoto."
      - "Salda due fili 26 AWG lunghi circa 30 cm ai contatti del secondo pulsante Ø12 (B3b); chiudi con il termorestringente [S]."
      - "Salda gli altri capi sui pin A e B della 2813, insieme ai fili dei poli 15 e 16 (8.21) [C]."
      - "Posa il pulsante fuori dal robot, dove lo raggiungi senza passare sopra le zampe."
    tabella:
      intestazione: [Punto, Atteso, Misurato]
      righe:
        - ["Ponticelli VS1–VS2 e VS–VL della SSC-32", "tolti [V]", ""]
        - ["Spine dei servo", "marrone massa, rosso +, arancio segnale [V]", ""]
        - ["Fra i poli del T-plug del robot", "la lettura sale e non resta a 0 Ω [S]", ""]
    avvisi:
      - {tipo: attenzione, testo: "Corto sul T-plug del robot: non andare avanti, trovalo prima di collegare la batteria."}
      - {tipo: importante, testo: "Il pulsante provvisorio è l'arresto d'emergenza fino al carapace (D-076, P-031): niente batteria senza. Pin A e B irraggiungibili: salda sulla giunta dei poli 15 e 16 (4.15) [C]."}
    attrezzi: [multimetro, saldatore, spelafili, termorestringente]
    extra:
      - {nome: "pulsante Ø12 B3b, il secondo: provvisorio fino al carapace", qta: 1, bom: B3b}
      - {nome: "filo 26 AWG, circa 60 cm", qta: 1, bom: B17}
    fonti: [D-076, "guida/problemi.md P-031", "docs/BOM.md B3b, B17, 'Schema di alimentazione' (ponticelli tolti), B7", "docs/dimensioni-componenti.md 'MG996R' (colori dei fili)", docs/cablaggio.md 2, "docs/cablaggio.md 3.1 'Pulsante'", "guida/passi/08-elettronica.yaml 8.21"]

  - id: "12.04"
    titolo: Cicalino di sottotensione
    formato: grande
    vista: {direzione: [-0.8, 0.35, 0.5], su: [0, 0, 1]}
    mostra:
      - corpo/Corpo_Base
      - corpo/Corpo_Chiglia
      - corpo/Corpo_Sportello
      - corpo/Batteria
      - corpo/Portafusibile_F1
      - "corpo/Servo_Coxa_P*"
    in_evidenza: [corpo/Tplug]
    evidenzia:
      - {chiave: corpo/Corpo_Base, lav: "fessura_cavi_*"}
    etichette:
      - {testo: "cicalino: qui, sopra il T-plug", punto: [-74, 0, 22]}
      - {testo: "T-plug", chiave: corpo/Tplug}
    testo:
      - "Guarda sul cicalino quale pin è il polo −."
      - "Collega il cicalino alla prolunga di bilanciamento, nero sul polo −."
      - "Controlla che il display mostri le due celle come in 11.01."
      - "Imposta la soglia d'allarme a 3,3 V per cella, come dice il foglio del cicalino [C]."
      - "Posa il cicalino in coda, sopra il T-plug, lontano da contatti scoperti."
    avvisi:
      - {tipo: importante, testo: "Il verso dei pin va guardato sul pezzo (BOM B9): al contrario il cicalino non legge o si rompe [S]."}
      - {tipo: nota, testo: "3,3 V per cella è l'ultimo livello, indipendente dal firmware, che spegne il rail sotto 3,5 V per cella per 5 s (software.md 2.6): a 3,5 V il cicalino suonerebbe a ogni passo sotto carico (D-076, P-066). Si fissa al carapace nella sezione 13."}
      - {tipo: attenzione, testo: "Il cicalino assorbe sempre: a fine uso staccalo dalla prolunga, o scarica il pacco (BOM B9)."}
    extra:
      - {nome: "cicalino di sottotensione BX100, usato sciolto fino alla sezione 13", qta: 1, bom: B9}
    fonti: [D-076, "guida/problemi.md P-066", docs/BOM.md B9 C7, "docs/BOM.md 'Schema di alimentazione'", "docs/software.md 2.6 'Batteria scarica'", "docs/decisioni.md 'Decisioni ereditate' (sottotensione su più livelli)", D-059]

  - id: "12.05"
    titolo: Fusibile F1 da 15 A
    formato: grande
    vista: {direzione: [-0.55, 0.15, 0.82], su: [0, 0, 1]}
    mostra:
      - corpo/Corpo_Base
      - corpo/Corpo_Chiglia
      - corpo/Corpo_Sportello
      - "corpo/Wago_*"
      - "corpo/Servo_Coxa_P*"
    in_evidenza: [corpo/Portafusibile_F1]
    etichette:
      - {testo: "F1: 15 A", chiave: corpo/Portafusibile_F1}
      - {testo: "Wago +", chiave: corpo/Wago_piu}
      - {testo: "Wago −", chiave: corpo/Wago_meno}
    testo:
      - "Controlla che il T-plug sia staccato."
      - "Premi il fusibile da 15 A nel portafusibile F1 e chiudi il tappo."
      - "Misura la continuità fra un polo del T-plug del robot e il Wago +, poi fra l'altro polo e il Wago −."
      - "Annota quale polo del T-plug del robot va al +."
    avvisi:
      - {tipo: nota, testo: "15 A per le prime accensioni, 30 A in uso (BOM B4): 15 A bastano per un lato con 9 servo (software.md 6.7, B3)."}
      - {tipo: attenzione, testo: "Mai un fusibile oltre 30 A né un ponticello al posto del fusibile: F1 protegge il cavo da 14 AWG (D-073)."}
    extra:
      - {nome: "fusibile a lama ATO da 15 A", qta: 1, bom: B4}
    attrezzi: [multimetro]
    fonti: [docs/BOM.md B4 B5, "docs/software.md 6.7 (B3)", D-055, D-073, docs/cablaggio.md 2 "Potenza"]

  - id: "12.06"
    titolo: Batteria collegata, logica spenta
    formato: grande
    immagine: false
    testo:
      - "Controlla che la 2813 sia spenta, il pulsante provvisorio a portata e le mani lontane dalle zampe."
      - "Collega il T-plug del pacco a quello del robot, con un colpo deciso."
      - "Aspetta un minuto e controlla: niente odori, rumori o calore."
      - "Misura e annota le tensioni della tabella."
    tabella:
      intestazione: [Punto, Atteso, Misurato]
      righe:
        - ["Wago + e Wago −", "come il pacco: da 7,4 a 8,4 V [V]", ""]
        - ["Fila VS1 e massa della SSC-32", "0 V: regolatori spenti [V]", ""]
        - ["Fila VS2 e massa della SSC-32", "0 V [V]", ""]
        - ["Uscita 5 V della basetta", "0 V: logica spenta [S]", ""]
        - ["Spie dei rail (X13), se montate", "spente [V]", ""]
    avvisi:
      - {tipo: attenzione, testo: "Se VS1 o VS2 non sono a 0 V, stacca il T-plug: l'abilitazione dei regolatori non è a massa (BOM B11). Non collegare il rail ai servo finché non è a posto."}
      - {tipo: nota, testo: "I due regolatori sono sempre collegati alla batteria ma spenti di default: li accende l'ESP32 (BOM, schema di alimentazione; decisioni ereditate)."}
    attrezzi: [multimetro]
    fonti: ["docs/BOM.md 'Schema di alimentazione', B1, B11", "docs/software.md 6.7 (B3: abilitazione bassa = 0 V)", "docs/studio-componenti.md 'Batteria' (6,0–8,4 V)", docs/predisposizioni.md X13]

  - id: "12.07"
    titolo: Logica accesa, rail spento
    formato: grande
    vista: corpo_alto
    mostra:
      - corpo/Corpo_Vassoio
      - corpo/Basetta
      - corpo/ESP32
      - corpo/SSC32
      - corpo/Interruttore
      - corpo/Portafusibile_F1
      - corpo/Tplug
    evidenzia:
      - {chiave: corpo/ESP32, lav: "corpo:usb_c"}
    etichette:
      - {testo: "USB-C marcata TTL", punto: [16, 0, 20]}
      - {testo: "2813: pulsante provvisorio", chiave: corpo/Interruttore}
      - {testo: "SSC-32", chiave: corpo/SSC32}
    testo:
      - "Premi il pulsante provvisorio: l'ESP32 si accende."
      - "Se il pin 5V con la sola USB ha dato 0 V (4.05), apri la console dalla USB-C marcata TTL (CH340) [C]."
      - "Altrimenti apri la console con l'adattatore USB-seriale CH340N, senza la USB [C]."
      - "Misura e annota le tensioni della tabella."
      - "Controlla con la console che la SSC-32 risponda (comando ssc) e la tensione della batteria (comando stato) [C]."
    tabella:
      intestazione: [Punto, Atteso, Misurato]
      righe:
        - ["Regolatore 5 V (basetta)", "5,0 V [V]", ""]
        - ["VL della SSC-32", "come il pacco [V]", ""]
        - ["Partitore (GPIO1)", "2,69 V con il pacco a 8,4 V; 2,37 V a 7,4 V [V]", ""]
        - ["Abilitazione dei regolatori", "0 V: GPIO42 basso [V]", ""]
        - ["Fila VS1 e VS2", "0 V [V]", ""]
        - ["Batteria nella console", "come sul multimetro [C]", ""]
    avvisi:
      - {tipo: nota, testo: "Partitore 100 e 47 kΩ: GPIO1 legge il pacco × 47/147 (BOM B10). Ramo logica circa 0,5 A [S]."}
      - {tipo: attenzione, testo: "Se il regolatore 5 V scalda o il 5 V non è 5,0 V, spegni e stacca il T-plug."}
      - {tipo: attenzione, testo: "Finché non sai se la scheda ha un diodo sulla USB, mai USB e batteria insieme: i due 5 V si scontrano (S-07)."}
    attrezzi: [multimetro, computer_usb]
    fonti: ["docs/software.md 2.6 (accensione, punto 1), 2.9 (console), 6.7 (B0, B1, B3)", docs/BOM.md B2 B3 B3b B10 B11, "docs/piano-elettronica-software.md 3.3"]

  - id: "12.08"
    titolo: Rail acceso, senza servo
    formato: grande
    immagine: false
    testo:
      - "Fotografa la SSC-32 con le spine dei servo, per rimetterle uguali."
      - "Stacca dalla SSC-32 le spine di tutti i servo [S]."
      - "Accendi il rail dalla console (comando rail) [C]."
      - "Misura e annota le tensioni della tabella."
      - "Spegni il rail dalla console e controlla che VS1 e VS2 tornino a 0 V."
    tabella:
      intestazione: [Punto, Atteso, Misurato]
      righe:
        - ["Abilitazione dei regolatori", "alta: GPIO42 alto [V]", ""]
        - ["Fila VS1 e massa", "6,0 V [V]", ""]
        - ["Fila VS2 e massa", "6,0 V [V]", ""]
        - ["Spie dei rail (X13), se montate", "accese [V]", ""]
        - ["Wago + e Wago −", "come prima, quasi senza calo [S]", ""]
    avvisi:
      - {tipo: attenzione, testo: "Se VS1 o VS2 sono lontani da 6,0 V, spegni il rail e stacca il T-plug: con una tensione sbagliata i servo si rompono (MG996R: 4,8–7,2 V)."}
      - {tipo: nota, testo: "Canali dei servo: lato sinistro 0–15, destro 16–31, zampa per zampa in cablaggio.md 3.2 [C]."}
      - {tipo: nota, testo: "È la prima volta che il rail si accende: con la batteria nel robot e F1 da 15 A, senza alimentatore da banco (D-076, P-050)."}
    attrezzi: [multimetro, computer_usb]
    fonti: [D-076, "docs/software.md 6.7 (B3: GPIO42 alto = 6,0 V e power-good)", "docs/BOM.md B1 (6,0 V), A1 (4,8–7,2 V)", docs/cablaggio.md 3.2, robot/robot.yaml tensione_rail]

  - id: "12.09"
    titolo: Lato sinistro, 9 servo
    formato: grande
    vista: corpo_alto
    evidenzia:
      - {chiave: corpo/SSC32, lav: "corpo:header_servo"}
    etichette:
      - {testo: AS, chiave: "zampa/Femore_A@AS"}
      - {testo: MS, chiave: "zampa/Femore_A@MS"}
      - {testo: PS, chiave: "zampa/Femore_A@PS"}
      - {testo: "SSC-32", chiave: corpo/SSC32}
    testo:
      - "Collega le 9 spine delle zampe AS, MS e PS ai loro canali, come nella foto."
      - "Controlla che le zampe siano libere e che nessuno sia vicino."
      - "Accendi il rail dalla console [C]: le tre zampe vanno nella posa di parcheggio."
      - "Controlla che si fermino senza ronzare e senza andare a fine corsa."
      - "Misura e annota VS1 con le zampe ferme: 6,0 V [V]."
      - "Spegni il rail."
    avvisi:
      - {tipo: attenzione, testo: "Al primo rail acceso le zampe scattano verso la posa: mani fuori. Se una zampa va a fine corsa o un servo ronza fermo, spegni il rail subito: canale o verso sbagliato [C]."}
      - {tipo: nota, testo: "Prima gli impulsi della posa di parcheggio, poi il rail (software.md 2.6). Un MG996R prende 0,5–0,9 A in movimento e 2,5 A bloccato, a 6 V [V]: 15 A bastano per 9 servo."}
    attrezzi: [multimetro, computer_usb]
    fonti: ["docs/software.md 2.6 (accensione, punto 2), 6.7 (B3: un lato con 9 servo, F1 da 15 A)", "docs/dimensioni-componenti.md 'MG996R' (correnti)", "robot/robot.yaml servo.verso (ipotesi da provare)", docs/cablaggio.md 3.2]

  - id: "12.10"
    titolo: Lato destro, poi tutti i 18 servo
    formato: grande
    immagine: false
    testo:
      - "Stacca le 9 spine del lato sinistro."
      - "Collega le 9 spine delle zampe AD, MD e PD e fai come in 12.09, misurando VS2."
      - "Spegni il rail e ricollega anche le spine del lato sinistro."
      - "Accendi il rail: tutte e sei le zampe vanno nella posa di parcheggio."
      - "Misura e annota VS1 e VS2 con le zampe ferme."
      - "Controlla dopo cinque minuti che regolatori e servo siano tiepidi, non caldi [S]."
    tabella:
      intestazione: [Punto, Atteso, Misurato]
      righe:
        - ["VS2, lato destro da solo", "6,0 V [V]", ""]
        - ["VS1 con 18 servo", "6,0 V [V]", ""]
        - ["VS2 con 18 servo", "6,0 V [V]", ""]
    avvisi:
      - {tipo: attenzione, testo: "Se un regolatore o un servo scotta, spegni il rail e stacca il T-plug (tabella di 12.01)."}
    attrezzi: [multimetro, computer_usb]
    fonti: ["docs/software.md 6.7 (B3)", docs/cablaggio.md 3.2, "docs/piano-elettronica-software.md 3.2 (temperatura dei regolatori)"]

  - id: "12.11"
    titolo: Taratura, dima di posa 1
    formato: grande
    volte: 6
    terna: zampa
    posa: {alfa: 0, gamma: 90, coxa: 0}
    vista: zampa_B
    mostra:
      - "zampa/Coxa@AS"
      - "zampa/Coxa_Ponte@AS"
      - "zampa/Femore_A@AS"
      - "zampa/Femore_B@AS"
      - "zampa/Perno_*@AS"
      - "zampa/Cuscinetto_*@AS"
      - "zampa/Servo_*@AS"
      - "zampa/Squadretta_*@AS"
      - "zampa/Tibia@AS"
      - "zampa/Piedino@AS"
      - "zampa/Cover_Tibia@AS"
      - "zampa/Cover_Femore_A@AS"
    in_evidenza: [attrezzo/Dima_Posa_1]
    etichette:
      - {testo: "dima 1 sui perni del femore", punto: [87.5, -33.5, 8]}
      - {testo: "dente: coxa", punto: [69.5, -27, -26]}
      - {testo: "dente: tibia", punto: [105.5, -27, -26]}
      - {testo: "braccio: contro il servo di coxa", punto: [19, -22, 6.5]}
    testo:
      - "Porta la zampa nello stato di taratura [C], vicino alla posa 1: imbardata 0°, femore 0°, ginocchio 90°."
      - "Infila la dima di posa 1 sui due perni del femore, dal lato B."
      - "Porta il femore giù contro il suo dente, a passi di 10 µs e poi di 1 µs."
      - "Porta il ginocchio a chiudere contro il suo dente, poi gira la coxa in senso antiorario, visto dall'alto, finché il braccio tocca il servo di coxa."
      - "Annota i tre impulsi nel registro della taratura (12.13) e togli la dima."
    avvisi:
      - {tipo: attenzione, testo: "Rail acceso: dita fuori fra dente e pezzo. Avanza a passi piccoli e fermati al primo contatto."}
      - {tipo: importante, testo: "Se l'impulso trovato è lontano più di 80 µs da quello di partenza, la squadretta è calettata un dente fuori (±7,2°): rifai il calettamento (sezione 6) [S]."}
      - {tipo: nota, testo: "I denti toccano facce quasi radiali: circa 0,4 mm per grado. Precisione attesa circa ±0,5° [C] (D-066)."}
    attrezzi: [dime_posa, computer_usb]
    fonti: ["D-066, blocco C: dime di posa", "docs/software.md 2.7 'Taratura dei servo'", cad/stl/README.md "attrezzi/Dima_Posa_1.stl", robot/robot.yaml calettamento, "cad/script/attrezzi.py geometria_dima (punta sul fianco -Y della cassa)"]

  - id: "12.12"
    titolo: Taratura, dima di posa 2
    formato: grande
    terna: zampa
    posa: {alfa: 0, gamma: 135, coxa: 0}
    vista: zampa_B
    mostra:
      - "zampa/Femore_A@AS"
      - "zampa/Femore_B@AS"
      - "zampa/Perno_femore@AS"
      - "zampa/Perno_ginocchio@AS"
      - "zampa/Squadretta_femore@AS"
      - "zampa/Squadretta_ginocchio@AS"
      - "zampa/Cover_Femore_A@AS"
      - "zampa/Servo_ginocchio@AS"
      - "zampa/Cuscinetto_ginocchio@AS"
      - "zampa/Tibia@AS"
      - "zampa/Piedino@AS"
      - "zampa/Cover_Tibia@AS"
    in_evidenza: [attrezzo/Dima_Posa_2]
    etichette:
      - {testo: "dima 2", punto: [87.5, -33.5, 8]}
      - {testo: "dente: coxa", punto: [48, -27, -29]}
      - {testo: "dente: tibia, ginocchio a 135°", punto: [127, -27, -29]}
      - {testo: "braccio: servo di coxa", punto: [58, -34, 24]}
    testo:
      - "Porta la zampa vicino alla posa 2: imbardata +30°, femore +45°, ginocchio 135°."
      - "Infila la dima di posa 2 sui due perni del femore, dal lato B."
      - "Porta femore, ginocchio e coxa contro i loro denti come in 12.11."
      - "Annota i tre impulsi e togli la dima."
      - "Ripeti 12.11 e 12.12 per le altre cinque zampe."
    avvisi:
      - {tipo: nota, testo: "Nell'immagine il femore è fermo come nella dima: la tibia è a 135°, la coxa non è disegnata perché nella posa 2 è girata di 45° rispetto al femore."}
      - {tipo: nota, testo: "Due pose per giunto danno spostamento e guadagno del servo; se femore e ginocchio non sono lineari si aggiunge un terzo punto (software.md 2.7)."}
    attrezzi: [dime_posa, computer_usb]
    fonti: ["D-066, blocco C", "docs/software.md 2.7", cad/stl/README.md "attrezzi/Dima_Posa_2.stl", "cad/script/attrezzi.py POSE, geometria_dima"]

  - id: "12.13"
    titolo: Registro e salvataggio della taratura
    formato: grande
    immagine: false
    testo:
      - "Salva la taratura dalla console o dalla web app [C]."
      - "Copia il file della taratura nella repo, in robot/calib/ [C]."
      - "Spegni con il pulsante provvisorio e riaccendi: il rail si accende solo con la taratura valida."
      - "Prova su una zampa: comanda la posa 1 e infila la dima, che deve entrare senza forzare [S]."
      - "Spegni il rail e stacca il T-plug."
    tabella:
      intestazione: [Zampa, "Coxa, µs (posa 1 / 2)", "Femore, µs (posa 1 / 2)", "Ginocchio, µs (posa 1 / 2)"]
      righe:
        - ["AS", "", "", ""]
        - ["MS", "", "", ""]
        - ["PS", "", "", ""]
        - ["AD", "", "", ""]
        - ["MD", "", "", ""]
        - ["PD", "", "", ""]
    avvisi:
      - {tipo: nota, testo: "La taratura sta nell'ESP32 con versione e controllo, e in una copia nella repo; all'avvio il firmware ne manda l'impronta (software.md 2.7)."}
    attrezzi: [computer_usb, dime_posa]
    fonti: ["docs/software.md 2.7 (salvataggio, rail solo con taratura valida), 2.8 (partizione nvs_cal)"]

  - id: "12.14"
    titolo: Lama B
    formato: grande
    volte: 6
    nuovi: ["zampa/Cover_Femore_B@AS", "zampa/Cover_Femore_B_Feritoia@AS"]
    giunzioni: [lama_b]
    esploso: {asse: [0.5, -0.866, 0], distanza: 40}
    evidenzia:
      - {chiave: "zampa/Femore_B@AS", lav: "ins_lama_*"}
    vista: {direzione: [0.07, -0.83, 0.55], su: [0, 0, 1]}
    mostra:
      - "zampa/Coxa@AS"
      - "zampa/Coxa_Ponte@AS"
      - "zampa/Femore_A@AS"
      - "zampa/Femore_B@AS"
      - "zampa/Perno_*@AS"
      - "zampa/Servo_*@AS"
      - "zampa/Tibia@AS"
      - "zampa/Piedino@AS"
      - "zampa/Cover_Tibia@AS"
      - "zampa/Cover_Femore_A@AS"
      - corpo/Servo_Coxa_AS
    testo:
      - "Controlla che il T-plug sia staccato."
      - "Controlla i due inserti M2 nel femore lato B: a filo e dritti."
      - "Posa la lama B sul femore, con le tasche sulle punte dei perni."
      - "Accosta le due viti M2 × 5 svasate, poi stringile piano."
      - "Controlla che le teste stiano a filo nell'intarsio nero."
    avvisi:
      - {tipo: importante, testo: "Stringi piano: la svasatura è nel PLA nero dell'intarsio, profondo 1,0 mm (D-070)."}
      - {tipo: nota, testo: "Viti M2 × 5 al posto di × 6: circa 2,5 mm nell'inserto [V], bastano per una lama non strutturale (D-073). Per rifare la taratura si toglie la lama B: due viti (D-066)."}
    fonti: ["D-065: lama B avvitata", D-070, "D-071: viti a X 81 e 89, Z 1,5", D-073, guida/catalogo/giunzioni.yaml lama_b, cad/stl/README.md "Cover_Femore_B.stl"]

  - id: "12.15"
    titolo: Fusibile F1 da 30 A
    formato: grande
    vista: {direzione: [-0.55, 0.15, 0.82], su: [0, 0, 1]}
    mostra:
      - corpo/Corpo_Base
      - corpo/Corpo_Chiglia
      - corpo/Corpo_Sportello
      - "corpo/Servo_Coxa_P*"
    in_evidenza: [corpo/Portafusibile_F1]
    etichette:
      - {testo: "F1: 30 A", chiave: corpo/Portafusibile_F1}
    testo:
      - "Controlla che il T-plug sia staccato."
      - "Togli il fusibile da 15 A da F1."
      - "Premi il fusibile da 30 A e chiudi il tappo."
      - "Stacca il cicalino dalla prolunga di bilanciamento."
    avvisi:
      - {tipo: nota, testo: "30 A in uso: protegge il 14 AWG della linea principale (D-073, BOM B4)."}
      - {tipo: attenzione, testo: "A fine uso stacca sempre il T-plug e la presa di bilanciamento (BOM, schema di alimentazione)."}
      - {tipo: importante, testo: "Lascia il pulsante provvisorio sui pin A e B: è l'arresto d'emergenza finché il pulsante del carapace non funziona (sezione 13) [C]."}
    extra:
