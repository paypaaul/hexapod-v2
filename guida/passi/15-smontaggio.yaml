        - ["Squadrette a 25 denti", "2 oltre alle 18", "D3"]
        - ["Cuscinetti LF-1050ZZ e perni Ø 5 × 12", "6 oltre ai 18", "D1, D2"]
        - ["Sensori FSR", "1 oltre ai 6", "X5"]
        - ["Piedini in TPU", "2 oltre ai 6", "D9"]
        - ["Fusibili ATO e MINI", "assortimento da 301 pezzi, con i MINI da 2 A", "B4, B6"]
        - ["Prolunghe dei servo", "confezione da 20, 4 in uso", "C5"]
        - ["Fascette 2,5 mm", "100 pezzi, ne servono una per ogni smontaggio del ponte", "D11"]
