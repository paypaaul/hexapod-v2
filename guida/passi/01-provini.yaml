# Sezione 1, i provini (D-075, docs/piano-guida.md "Struttura della guida"). F3: bozza dell'estrattore.
# Fonti: CLAUDE.md (aperti 3 e 4), cad/stl/README.md, cad/script/attrezzi.py, D-049, D-064, D-066, D-069, D-072, D-073.
# I provini che hanno un pezzo (blocco degli inserti, tasche della lama A, luce) si mostrano con in_evidenza; gli altri
# usano i pezzi veri (la tibia, la coxa e il ponte, il piedino, la lama A sono gli stessi STL dei pezzi veri) e testo e
# tabelle per il resto. Dalla 2.1.7: blocco degli inserti (P-057), tre piedini (P-016), bussola del perno (P-065).
# Quello che le fonti non danno e' marcato [C] e sta in guida/problemi/provini.yaml.
sezione:
  id: provini
  numero: 1
  titolo: Provini
  colore: "#7048e8"
  terna: zampa
  obiettivo: >-
    Provare, prima dei pezzi veri, quello che il CAD non può sapere: come stampa la tua macchina e come calzano inserti,
    squadretta e pezzi comprati. Ogni provino dice cosa si misura, il valore atteso, dove si annota e quale parametro del
    CAD cambia. I valori tornano nel CAD prima di stampare il resto.
  prima:
    - "Squadretta a 25 denti (D3, domanda 4 del BOM), servo, cuscinetto (D1) e perno (D2) in casa."
    - "Inserti e viti dal kit (D4, D5, D6, D8); i filamenti E1, E2, E2b, E3."
    - "Per i provini 6 e 7: FSR 400 Short (X5), striscia a 120 LED/m (X9), 3 pixel dal GPIO48 [C]."
  tempo: "stampe in un giorno, prove al banco circa 3 ore [S]"
  stato_elettrico: "nessun rail dei servo: il servo di prova non è collegato. Il provino di luce usa 5 V da USB (meno di 110 mA [S])."
  attrezzi: [calibro, pennarello]
  fonti: [D-075, D-072, D-069, D-065, D-049, D-076, D-077, "docs/piano-guida.md, sezione 1"]
  controllo:
    - "Ogni provino ha il suo numero e le sue misure nel registro delle misure."
    - "Ogni riga della tabella del passo 1.18 ha un valore trovato, oppure «invariato»."
    - "Domande aperte (squadretta, FSR, striscia) chiuse o segnate come aperte."
    - "Nessun pezzo vero è stato stampato con gli STL di prima dei provini."

passi:
  - id: "1.01"
    titolo: Sette provini, in ordine
    formato: grande
    immagine: false
    testo:
      - "Stampa tutti i provini nello stesso giorno, prima di qualsiasi pezzo vero."
      - "Segna ogni provino con il suo numero, con il pennarello."
      - "Provali nell'ordine della tabella."
      - "Misura e annota ogni valore nel registro delle misure (appendice)."
      - "Riporta i valori nel CAD con il passo 1.18: non stampare altro prima."
    tabella:
      intestazione: ["N°", "Provino", "File", "Cosa decide nel CAD"]
      righe:
        - ["1", "Inserti del kit", "Attrezzo_Provino_Inserti.stl", "ins_m3_d, ins_m3_l, ins_m2_d, ins_m2_l"]
        - ["2", "Squadretta", "nessuno: si misura la D3", "sq_d, sq_sp, sq_h, sq_mozzo_d, sq_fori_pcd, sq_fori_d"]
        - ["3", "Culla della tibia", "Tibia.stl", "gio_servo, vite_m3_pilota, cus_sede_d, nervature delle culle"]
        - ["4", "Giunto della coxa", "Coxa.stl, Coxa_Ponte.stl", "perno_foro, cox_testa_vite_d, cox_disco_luce"]
        - ["5", "Tasche della lama A", "Attrezzo_Provino_Tasche_Base.stl e _Lama.stl", "cov_testa_d, oppure le costole"]
        - ["6", "Piedino", "Piedino_stretta_0.stl, _0.2.stl, _0.4.stl, Tibia.stl", "pied_stretta"]
        - ["7", "Luce", "Attrezzo_Provino_Luce_Nero.stl e _Bianco.stl", "luc_bianco, luc_dif_sp, luc_camera_h, colore del diffusore"]
    avvisi:
      - {tipo: nota, testo: "Il provino 1 viene prima degli altri: ins_m3_d muove anche le bugne delle culle e dei pezzi che si provano dopo."}
      - {tipo: nota, testo: "Tibia, coxa, ponte, piedino e lama A di prova sono gli STL veri: se il CAD non cambia, valgono come pezzi veri."}
      - {tipo: nota, testo: "Tappo a rombo del guscio, nervature dello sportellino e collare del cicalino non hanno un provino: si provano sui pezzi veri alla prima stampa [C]."}
      - {tipo: nota, testo: "Gli STL stanno in cad/stl/ e in cad/stl/attrezzi/ (i tre piedini e il blocco degli inserti sono lì); orientamento e materiale di ognuno in cad/stl/README.md."}
    fonti: ["CLAUDE.md, aperti 3 e 4", "cad/stl/README.md 'Attrezzi da banco' e 'Provino della culla'", D-072, D-069, D-076, D-077, "docs/piano-elettronica-software.md, fase P1"]

  - id: "1.02"
    titolo: Inserti, blocco di prova
    formato: grande
    in_evidenza: [attrezzo/Provino_Inserti]
    mostra: []
    vista: {direzione: [0.2, -0.55, 0.85], su: [0, 0, 1]}
    etichette:
      - {testo: "M3", punto: [-18.5, 4, 8.7]}
      - {testo: "4,2 = CAD", punto: [13.5, 4, 8.7]}
      - {testo: "M2", punto: [-18.5, -8, 8.7]}
      - {testo: "3,4 = CAD", punto: [13.5, -8, 8.7]}
    testo:
      - "Stampa Attrezzo_Provino_Inserti.stl in PETG-CF nero, con la faccia con le scritte in alto."
      - "Controlla che gli otto fori siano aperti e puliti."
      - "Leggi il diametro inciso sopra ogni foro."
      - "Misura e annota con il calibro il diametro vero di ogni foro."
    tabella:
      intestazione: ["Foro", "Ø nel blocco", "Profondità", "Misurato"]
      righe:
        - ["M3", "3,9 / 4,0 / 4,1, più 4,2 di controllo [V]", "6,7 (ins_m3_l) [V]", ""]
        - ["M2", "2,9 / 3,0 / 3,1, più 3,4 di controllo [V]", "4,0 (ins_m2_l) [V]", ""]
    avvisi:
      - {tipo: nota, testo: "Gli inserti del kit hanno la zigrinatura Ø4,2 e l'invito liscio Ø4,0 (M3), Ø3,2 e Ø3,0 (M2) (D-076, Q-20) [V]: il foro non può essere grande come l'inserto, quindi si provano fori più stretti."}
      - {tipo: nota, testo: "Il foro M3 di oggi è 4,2 (ins_m3_d) e il M2 è 3,4 (ins_m2_d): erano pensati per gli inserti CNC Kitchen Ø4,6 e Ø3,6. Restano nel blocco come controllo [V]."}
      - {tipo: nota, testo: "Le scritte sono alte 4 mm e incise 0,6: guardale sul primo pezzo stampato [C]."}
    extra:
      - {nome: "Provino degli inserti, PETG-CF nero", qta: 1, bom: E1}
    attrezzi: [calibro]
    fonti: [D-065, D-073, D-076, D-077, "docs/BOM.md D4, D5 e domanda 8", "cad/stl/README.md 'Attrezzi da banco'", "cad/script/attrezzi.py fai_provino_inserti", "cad/script/rif_componenti.py ins_m3_d, ins_m3_l, ins_m2_d, ins_m2_l"]

  - id: "1.03"
    titolo: Inserti, posa e tenuta
    formato: grande
    immagine: false
    testo:
      - "Scalda il saldatore con la punta per inserti."
      - "Posa un inserto dritto su ogni foro: M3 × 5 nei quattro fori M3, M2 × 3 nei quattro fori M2."
      - "Premi piano finché ogni inserto è a filo del blocco."
      - "Lascia raffreddare gli inserti dritti, senza toccarli."
      - "Avvita una vite in ogni inserto e tira: non deve girare né uscire."
      - "Misura e annota il foro che tiene meglio, la temperatura della punta e il tempo di posa."
    tabella:
      intestazione: ["Cosa annotare", "Oggi nel CAD", "Parametro", "Annota"]
      righe:
        - ["Ø del foro M3 che tiene", "4,2 [V]", "ins_m3_d", ""]
        - ["Profondità del foro M3: l'inserto arriva a filo senza toccare il fondo", "6,7 [V]", "ins_m3_l", ""]
        - ["Ø del foro M2 che tiene", "3,4 [V]", "ins_m2_d", ""]
        - ["Profondità del foro M2", "4,0 [V]", "ins_m2_l", ""]
        - ["Temperatura e tempo di posa, PETG-CF", "—", "nessuno: serve alla sezione 3", ""]
        - ["Temperatura e tempo di posa, PLA (solo M2)", "—", "nessuno: serve alla sezione 3", ""]
        - ["M3 × 6 nel foro del ponte della coxa (1.09): regge il fondo di 0,55 mm?", "—", "divisione M3 × 5 e × 6, passo 3.01", ""]
    avvisi:
      - {tipo: attenzione, testo: "La punta e la plastica fusa scottano: appoggia il saldatore sul suo supporto."}
      - {tipo: importante, testo: "Mai inserti nei fori pilota Ø2,5 delle alette lato albero: lì la vite si fa il filetto da sola (D-049)."}
      - {tipo: nota, testo: "Il CAD ha fori M3 profondi 6,7, pensati per inserti da 5,7. Con gli M3 × 5 o × 6 del kit restano 1,7 o 0,7 mm di fondo [V]. I 90 inserti M3 chiedono due lunghezze: il kit ne ha 50 per misura [V]."}
      - {tipo: nota, testo: "Nessuna fonte dà temperatura e tempo di posa: li trovi qui e li riusi nella sezione 3 [C]. Per il PLA (vassoio e carapace) ripeti la prova sui fori M2 di un secondo blocco in PLA: il PLA ammorbidisce prima, la punta va più fredda (D-065, D-076)."}
    attrezzi: [saldatore_inserti, brugola_2_5, croce_ph0, calibro]
    fonti: [D-065, D-049, D-073, D-076, "docs/BOM.md D4, D5", "docs/dimensioni-componenti.md 'Regole per il CAD ereditate dalla prima versione'", "guida/problemi/provini.yaml", "guida/problemi.md P-057, P-058"]

  - id: "1.04"
    titolo: Squadretta, misure
    formato: grande
    in_evidenza: [zampa/Squadretta_coxa]
    mostra: []
    vista: {direzione: [0.9, 0.35, 0.25], su: [0, 0, 1]}
    etichette:
      - {testo: disco, punto: [10, 0, 18]}
      - {testo: mozzo, punto: [4.5, 0, 14.5]}
    testo:
      - "Misura e annota con il calibro le sei quote della tabella."
      - "Infila la squadretta sull'albero di un servo: deve entrare a mano e non ballare."
      - "Conta i denti: sono 25."
      - "Avvita una vite M3 in ogni foro filettato: deve entrare senza forzare."
      - "Controlla che i quattro fori siano a croce, a 90° fra loro."
    tabella:
      intestazione: ["Quota", "Oggi nel CAD", "Parametro", "Misurato"]
      righe:
        - ["Ø del disco", "20 [C]", "sq_d", ""]
        - ["Spessore del disco", "2,5 [C]", "sq_sp", ""]
        - ["Altezza con il mozzo", "5,5 [C]", "sq_h", ""]
        - ["Ø del mozzo", "9 [C]", "sq_mozzo_d", ""]
        - ["Interasse dei fori M3 opposti", "14 [C]", "sq_fori_pcd", ""]
        - ["Ø dei fori filettati", "3 (M3) [C]", "sq_fori_d", ""]
    avvisi:
      - {tipo: importante, testo: "Se i denti non sono 25 o il foro centrale non calza l'albero, fermati: il progetto è sui 25 denti dell'MG996R (BOM D3)."}
      - {tipo: nota, testo: "sq_h e sq_sp entrano nelle quote lungo Y: se cambiano, cambiano tutti i pezzi della zampa (D-046)."}
      - {tipo: nota, testo: "Il foro centrale (Ø3,2 nel modello) non ha parametro: controlla solo che la vite in dotazione entri [C]."}
    attrezzi: [calibro]
    fonti: [D-046, D-048, "docs/BOM.md D3 e domanda 4", "cad/script/rif_componenti.py sq_*", "cad/stl/README.md 'Provino della culla' (ultimo capoverso)"]

  - id: "1.05"
    titolo: Culla, stampa e misure
    formato: grande
    in_evidenza: [zampa/Tibia]
    mostra: []
    vista: {direzione: [0.5, -0.8, 0.45], su: [0, 0, 1]}
    evidenzia:
      - {chiave: zampa/Tibia, lav: sede_cuscinetto}
      - {chiave: zampa/Tibia, lav: passaggio_perno}
      - {chiave: zampa/Tibia, lav: "pilota_corto_*"}
      - {chiave: zampa/Tibia, lav: fessura_cavo}
      - {chiave: zampa/Tibia, lav: finestra_cavo}
    etichette:
      - {testo: PIATTO, punto: [120, -24.15, -12]}
    testo:
      - "Stampa Tibia.stl in PETG-CF nero, con il fondo della culla sul piatto e l'apertura in alto."
      - "Metti un supporto a cuneo sotto lo stinco: si stacca dal piatto fino a circa 17 mm [V]."
      - "Togli supporto e bave da fessura e finestra."
      - "Misura e annota con il calibro le quote della tabella."
    tabella:
      intestazione: ["Quota", "CAD", "Parametro", "Misurato"]
      righe:
        - ["Sede del servo, lunghezza", "41,4 [V]", "srv_cassa_l + 2 gio_servo", ""]
        - ["Sede del servo, larghezza", "20,9 [V]", "srv_cassa_w + 2 gio_servo", ""]
        - ["Fessura del passacavo", "6,7 [V]", "cav_fes_semi", ""]
        - ["Finestra del cavo, larghezza", "9,0 [V]", "cav_fin_w", ""]
        - ["Foro pilota", "2,5 [V]", "vite_m3_pilota", ""]
        - ["Sede del cuscinetto", "10,0 [V]", "cus_sede_d", ""]
    avvisi:
      - {tipo: nota, testo: "I fori stampati vengono più stretti del CAD di 0,1–0,2 mm [S] (D-056). Gli inserti lato coda stanno nei fori da 4,2: se il provino 1 dà un altro diametro, la loro tenuta qui non conta."}
    attrezzi: [calibro]
    fonti: [D-049, D-065, D-067, "cad/stl/README.md 'Tibia.stl' e 'Provino della culla'", "cad/script/zampa.py _sede e PARAMETRI", D-056]

  - id: "1.06"
    titolo: Cuscinetto nella sede
    formato: grande
    in_evidenza: [zampa/Tibia, zampa/Cuscinetto_ginocchio]
    mostra: []
    esploso: {pezzi: {"zampa/Cuscinetto_ginocchio": [0, -30, 0]}}
    vista: zampa_B
    evidenzia: [{chiave: zampa/Tibia, lav: sede_cuscinetto}]
    testo:
      - "Premi il cuscinetto LF-1050ZZ nella sede dal lato B, flangia verso fuori."
      - "Spingi col pollice, solo sulla flangia, fino in battuta."
      - "Controlla che l'anello interno giri libero."
      - "Misura e annota se è bastato il pollice."
    extra:
      - {nome: "cuscinetto flangiato LF-1050ZZ", qta: 1, bom: D1}
    avvisi:
      - {tipo: attenzione, testo: "Niente morsa piana: premeresti flangia e anello interno insieme."}
      - {tipo: prova, testo: "Atteso: entra col pollice, l'anello gira libero [C]. Se no, cus_sede_d (oggi 10,0) va aumentato."}
    fonti: [D-049, "guida/problemi/zampa.yaml 'Come si preme il cuscinetto del ginocchio'", "cad/stl/README.md 'Provino della culla' punto 3", "cad/script/zampa.py _sede"]

  - id: "1.07"
    titolo: Perno nel cuscinetto
    formato: grande
    in_evidenza: [zampa/Tibia, zampa/Cuscinetto_ginocchio, zampa/Perno_ginocchio]
    mostra: []
    esploso: {pezzi: {"zampa/Perno_ginocchio": [0, -22, 0]}}
    vista: zampa_B
    testo:
      - "Infila il perno Ø5 × 12 nell'anello interno del cuscinetto, dal lato B."
      - "Controlla che scorra a mano e non balli."
      - "Misura e annota: scorrevole, o forzato."
    extra:
      - {nome: "perno Ø5 × 12", qta: 1, bom: D2}
    avvisi:
      - {tipo: nota, testo: "I perni h8 scorrono nel cuscinetto, gli m6 entrano forzati (BOM D2, D-049)."}
      - {tipo: prova, testo: "Atteso: scorrevole, senza gioco apprezzabile [C]. Se entra forzato, annotalo: cambia la scelta del perno (D2)."}
    fonti: [D-049, "docs/BOM.md D2", "cad/script/rif_componenti.py perno_d, perno_l"]

  - id: "1.08"
    titolo: Servo nella culla
    formato: grande
    in_evidenza: [zampa/Tibia, zampa/Cuscinetto_ginocchio, zampa/Servo_ginocchio]
    mostra: []
    esploso: {pezzi: {"zampa/Servo_ginocchio": [0, 45, 0]}}
    vista: zampa_A
    evidenzia:
      - {chiave: zampa/Tibia, lav: fessura_cavo}
      - {chiave: zampa/Tibia, lav: finestra_cavo}
      - {chiave: zampa/Tibia, lav: "ins_coda_*"}
      - {chiave: zampa/Tibia, lav: "pilota_corto_*"}
    testo:
      - "Controlla che le alette del servo siano nude: gommini e tubetti di ottone restano da parte."
      - "Infila la spina del cavo nella finestra della testata, da dentro la culla."
      - "Cala il servo nella culla dal lato A, con il passacavo nella fessura."
      - "Stringi 2 viti M3 × 8 negli inserti lato coda e 2 nei fori pilota lato albero."
      - "Misura e annota di quanto si muove il servo con le viti strette."
    tabella:
      intestazione: ["Prova", "Atteso", "Se non va"]
      righe:
        - ["Il servo scende senza forzare", "sì [V]", "gio_servo (oggi 0,2 per lato)"]
        - ["Passacavo nella fessura, spina dalla finestra", "passano [V]", "cav_fes_semi, cav_fin_w"]
        - ["Le viti entrano nei fori pilota senza spaccare la bugna", "sì [C]", "vite_m3_pilota"]
        - ["Il servo resta fermo, senza gioco", "sì [V]", "gio_servo, nervature"]
    avvisi:
      - {tipo: importante, testo: "Qui stringi le viti perché il femore non c'è. Nella zampa vera si accostano e si stringono per ultime, a femore montato (D-049)."}
      - {tipo: nota, testo: "Le nervature di schiacciamento delle culle non sono ancora nel CAD: si disegnano dopo questa prova (docs/progetto-meccanico.md, 'Da fare nella zampa')."}
    extra:
      - {nome: "servo MG996R", qta: 1, bom: A1}
      - {nome: "vite M3 × 8", qta: 4, bom: D6}
    attrezzi: [brugola_2_5, calibro]
    fonti: [D-047, D-049, "cad/stl/README.md 'Provino della culla' punti 1, 2 e 4", "docs/dimensioni-componenti.md 'MG996R'"]

  - id: "1.09"
    titolo: Giunto, stampa e misure
    formato: grande
    in_evidenza: [zampa/Coxa, zampa/Coxa_Ponte]
    mostra: []
    esploso: {pezzi: {"zampa/Coxa_Ponte": [0, 0, 35]}}
    vista: zampa_A
    evidenzia:
      - {chiave: zampa/Coxa, lav: foro_perno}
      - {chiave: zampa/Coxa_Ponte, lav: "foro_testa_*"}
      - {chiave: zampa/Coxa_Ponte, lav: sede_disco}
      - {chiave: zampa/Coxa_Ponte, lav: foro_centrale}
    testo:
      - "Stampa Coxa.stl con la faccia +Y sul piatto, senza supporti [V]."
      - "Stampa Coxa_Ponte.stl con la faccia superiore sul piatto, sede del disco in alto."
      - "Controlla che il foro del perno sia aperto e dritto."
      - "Metti un inserto M3 × 6 in un foro del ponte e un × 5 nell'altro: il fondo non deve segnarsi."
      - "Misura e annota con il calibro le quote della tabella."
    tabella:
      intestazione: ["Quota", "CAD", "Parametro", "Misurato"]
      righe:
        - ["Foro del perno nella coxa", "5,0 [V]", "perno_foro", ""]
        - ["Fori delle teste nel ponte", "5,6 [V]", "cox_testa_vite_d", ""]
        - ["Sede del disco nel ponte", "20,4 [V]", "sq_d + 2 gio_stampa", ""]
        - ["Foro centrale del ponte", "6,0 [V]", "sq_accesso_d", ""]
    avvisi:
      - {tipo: nota, testo: "La sede del disco parte da sq_d = 20 [C]: se la squadretta misurata (1.04) è diversa, annota la differenza."}
      - {tipo: importante, testo: "Ponte avvitato e linguette si vedono qui, con viti M3 × 10 negli inserti di 1.03 [C]."}
    extra:
      - {nome: "Coxa, PETG-CF nero", qta: 1, bom: E1}
      - {nome: "Ponte della coxa, PETG-CF nero", qta: 1, bom: E1}
    attrezzi: [calibro]
    fonti: [D-048, D-049, "cad/stl/README.md 'Coxa.stl', 'Coxa_Ponte.stl' e 'Provino della culla' (ultimo capoverso)", "cad/script/zampa.py ponte e coxa", "guida/problemi/provini.yaml"]

  - id: "1.10"
    titolo: Ponte sulla squadretta
    formato: grande
    in_evidenza: [zampa/Coxa_Ponte, zampa/Squadretta_coxa]
    mostra: []
    esploso: {pezzi: {"zampa/Coxa_Ponte": [0, 0, 14]}}
    vista: zampa_A
    evidenzia:
      - {chiave: zampa/Coxa_Ponte, lav: "foro_testa_*"}
      - {chiave: zampa/Coxa_Ponte, lav: sede_disco}
    testo:
      - "Avvita 2 viti M3 × 5 nei fori opposti della squadretta, teste in alto, senza rondella."
      - "Cala il ponte: le teste nei due fori, il disco nella sede."
      - "Ruota il ponte a mano: misura e annota il gioco."
      - "Alza il ponte: misura e annota la luce sopra il disco."
    avvisi:
      - {tipo: prova, testo: "Atteso: gioco 0,1 mm sulle teste [V], circa 0,8° sul raggio di 7 [S]; luce 0,3 mm [V]. Parametri: cox_testa_vite_d, cox_disco_luce."}
    attrezzi: [brugola_2_5, calibro]
    fonti: [D-048, D-049, "cad/script/zampa.py cox_testa_vite_d, cox_disco_luce"]

  - id: "1.11"
    titolo: Perno nella coxa
    formato: grande
    in_evidenza: [zampa/Coxa, zampa/Perno_coxa]
    mostra: []
    esploso: {pezzi: {"zampa/Perno_coxa": [0, 0, -30]}}
    vista: zampa_sotto
    evidenzia: [{chiave: zampa/Coxa, lav: foro_perno}]
    testo:
      - "Infila un perno Ø5 × 12 nel foro del braccio, dal basso, dal lato opposto al rialzo."
      - "Posa la bussola del perno sul braccio: la tasca sul rialzo, il foro cieco sopra il perno."
      - "Premi bussola e perno con la morsa finché il perno tocca il fondo del foro: sotto il braccio ne restano 1,4 mm [V]."
      - "Controlla che il perno non esca da solo e non sia storto."
      - "Misura e annota: bastato il pollice, o servita la morsa."
    extra:
      - {nome: "perno Ø5 × 12", qta: 1, bom: D2}
    avvisi:
      - {tipo: attenzione, testo: "Solo morsa a ganasce morbide: niente martello."}
      - {tipo: prova, testo: "Atteso: forzato, tiene senza ritegno (D-049); entra con la morsa [C]. Parametro: perno_foro (5,0)."}
      - {tipo: nota, testo: "La bussola è Attrezzo_Bussola_Perno.stl, in PETG-CF: stampala con i provini. Il suo foro cieco ferma il perno con la sporgenza giusta, senza misurarla (D-077, P-065). Se il perno entra duro, stampa anche l'estrattore (passi 2.31 e 2.32)."}
      - {tipo: nota, testo: "La sede del disco in Femore A e i perni in Femore B non hanno un provino a parte (stessi parametri): si provano sui pezzi veri, con Femore B come primo pezzo del lotto [C]."}
    attrezzi: [morsa_morbida, bussola_perno, calibro]
    fonti: [D-049, D-077, "cad/script/zampa.py perno_foro, perno_sporge", "cad/script/attrezzi.py fai_bussola_perno", "manifest: Perno_coxa a Z -39,8"]

  - id: "1.12"
    titolo: Tasche della lama A, stampa
    formato: grande
    in_evidenza: [attrezzo/Provino_Tasche_Base, attrezzo/Provino_Tasche_Lama]
    mostra: []
    esploso: {pezzi: {"attrezzo/Provino_Tasche_Lama": [0, 20, 0]}}
    vista: {direzione: [0.3, -0.9, 0.6], su: [0, 0, 1]}
    etichette:
      - {testo: BASE, punto: [0, -4, 8]}
      - {testo: LAMINA, punto: [0, 20, 4]}
    testo:
      - "Stampa la base in PETG-CF nero e avvita nel foro pilota Ø2,5 una vite M3 × 6: la testa resta in piedi."
      - "Stampa la lamina in PLA bianco con le tasche sul piatto, come la lama A."
      - "Controlla i puntini accanto a ogni tasca: da 1 a 6."
    tabella:
      intestazione: ["Puntini", "Tasca", "Tipo"]
      righe:
        - ["1", "Ø5,4", "liscia"]
        - ["2", "Ø5,5", "liscia"]
        - ["3", "Ø5,6 (oggi, cov_testa_d)", "liscia"]
        - ["4", "Ø5,7", "liscia"]
        - ["5", "Ø6,0, stringe a 5,3", "con tre costole"]
        - ["6", "Ø6,0, stringe a 5,4", "con tre costole"]
    avvisi:
      - {tipo: nota, testo: "La lamina è spessa 4,0 come la lama A; le tasche sono profonde 3,2 [V]. La testa ISO 4762 va da Ø5,32 a 5,5 e alta 3,0 [V]."}
      - {tipo: nota, testo: "Nell'immagine: base e lamina come si stampano. Le tasche stanno sotto la lamina, sul piatto; i puntini sono sulla faccia in alto."}
    extra:
      - {nome: "base di prova, PETG-CF", qta: 1, bom: E1}
      - {nome: "lamina di prova, PLA bianco", qta: 1, bom: E2}
      - {nome: "vite M3 × 6", qta: 1, bom: D6}
    attrezzi: [brugola_2_5]
    fonti: [D-072, D-070, "cad/stl/README.md 'Attrezzi da banco'", "cad/script/attrezzi.py fai_provino_tasche"]

  - id: "1.13"
    titolo: Tasche della lama A, prova
    formato: grande
    in_evidenza: [attrezzo/Provino_Tasche_Lama]
    mostra: []
    vista: {direzione: [0.0, -0.45, -1.0], su: [0, 1, 0]}
    etichette:
      - {testo: "1", punto: [-25, 0, 0]}
      - {testo: "2", punto: [-15, 0, 0]}
      - {testo: "3", punto: [-5, 0, 0]}
      - {testo: "4", punto: [5, 0, 0]}
      - {testo: "5", punto: [15, 0, 0]}
      - {testo: "6", punto: [25, 0, 0]}
    testo:
      - "Premi la tasca 1 sulla testa della vite, a mano."
      - "Stacca la lamina con le dita."
      - "Ripeti con le tasche da 2 a 6."
      - "Annota la tasca che tiene la lamina senza spostarsi e si stacca senza forzare."
      - "Se vince una liscia (1–4), il suo Ø va in cov_testa_d."
      - "Se vince una con le costole (5 o 6), nel CAD si passa alle costole."
    tabella:
      intestazione: ["Tasca", "Tiene la lamina?", "Si stacca senza forzare?"]
      righe:
        - ["1, Ø5,4", "", ""]
        - ["2, Ø5,5", "", ""]
        - ["3, Ø5,6", "", ""]
        - ["4, Ø5,7", "", ""]
        - ["5, costole a 5,3", "", ""]
        - ["6, costole a 5,4", "", ""]
    avvisi:
      - {tipo: prova, testo: "Atteso: la lamina sta sulla testa senza cadere e si toglie con due dita [C]."}
      - {tipo: nota, testo: "Nell'immagine: la lamina vista dal basso, con il numero di ogni tasca; premi sulla testa della vite la tasca che provi."}
      - {tipo: nota, testo: "Una tasca liscia dà una stretta che dipende dalla stampante: le costole la rendono meno sensibile (D-072)."}
    fonti: [D-072, "CLAUDE.md, aperto 4"]

  - id: "1.14"
    titolo: Piedino, stampa
    formato: grande
    in_evidenza: [zampa/Piedino]
    mostra: []
    vista: {direzione: [0.4, 0.25, 1.0], su: [0, 0, 1]}
    evidenzia: [{chiave: zampa/Piedino, lav: tacca_fili}]
    etichette:
      - {testo: PIATTO, punto: [121.8, 0, -94.5]}
    testo:
      - "Stampa i tre piedini in TPU 95A arancio: bocca sul piatto, punta in alto."
      - "Segna sul piedino la stretta con il pennarello: 0, 0,2 o 0,4."
      - "Stampa la tibia di prova, se non l'hai già fatta (provino 3)."
    tabella:
      intestazione: ["Variante", "Stretta sullo stinco", "File"]
      righe:
        - ["A", "0 mm (CAD di oggi) [V]", "Piedino_stretta_0.stl"]
        - ["B", "0,2 mm [V]", "Piedino_stretta_0.2.stl"]
        - ["C", "0,4 mm [V]", "Piedino_stretta_0.4.stl"]
    avvisi:
      - {tipo: nota, testo: "La stretta è la parete del piedino spinta verso lo stinco: con 0,2 e 0,4 il piedino stringe lo stinco di quel tanto. È il parametro pied_stretta, oggi 0; Piedino.stl del modello è sempre quello del valore scelto (D-077, P-016)."}
      - {tipo: nota, testo: "Parete e suola da 1,6 mm, quattro perimetri (D-064). Dalla 2.1.0 la suola è piana, con il pistoncino per l'FSR e la tacca dei fili (D-066)."}
    extra:
      - {nome: "Piedino, TPU 95A arancio, tre varianti", qta: 3, bom: E3}
    attrezzi: [pennarello]
    fonti: [D-064, D-066, D-077, "cad/stl/README.md 'Piedino.stl'", "docs/predisposizioni.md X5", "guida/problemi.md P-016"]

  - id: "1.15"
    titolo: Piedino, prova con l'FSR
    formato: grande
    in_evidenza: [zampa/Tibia, zampa/Piedino, zampa/FSR_piede]
    mostra: []
    esploso: {pezzi: {"zampa/Piedino": [0, 0, -50], "zampa/FSR_piede": [0, 0, -14]}}
    vista: tibia_capovolta
    nascondi: [zampa/Cuscinetto_ginocchio]
    evidenzia:
      - {chiave: zampa/Tibia, lav: tasca_fsr}
      - {chiave: zampa/Tibia, lav: "gola_fsr_*"}
      - {chiave: zampa/Piedino, lav: tacca_fili}
    etichette:
      - {testo: FSR, chiave: zampa/FSR_piede}
      - {testo: doppino, punto: [134, 10, -62]}
    testo:
      - "Salda in pochi secondi il doppino 28 AWG alle linguette dell'FSR, a bassa temperatura [C]."
      - "Posa l'FSR sulla punta della tibia di prova, piega la coda e posa le linguette nella tasca."
      - "Cala il piedino sulla punta e premi fino in fondo; ripeti con gli altri due."
      - "Misura e annota presa, scorrimento e piega della coda per ogni stretta."
      - "Posa pesi noti sul piedino: misura e annota la resistenza."
    tabella:
      intestazione: ["Prova", "Atteso", "Cosa si annota"]
      righe:
        - ["Presa del cappuccio", "tiene, si toglie a mano [C]", "la stretta che tiene (0, 0,2 o 0,4)"]
        - ["Coda e doppino", "interi, non schiacciati [C]", "sì o no"]
        - ["Resistenza", "> 1 MΩ a vuoto, pochi kΩ sotto peso [C]", "100 g, 500 g, 1,2 kg"]
        - ["Attrito del piedino", "uguale con e senza [C]", "la differenza"]
    avvisi:
      - {tipo: opzionale, x: X5, quando: meglio_ora, testo: "Senza FSR salta il passo: la stretta si sceglie a mano. Se coda o tasca cambiano, cambia la tibia: meglio saperlo prima delle sei."}
      - {tipo: nota, testo: "Un piede porta fino a 12 N, circa 1,2 kg [V]; solo 28 AWG (D-073)."}
    extra:
      - {nome: "FSR 400 Short", qta: 1, bom: X5}
      - {nome: "doppino 28 AWG siliconico", qta: 1, bom: X5}
    attrezzi: [saldatore, spelafili, multimetro, pesi_noti]
    fonti: [D-066, D-064, D-073, "docs/predisposizioni.md X5 e 'Verifiche'", "docs/piano-elettronica-software.md fase P1", "guida/problemi/zampa.yaml (dati dell'FSR)"]

  - id: "1.16"
    titolo: Luce, stampa
    formato: grande
    in_evidenza: [attrezzo/Provino_Luce_Nero, attrezzo/Provino_Luce_Bianco]
    mostra: []
    esploso: {pezzi: {"attrezzo/Provino_Luce_Bianco": [0, 0, 22]}}
    vista: {direzione: [0.3, -0.7, 0.9], su: [0, 0, 1]}
    etichette:
      - {testo: NERO, punto: [-5, -34, 3]}
      - {testo: BIANCO, punto: [0, 10, 31]}
    testo:
      - "Stampa le due parti insieme, in due colori: PLA nero e PLA bianco."
      - "Posa il fondo sul piatto, con il bianco in alto."
      - "Controlla che le strisce di bianco abbiano fatto ponte sulle camere."
      - "Infila uno spezzone di striscia a 120 LED/m nei canali sotto."
    tabella:
      intestazione: ["Zona", "Camera nera", "Bianco sopra"]
      righe:
        - ["Riga 1, tre camere", "profonde 2, 4 e 6 mm [V]", "quattro strisce da 0,4, 0,8, 1,2 e 1,6 mm [V]"]
        - ["Riga 2, anello del pulsante", "Ø29,6 × 6 [V]", "1,6 con l'intarsio nero da 0,6, anello assottigliato a 0,8 [V]"]
    avvisi:
      - {tipo: nota, testo: "Il canale sotto è alto 1,6 e largo 4,6: sotto ogni camera cade sempre un LED [V]. È il provino della luce delle tibie (X31), dei lobi (X12) e dell'anello (X11)."}
    fonti: [D-069, D-068, "cad/stl/README.md 'Attrezzo_Provino_Luce'", "cad/script/attrezzi.py fai_provino_luce", "docs/predisposizioni.md X10"]

  - id: "1.17"
    titolo: Luce, prova
    formato: grande
    in_evidenza: [attrezzo/Provino_Luce_Nero, attrezzo/Provino_Luce_Bianco]
    mostra: []
    vista: {direzione: [0.2, -0.6, 1.0], su: [0, 1, 0]}
    etichette:
      - {testo: "RIGA 1", punto: [0, 12, 9.2]}
      - {testo: "RIGA 2", punto: [0, -20, 9.2]}
    testo:
      - "Collega la striscia: 5 V, massa e dato dal GPIO48, come in docs/cablaggio.md (X9)."
      - "Accendi 3 pixel in bianco."
      - "Spegni la luce della stanza."
      - "Guarda ogni camera sotto le quattro strisce di bianco, poi l'anello del pulsante da sopra."
      - "Misura e annota la striscia più sottile che dà luce uniforme, senza il punto del LED."
    tabella:
      intestazione: ["Cosa guardi", "Oggi nel CAD", "Parametro", "Annota"]
      righe:
        - ["Bianco sopra la luce (anello, lobi)", "0,8 [V]", "luc_bianco (0,6–0,8)", ""]
        - ["Bianco del diffusore della tibia", "0,6 [V]", "luc_dif_sp (0,6–0,8)", ""]
        - ["Altezza della camera nera", "6 [V]", "luc_camera_h", ""]
        - ["Colore del diffusore", "bianco", "bianco (deciso, D-076)", ""]
    avvisi:
      - {tipo: prova, testo: "Atteso: 0,6–0,8 mm di bianco nascondono il punto del LED e lasciano luce uniforme [C]."}
      - {tipo: nota, testo: "Nessun dato pubblicato sulla luce nel PLA bianco: il provino la misura a occhio (D-069)."}
      - {tipo: importante, testo: "Serve un programma che accenda 3 pixel dal GPIO48: non c'è ancora [C]."}
      - {tipo: nota, testo: "Gli incastri del diffusore (luc_dif_gio 0,1) e del fondo dell'anello (luc_fondo_gio 0,05) non stanno nel provino: si tarano sui pezzi veri alla prima stampa [C]."}
    attrezzi: [multimetro]
    fonti: [D-069, D-066, "docs/predisposizioni.md X10 e X31", "docs/piano-elettronica-software.md fase P1", "docs/cablaggio.md (segnali, GPIO48)"]

  - id: "1.18"
    titolo: I valori tornano nel CAD
    formato: grande
    immagine: false
    testo:
      - "Riporta ogni valore della tabella nel CAD come parametro, in una versione nuova."
      - "Rifai le verifiche e riesporta gli STL, come in cad/CLAUDE.md «A valle di ogni modifica»."
      - "Ristampa solo i pezzi che sono cambiati."
      - "Non stampare nessun altro pezzo con gli STL di oggi."
    tabella:
      intestazione: ["Provino", "Parametro", "Oggi", "Valore trovato"]
      righe:
        - ["1", "ins_m3_d, ins_m3_l", "4,2 / 6,7", ""]
        - ["1", "ins_m2_d, ins_m2_l", "3,4 / 4,0", ""]
        - ["2", "sq_d, sq_sp, sq_h", "20 / 2,5 / 5,5", ""]
        - ["2", "sq_mozzo_d, sq_fori_pcd, sq_fori_d", "9 / 14 / 3", ""]
        - ["3", "gio_servo, vite_m3_pilota", "0,2 / 2,5", ""]
        - ["3", "cus_sede_d, nervature delle culle", "10,0 / da disegnare", ""]
        - ["4", "perno_foro, cox_testa_vite_d", "5,0 / 5,6", ""]
        - ["4", "cox_disco_luce", "0,3", ""]
        - ["5", "cov_testa_d, oppure le costole", "5,6", ""]
        - ["6", "pied_stretta", "0", ""]
        - ["7", "luc_bianco, luc_dif_sp, luc_camera_h", "0,8 / 0,6 / 6", ""]
        - ["7", "colore del diffusore", "bianco", ""]
    avvisi:
      - {tipo: importante, testo: "Prima di stampare il resto: ins_m3_d muove anche le bugne delle culle e sq_h le quote lungo Y di tutta la zampa (CLAUDE.md, aperto 4; D-046)."}
      - {tipo: nota, testo: "Con il CAD nuovo si aggiorna la sezione 2 se cambia un orientamento, e la sezione 3 con i valori degli inserti."}
    fonti: ["CLAUDE.md, aperto 4 ('Poi ins_m3_d … e verifica completa')", "cad/CLAUDE.md 'A valle di ogni modifica'", D-046, D-075, "docs/piano-guida.md sezione 1"]
