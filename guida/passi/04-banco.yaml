      - {tipo: importante, testo: "Strip a 25,4 mm, 10 passi: valgono solo con la misura del passo 4.04 (S-02) [C]."}
      - {tipo: nota, testo: "I pin non usati restano senza stagno: meno giunti accanto alle piazzole delle righe 1, 3, 11 e 13, niente stagno sopra le teste M3 (schemi.md 1.7, scelta 12)."}
    attrezzi: [saldatore, tronchesino]
    fonti:
