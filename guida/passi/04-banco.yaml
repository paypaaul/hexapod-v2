  - id: "4.22"
    titolo: Scheda del carapace, taglio e CE1
    formato: grande
    figura: schemi/scheda_carapace.svg
    testo:
      - "Taglia dall'avanzo di millefori una striscia di 20 × 30 mm: 7 colonne (A–G) e 11 righe di fori."
      - "Allarga a Ø 2,6 i quattro fori d'angolo A-1, G-1, A-11 e G-11."
      - "Segna con il pennarello i 16 fori con la croce: appoggiano sulle bugne."
      - "Salda CE1 sdraiato sul lato componenti, + in A-9 e − in B-9, verso la riga 5."
    avvisi:
      - {tipo: importante, testo: "Taglia solo se la decisione di S-01 non cambia la scheda nel CAD 2.1.7 [C]. CE1 in Ø 6,3 (S-18); se è lungo 11 mm il fondo arriva a 0,4 mm da A-4 e B-4, i fili dei moduli del passo 13.16."}
      - {tipo: nota, testo: "Il disegno è il lato componenti visto da sotto, come pende dal dorso: ottagono a sinistra. I fori d'angolo sono a 0,23 mm dalle bugne del CAD: per questo Ø 2,6."}
    attrezzi: [seghetto, trapanino, nastro_pennarello, saldatore]
    fonti: ["guida/schemi/schemi.md 2 (griglia, zone delle bugne), 2.1 (CE1) e 2.5 punti 1-2", "guida/problemi/schemi.yaml S-18"]

  - id: "4.23"
    titolo: Scheda del carapace, testata
    formato: grande
    figura: schemi/scheda_carapace.svg
    testo:
      - "Controlla con la spina in mano il verso della tacca della testata: la sporgenza della spina entra nella tacca (S-26)."
      - "Infila J2 con i poli dispari in colonna D e i pari in colonna E, righe 2–9, tacca verso la colonna D."
      - "Salda J2 solo dopo la decisione di S-01."
    avvisi:
      - {tipo: importante, testo: "Bloccante: con la testata dritta e la spina servono 16–18 mm sotto la scheda, sopra l'ESP32 ne restano circa 10. Il posto della testata si decide nel CAD 2.1.7 (S-01) [C]. Collegamenti e fili del disegno restano validi."}
      - {tipo: attenzione, testo: "Testata con la chiave: girata di 180° la spina porterebbe il +5 V dei poli 1–2 sui poli 15–16, il pulsante della 2813."}
    attrezzi: [saldatore]
    fonti: ["guida/schemi/schemi.md 2.1 (J2), 2.5 punto 3, 2.7 scelta 1", "guida/problemi/schemi.yaml S-01 (bloccante), S-26"]

  - id: "4.24"
    titolo: Scheda del carapace, ponticelli e fili 101–112
    formato: grande
    figura: schemi/scheda_carapace_saldature.svg
    testo:
      - "Gira la scheda sul lato saldature, come nel disegno."
      - "Fai i ponticelli D-2–E-2, D-3–D-4, E-6…G-6 ed E-7…G-7."
      - "Salda i fili della tabella in ordine, sulla saldatura del pin."
      - "Controlla in continuità ogni filo, e che niente stia sui fori con la croce."
    tabella:
      intestazione: [N., Da → a, Rete, AWG]
      righe:
        - ["101", "D-2 → A-9", "+5 V", "26"]
        - ["102", "E-2 → G-3", "+5 V", "30"]
        - ["103", "D-4 → B-9", "massa", "26"]
        - ["104, 105", "D-6 → G-4, D-4 → D-6", "massa", "30"]
        - ["106", "D-3 → A-3", "massa", "30"]
        - ["107, 108", "D-5 → B-3, D-5 → G-5", "+3,3 V", "30"]
        - ["109", "E-4 → B-4", "SCL", "30"]
        - ["110", "E-5 → A-4", "SDA", "30"]
        - ["111", "D-7 → G-8", "WS", "30"]
        - ["112", "D-8 → G-9", "dati ampli", "30"]
    avvisi:
      - {tipo: importante, testo: "Bloccante: ponticelli e fili si saldano sui pin di J2, quindi dopo il passo 4.23 e la decisione di S-01 [C]. I fili dei moduli, il dato dei LED e il pulsante si saldano nel passo 13.16."}
    attrezzi: [saldatore, spelafili, multimetro]
    fonti: ["guida/schemi/schemi.md 2.2, 2.3 e 2.5 punto 4", "guida/problemi/schemi.yaml S-01"]

  - id: "4.25"
    titolo: Scheda del carapace, prove
    formato: grande
    immagine: false
    testo:
      - "Misura ogni riga sui pin della testata."
      - "Annota il valore. Le prove con i moduli si fanno nel passo 13.16."
    tabella:
      intestazione: [N., Punto, Atteso, Misurato]
      righe:
        - ["1", "polo 1 (D-2) contro polo 3 (D-3)", "non 0 Ω; sale mentre CE1 si carica", ""]
        - ["2", "polo 7 (D-5) contro poli 3, 5, 9", "non 0 Ω", ""]
        - ["3", "polo 1 contro polo 7", "aperto", ""]
        - ["4", "poli 1 e 4 contro poli 6, 8, 10, 11, 12, 13", "aperto", ""]
        - ["5", "poli 15 e 16 contro tutti gli altri", "aperto", ""]
        - ["7", "polo 14 (E-8) contro tutti", "aperto", ""]
        - ["8", "ogni filo 101–112, dal polo alla piazzola", "0 Ω", ""]
        - ["9", "fori con la croce, lato saldature", "niente stagno né fili", ""]
    avvisi:
      - {tipo: attenzione, testo: "Prova 3: 5 V sul 3,3 V brucerebbe i sensori e l'ESP32. Prova 4: 5 V su un GPIO."}
      - {tipo: nota, testo: "Prova 6 (polo 12 contro massa, 100 kΩ di R8) e la seconda metà della 8 vogliono i moduli: si fanno nel passo 13.16 (schemi.md 2.6)."}
    attrezzi: [multimetro]
    fonti: ["guida/schemi/schemi.md 2.6 (prove 1-9)"]

  # ------------------------------------------------------------------------------------------------ ramo logica
  - id: "4.26"
    titolo: Ramo logica sul tavolo
    formato: grande
    immagine: false
    testo:
      - "Salda sulla 2813 una resistenza da 100 kΩ fra OFF e massa."
      - "Metti in F1 il fusibile da 3 A, in F2 quello da 2 A; T-plug rosso nel Wago +, nero nel Wago −."
      - "Collega il Wago + a F2, F2 all'ingresso della 2813 e il Wago − alla massa della 2813 (26 AWG)."
      - "Collega con i coccodrilli all'uscita della 2813 il filo della batteria (P-4) e il reoforo di R6, alla massa il filo di S-13."
      - "Collega con due fili provvisori uscita e massa della 2813 a VL+ e VL− della SSC-32."
      - "Controlla che l'ESP32 sia fuori dagli strip e la USB staccata."
    avvisi:
      - {tipo: attenzione, testo: "Prima della batteria misura in continuità fra Wago + e Wago −, e fra P-4 e Q-4: nessun contatto. Il T-plug si collega per ultimo."}
      - {tipo: importante, testo: "I coccodrilli sono provvisori: nella sezione 8 i fili si saldano sulla 2813 nel corpo. La 100 kΩ resta sulla 2813: GPIO41 flotta durante il reset e OFF spegne sopra 1 V (S-11)."}
    extra: [{nome: "T-plug, F1 con fusibile da 3 A, F2 con fusibile da 2 A, 2 Wago 221-415, 2813, 100 kΩ", qta: 1, bom: "B12, B5, B6, B13, B3, B10"}]
    attrezzi: [multimetro, spelafili, saldatore, coccodrilli, cacciavite_piatto]
    fonti:
      - "guida/schemi/schemi.md 1.5 ('Prima accensione, senza ESP32') e sezione 3, riga 4.07"
      - "guida/problemi/schemi.yaml S-11, S-20"
      - "docs/BOM.md, 'Schema di alimentazione' e B3, B4, B5, B6, B12, B13, B17"
      - "docs/cablaggio.md, 3.1 ('Ramo logica', '5 V e VL')"

  - id: "4.27"
    titolo: Prima accensione, senza ESP32
    formato: grande
    immagine: false
    testo:
      - "Collega il T-plug alla batteria e premi il pulsantino della 2813."
      - "Misura e annota la tabella contro A-12, con i puntali nelle prese degli strip."
      - "Premi il pulsantino: la 2813 spegne. Stacca il T-plug."
    tabella:
      intestazione: [Punto, Atteso, Misurato]
      righe:
        - ["Uscita della 2813 contro massa", "tensione del pacco, 6,0–8,4 V [V]", ""]
        - ["R-4, uscita di U2", "5,0 V [V]", ""]
        - ["Presa A-2, pin 5V dopo D1", "4,6–5,0 V a vuoto [S]", ""]
        - ["Presa R-12, GPIO1", "0,32 volte il pacco: 2,37 V a 7,4 V, 2,69 V a 8,4 V", ""]
        - ["Tutte le altre prese, T-2 compresa", "sotto 0,1 V", ""]
        - ["Pin A e B della 2813, accesa", "da annotare (S-10) [C]", ""]
    avvisi:
      - {tipo: attenzione, testo: "Se R-4 non è a 5,0 V o una presa ha tensione, spegni subito: ordine dei pin di U2 sbagliato (S-03) o ponte sulla basetta. L'ESP32 entra solo dopo questa prova."}
      - {tipo: nota, testo: "GPIO1 legge il pacco per 47/147 (R6 e R7). A presa A-2 sbagliata: D1 al contrario. Tensione di A e B: decide se il pulsante può stare accanto al polo 13 (S-10)."}
    attrezzi: [multimetro]
    fonti: ["guida/schemi/schemi.md 1.5 ('Prima accensione, senza ESP32')", "guida/problemi/schemi.yaml S-03, S-10", "docs/BOM.md B10"]

  - id: "4.28"
    titolo: ESP32 negli strip, prova del ramo logica
    formato: grande
    immagine: false
    testo:
      - "Infila l'ESP32 negli strip, antenna verso la colonna U, con la USB staccata."
      - "Collega il T-plug e premi il pulsantino della 2813: il LED dell'ESP32 si accende [S]."
      - "Misura e annota le tensioni della tabella contro A-12, sul lato saldature."
      - "Misura la corrente con il multimetro in serie al filo rosso dopo F2."
      - "Premi il pulsantino e stacca il T-plug."
    tabella:
      intestazione: [Punto, Atteso, Misurato]
      righe:
        - ["R-4, uscita di U2", "5,0 V [V]", ""]
        - ["A-2, pin 5V dopo D1", "4,55–4,7 V [S]", ""]
        - ["T-2, 3V3 dell'ESP32", "3,3 V [V]", ""]
        - ["R-11, GPIO1", "0,32 volte il pacco [V]", ""]
        - ["P-13, GPIO42", "0 V [V]", ""]
        - ["Corrente dopo F2", "meno di 0,5 A [S]", ""]
    avvisi:
      - {tipo: attenzione, testo: "Se U2 scalda, il 5 V è lontano da 5,0 V o la corrente supera 1 A: premi il pulsantino e stacca il T-plug. USB staccata finché l'ESP32 prende il 5 V dalla basetta (S-07)."}
    attrezzi: [multimetro]
    fonti:
      - "guida/schemi/schemi.md 1.5 (dopo la prima accensione) e sezione 3, riga 4.08"
      - "docs/software.md 6.7 (B0, B1); docs/piano-elettronica-software.md 3.3 (circa 0,49 A)"
      - "guida/passi/12-accensione.yaml (stessa prova nel robot)"

  - id: "4.29"
    titolo: SSC-32 dalla micro-USB, prova B1
    formato: grande
    in_evidenza: [corpo/SSC32]
    vista: {direzione: [0.6, -0.45, 0.65], su: [0, 0, 1]}
    evidenzia:
      - {chiave: corpo/SSC32, lav: "corpo:micro_usb"}
      - {chiave: corpo/SSC32, lav: "corpo:morsettiera"}
    etichette:
      - {testo: Micro-USB, punto: [-48, -12.5, 4]}
      - {testo: "VL+ VL−", punto: [15.4, 0, 10]}
    testo:
      - "Collega la SSC-32 al Mac con il cavo micro-USB dati."
      - "Collega il T-plug e premi il pulsantino della 2813: VL arriva alla SSC-32."
      - "Apri un terminale seriale a 115200 baud, 8N1, sulla porta della SSC-32 [C]."
      - "Scrivi VER, poi Q, e annota le risposte; se non risponde, prova le velocità vicine."
      - "Spegni la 2813 e stacca T-plug e micro-USB."
    tabella:
      intestazione: [Comando, Atteso, Risposta]
      righe:
        - ["VER", "la versione della scheda [C]", ""]
        - ["Q", "risposta senza errori [C]", ""]
        - ["Velocità che risponde", "115200 baud [C]", ""]
    avvisi:
      - {tipo: importante, testo: "Ultimo momento: a corpo montato la micro-USB non si raggiunge (D-051). Quello che vuoi cambiare nella SSC-32 si fa adesso."}
      - {tipo: attenzione, testo: "Non scrivere i registri: sono in EEPROM, circa 100 000 scritture [S]. La velocità si cambia solo se 115200 non risponde, con il pulsante BAUD [S]."}
      - {tipo: nota, testo: "Annota le risposte parola per parola: diventano i dati dell'emulatore (docs/software.md 6.5). Il clone non è mai stato acceso [C]."}
    attrezzi: [mac_seriale]
    fonti:
      - "D-051 (micro-USB non raggiungibile a corpo montato: si configura al banco)"
      - "docs/software.md 2.4 (comandi), 6.5 (emulatore), 6.7 (B1)"
      - "docs/studio-componenti.md ('Controllo (invariato)': 115200 baud 8N1)"
      - "guida/problemi/banco.yaml (clone della SSC-32 non verificato)"

  # ------------------------------------------------------------------------------------------------ regolatori dei servo
  - id: "4.30"
    titolo: Regolatore sulla slitta
    formato: grande
    nuovi: [corpo/Corpo_Slitta_Regolatore_S, corpo/Corpo_Slitta_Regolatore_D, corpo/Regolatore_S, corpo/Regolatore_D]
    giunzioni: [{id: regolatori, esploso: 17}]
    esploso: {pezzi: {"corpo/Regolatore_S": [0, -20, 0], "corpo/Regolatore_D": [0, 20, 0]}}
    vista: {direzione: [0.8, -0.3, 0.5], su: [0, 0, 1]}
    evidenzia:
      - {chiave: "corpo/Corpo_Slitta_Regolatore_*", lav: "ins_*"}
    testo:
      - "Controlla che i quattro inserti M2 di ogni slitta siano a filo, sulla faccia verso il centro."
      - "Posa il regolatore sulla slitta, con i componenti verso il centro."
      - "Allinea i quattro fori del circuito con gli inserti."
      - "Accosta le quattro viti M2 × 5, poi stringile piano."
      - "Fai lo stesso sull'altra slitta: è la stessa, ruotata."
    avvisi:
      - {tipo: importante, testo: "Stringi piano, finché la testa tocca il circuito: la punta della M2 × 5 arriva a 0,6 mm dal fondo del foro [V], e una vite forzata rompe la plastica o stacca l'inserto."}
      - {tipo: nota, testo: "I fori del Pololu stanno a 4,191 mm dal lato delle piazzole, non al centro (D-051): se non coincidono con gli inserti, controlla il verso del regolatore [S]."}
      - {tipo: opzionale, x: X14, quando: meglio_ora, testo: "NTC: incollane ora una sulla bobina di ogni regolatore e salda due fili 28 AWG [C]; nel corpo non si arriva (8.24)."}
    extra: [{nome: "NTC 10 kΩ", qta: 2, bom: X14}]
    attrezzi: [croce_ph0]
    fonti:
      - "D-051 (regolatori su slitte stampate, fori a 4,191 mm)"
      - "docs/BOM.md, 'Viteria e inserti' (regolatori → slitte M2 × 5, 8) e D8"
      - "guida/catalogo/giunzioni.yaml (regolatori: 4 viti per regolatore, presa 3,42 mm, fondo libero 0,58 mm)"
      - "guida/passi/03-inserti.yaml 3.15 e 3.16 (inserti delle slitte)"

  - id: "4.31"
    titolo: Fili dei regolatori e R3
    formato: grande
    immagine: false
    testo:
      - "Salda su VIN e GND del regolatore due fili 14 AWG da 0,5 m [S], rosso e nero."
      - "Salda su VOUT e GND due fili 14 AWG da 0,6 m [S], rosso e nero."
      - "Salda una R3 da 22 kΩ fra ENA e GND, dal lato dei pin, con i reofori corti."
      - "Lascia liberi ENB e PG."
      - "Controlla che le saldature siano lucide e che ingresso e uscita non si tocchino. Ripeti per il regolatore destro."
    avvisi:
      - {tipo: attenzione, testo: "Controlla la polarità prima di saldare: la protezione da inversione c'è sull'ingresso (BOM B1), ma non metterla alla prova."}
      - {tipo: importante, testo: "Con la R3 sul regolatore un filo dell'ENA staccato lascia il rail spento. ENB non si usa: tirato a VIN e unito a ENA con 10 kΩ (S-05, S-20)."}
      - {tipo: nota, testo: "La seconda R3 da 22 kΩ non è sicura nel set B10 (S-05) [C]. Con gli INA260 (X7) il filo rosso d'uscita passa dalla loro morsettiera, che potrebbe non prendere un 14 AWG (sezione 8) [C]."}
    attrezzi: [saldatore, spelafili, multimetro]
    fonti:
      - "docs/cablaggio.md 3.1 ('Ingresso dei regolatori', 'Rail servo')"
      - "guida/schemi/schemi.md 1.6 (P-13 → D2 → ENA; R3 su ogni regolatore) e 1.7 scelta 6"
      - "guida/problemi/schemi.yaml S-05, S-20"
      - "D-073 (14 AWG sulle uscite dei regolatori)"

  - id: "4.32"
    titolo: Prova dei regolatori
    formato: grande
    immagine: false
    testo:
      - "Collega l'ingresso del regolatore ai Wago, con F1 da 3 A; l'uscita resta libera."
      - "Collega con un coccodrillo il suo filo dell'ENA, quello dopo D2, al pin ENA."
      - "Collega il T-plug e misura l'uscita con l'ENA a riposo."
      - "Collega con un Dupont il pin 3V3 dell'ESP32, sulla sola USB, alla presa P-12 della basetta (GPIO42), e misura l'uscita."
      - "Stacca il T-plug. Ripeti per l'altro regolatore."
    tabella:
      intestazione: [ENA, Uscita attesa, Misurato]
      righe:
        - ["a riposo, R3 da 22 kΩ verso massa", "0 V: rail spento [C]", ""]
        - ["dal 3,3 V attraverso D2, con la R3", "6,0 V [C]", ""]
    avvisi:
      - {tipo: attenzione, testo: "Con la R3 il regolatore deve restare spento: se l'uscita dà 6 V, stacca il T-plug e annota. A batteria piena l'ENA sta a 0,35 V; la soglia bassa non è pubblicata (S-05) [C]."}
      - {tipo: importante, testo: "ESP32 tolta dalla basetta, con la sua massa al Wago −; la 2813 resta spenta. La presa P-12 è unita a P-13 e all'anodo di D2."}
      - {tipo: nota, testo: "Il coccodrillo è provvisorio: nella sezione 8 il filo si salda sull'ENA. Nel robot la prova si ripete con GPIO42 (sezione 12)."}
    attrezzi: [multimetro, coccodrilli]
    fonti:
      - "guida/schemi/schemi.md sezione 3, riga 4.12 (R3 e D2 in linea; ENB libero)"
      - "guida/problemi/schemi.yaml S-05, S-20"
      - "docs/BOM.md B1, B11 (soglia bassa non pubblicata: da provare al banco)"
      - "docs/software.md 6.7 (B3)"

