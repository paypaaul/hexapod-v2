# Sezione 4, banco dell'elettronica (D-075, docs/piano-guida.md "Struttura della guida"; fasi B0 e B1 di docs/software.md
# 6.7 e di docs/piano-elettronica-software.md, P2). F3, estrattore delle sezioni 4 e 5; F3c, schemi delle schede.
# Nessun pezzo e' montato nel corpo: SSC-32, ESP32 e regolatori sono comprati e entrano nel corpo nella sezione 8, qui
# si mostrano a colori pieni (in_evidenza) con le porte in giallo (zone corpo:... delle schede comprate). Nuovi sono solo
# i pezzi della sezione: regolatori, slitte e supporti degli INA260 (X7). Gli inserti M2 di slitte e supporti li mette
# la sezione 3 (3.15, 3.16, 3.19): qui si controllano soltanto.
# Basetta e scheda del carapace seguono gli schemi F3b (guida/schemi/schemi.md, figure basetta*.svg e
# scheda_carapace*.svg; problemi S-01 ... S-27 in guida/problemi/schemi.yaml). Ordine di saldatura: schemi.md 1.4 e 2.5;
# prove: 1.5 e 2.6; fili verso il robot: 1.6. TUTTE le saldature sulla basetta, compresi i fili che vanno nel corpo,
# si fanno qui al banco (guida/problemi/riconciliazione.yaml, "Fili saldati sulla basetta gia' avvitata"): nella
# sezione 8 la basetta sta sulle colonnine con le saldature in basso. La sezione 8 salda solo l'altro capo dei fili
# (2813, regolatori, prese delle luci) e innesta i connettori. I fili dei moduli del carapace sulla scheda del carapace
# restano nel passo 13.16 (schemi.md 2.5, punto 5), con la scheda ancora fuori dal carapace.
# Bloccanti degli schemi chiusi dal CAD 2.1.7 (D-076, D-077):
#  - S-02 / P-005: file dei pin dell'ESP32 a 25,4 (S); la condizione per tagliare e saldare e' la prova a secco (4.04);
#  - S-19 / P-003: vassoio su colonne della base con M2 x 5 svasate a filo, niente distanziali: sotto la basetta non ci
#    sono piu' teste M3 e B-2, T-2, D-12 si saldano con gli altri, giunti piatti (4.06, 4.10, 4.11, 4.14);
#  - S-01 / P-002: testata 2 x 8 a 90 gradi sul bordo di coda della scheda del carapace, scheda 21,5 x 30, viti spostate
#    (4.22-4.25). Le figure basetta*.svg e scheda_carapace*.svg e schemi.md restano della 2.1.6 e non si toccano qui
#    (le rifara' il circuito stampato futuro): i passi dicono cosa e' cambiato, il resto e' in guida/problemi/banco.yaml.
# P-140: cavo piatto in due strisce da 8 dopo il fermacavo (4.15; percorso in 13.19).
# Le immagini delle slitte mostrano i due lati insieme, di fronte, con gli esplosi simmetrici: la slitta destra e' la
# sinistra ruotata (D-066, X7) e le viti dei due lati stanno nella stessa giunzione (regolatori, 8 viti).
sezione:
  id: banco
  numero: 4
  titolo: Banco dell'elettronica
  colore: "#2f9e6f"
  terna: robot
  istanza: AS
  presenti_iniziali: []
  obiettivo: >-
    Preparare e provare l'elettronica sul tavolo, prima del corpo: SSC-32 configurata dalla micro-USB, che a corpo
    montato non si raggiunge (D-051); ESP32; basetta e scheda del carapace saldate secondo gli schemi, con i fili che
    vanno nel corpo; ramo logica; regolatori dei servo sulle slitte, con gli INA260.
  prima:
    - "Pezzi stampati (sezione 2) e inserti M2 di slitte, supporti e carapace (sezione 3)."
    - "Pezzi qui a destra in casa; batteria carica (0.06); cavi USB-C e micro-USB per dati; Mac con ESP-IDF."
  tempo: "circa 12 ore la prima volta, 6–7 di saldature [S]"
  stato_elettrico: >-
    Batteria solo nei passi di prova, per ultima: F2 da 2 A sulla logica, F1 da 3 A sul regolatore; prima, continuità fra
    + e −. Mai la USB dell'ESP32 insieme al 5 V della basetta: il pin 5V è legato alla USB (4.05).
  fonti: [D-051, D-053, D-073, "docs/software.md 6.7", "docs/piano-elettronica-software.md 4 (P2)", docs/cablaggio.md, guida/schemi/schemi.md]
  attrezzi: []
  controllo:
    - "SSC-32: ponticelli VS VL e VS1 VS2 tolti; quattro barre saldate sul retro, senza corti; annotato se VL− è unito alle masse dei servo."
    - "SSC-32: dalla micro-USB risponde a VER, e la risposta è annotata. Da qui in poi non si configura più."
    - "ESP32: sigla, serigrafia e GPIO40–3V3 annotati; strip entrate a secco nelle righe 2 e 12; flash dalla porta TTL; GPIO42 a 0 V."
    - "Basetta: saldata come basetta.svg e basetta_saldature.svg, B-2, T-2 e D-12 compresi, fili verso il robot compresi; le 20 prove dei passi 4.20 e 4.21 tornano."
    - "Scheda del carapace: 21,5 × 30 con i fori sulle bugne; testata a 90°, CE1, ponticelli e fili 101–112 saldati sul disegno della 2.1.7; prove del passo 4.25 tornate."
    - "Cavo piatto: spina IDC crimpata, nastro diviso in due strisce da 8 dopo il fermacavo."
    - "Ramo logica: prima accensione senza ESP32 tornata; con l'ESP32 5,0 V su R-4, 4,55–4,7 V sul pin 5V, 3,3 V su T-2."
    - "Regolatori: ognuno sulla sua slitta con 4 viti M2 e la sua R3 da 22 kΩ; 0 V con l'ENA a riposo e 6,0 V con l'ENA alto."
    - "INA260, se montati: sinistro con il ponticello A1, destro con A0 e A1; supporti posati sulle slitte."
    - "Risultati e risposte annotati nelle tabelle dei passi."
  vista_finale: {direzione: [0.8, -0.3, 0.5], su: [0, 0, 1]}

passi:
  # ------------------------------------------------------------------------------------------------ SSC-32
  - id: "4.01"
    titolo: Ponticelli della SSC-32
    formato: grande
    in_evidenza: [corpo/SSC32]
    vista: {direzione: [0.6, -0.45, 0.65], su: [0, 0, 1]}
    evidenzia:
      - {chiave: corpo/SSC32, lav: "corpo:morsettiera"}
      - {chiave: corpo/SSC32, lav: "corpo:micro_usb"}
    etichette:
      - {testo: Morsettiera, punto: [15.4, 0, 10]}
      - {testo: VS VL, punto: [14, 14, 6]}
      - {testo: VS1 VS2, punto: [14, -14, 6]}
      - {testo: Micro-USB, punto: [-48, -12.5, 4]}
      - {testo: "Canali 0–15", punto: [-14, 26, 9]}
      - {testo: "Canali 16–31", punto: [-14, -26, 9]}
    testo:
      - "Posa la SSC-32 sul tavolo, con le spine in alto e la morsettiera verso di te."
      - "Togli il ponticello VS VL, vicino al canale 0."
      - "Togli i due ponticelli VS1 VS2, vicino al canale 16."
      - "Controlla con il multimetro, in continuità, che i morsetti VS1+, VS2+ e VL+ non si tocchino."
      - "Metti i tre ponticelli in un sacchetto, con l'etichetta SSC-32."
    avvisi:
      - {tipo: attenzione, testo: "Con VS VL al suo posto la logica, che arriva dalla batteria fino a 8,4 V, entrerebbe nel rail dei servo, che reggono al massimo 7,2 V [V]."}
      - {tipo: nota, testo: "Posizioni dal disegno del venditore [S]: cerca le scritte sulla scheda vera e, se non coincidono, annota dove sono [C]. In giallo morsettiera e micro-USB."}
      - {tipo: nota, testo: "VS VL si toglie perché la logica ha la sua alimentazione, dopo la 2813; VS1 VS2 perché ogni rail ha il suo regolatore."}
    attrezzi: [multimetro]
    fonti:
      - "docs/dimensioni-componenti.md, 'Servo controller SSC32-V2.5' (ponticelli, morsettiera, micro-USB: S)"
      - "docs/studio-componenti.md, 'Distribuzione: potenza dal retro della SSC-32'"
      - "docs/BOM.md, 'Schema di alimentazione' e A1 (4,8-7,2 V)"
      - "docs/software.md 6.7, B1 (ponticello VS-VL tolto)"
      - "build/guida/cad/zone/indice.json, Rif_SSC32_V25 (corpo:morsettiera, corpo:micro_usb)"

  - id: "4.02"
    titolo: Barre di rame sul retro della SSC-32
    formato: grande
    in_evidenza: [corpo/SSC32]
    vista: {direzione: [0.35, -0.55, -0.75], su: [0, 0, 1]}
    evidenzia:
      - {chiave: corpo/SSC32, lav: "corpo:zona_barre_retro"}
    etichette:
      - {testo: "Barre VS2 e massa", punto: [-14.5, -31, -2]}
      - {testo: "Barre VS1 e massa", punto: [-14.5, 31, -2]}
    testo:
      - "Guarda il retro sotto gli header: annota se fra i pin ci sono componenti [C]."
      - "Taglia quattro fili di rame Ø 1 mm da circa 50 mm [S] e stagnali."
      - "Salda una barra sui 16 pin VS1, la fila di mezzo del lato dei canali 0–15, e una sulla fila di massa, la più vicina al bordo."
      - "Ripeti sul lato dei canali 16–31, con VS2 e massa."
      - "Controlla in continuità: ogni barra tocca i suoi 16 pin, VS e massa non si toccano."
      - "Misura in continuità fra il morsetto VL− e una barra di massa, e annota se sono uniti (S-22)."
    avvisi:
      - {tipo: importante, testo: "Dopo il passo 4.01: con un ponticello rimasto, le barre unirebbero due rail."}
      - {tipo: attenzione, testo: "Ogni servo prende la corrente dal suo pin, circa 3 A ammessi [S]: le piste non portano potenza. I fili dei regolatori vanno a metà barra (sezione 8)."}
      - {tipo: nota, testo: "File dal bordo: massa, VS, segnale [S]. La fila VS sta a 23,5 mm dall'asse del robot, da x 10,3 a −39,4 [V]. Il risultato di VL− decide la massa della seriale nel passo 8.19."}
    extra: [{nome: "filo di rame stagnato Ø 1 mm, 4 pezzi da 50 mm", qta: 4, bom: B16}]
    attrezzi: [saldatore, tronchesino, multimetro]
    fonti:
      - "docs/studio-componenti.md, 'Distribuzione: potenza dal retro della SSC-32' (barre, 3 A per pin)"
      - "docs/BOM.md B16, B15 e 'Schema di alimentazione'"
      - "docs/cablaggio.md, tabella 1 (file degli header) e 2 ('Le barre di rame da 1 mm')"
      - "guida/problemi/schemi.yaml S-22 (VL− e masse dei servo)"
      - "guida/problemi/banco.yaml (retro della SSC-32 da guardare)"

  # ------------------------------------------------------------------------------------------------ ESP32
  - id: "4.03"
    titolo: ESP32, sigla e serigrafia
    formato: grande
    in_evidenza: [corpo/ESP32]
    vista: {direzione: [-0.55, -0.55, 0.65], su: [0, 0, 1]}
    evidenzia:
      - {chiave: corpo/ESP32, lav: "corpo:usb_c"}
      - {chiave: corpo/ESP32, lav: "corpo:connettore_fpc"}
    etichette:
      - {testo: USB-C, punto: [16.4, 0, 23]}
      - {testo: FPC della camera, punto: [43, 0, 22]}
      - {testo: antenna, punto: [78, 0, 22]}
      - {testo: "fila 5V … 3V3", punto: [48, 13, 18]}
      - {testo: "fila GND … 43", punto: [48, -13, 18]}
    testo:
      - "Posa l'ESP32 con i componenti in alto e l'antenna lontano da te."
      - "Leggi la sigla stampata sulla scheda: deve essere RE1.3 [C]."
      - "Leggi le scritte accanto ai pin: la fila con 5V e 3V3 sta a sinistra, con 5V verso la USB-C e 3V3 verso l'antenna [S]."
      - "Annota quale delle due USB-C è TTL (CH340) e quale OTG."
    avvisi:
      - {tipo: importante, testo: "Se 5V e 3V3 stanno nella fila di destra, fermati: la piedinatura dello schema è letta dall'immagine del venditore e le due file si scambierebbero, con il 5 V sul GND della scheda (S-15) [C]."}
      - {tipo: nota, testo: "In giallo le due USB-C e il connettore FPC della camera (sezione 8). TTL va al CH340 (console, flash); OTG è la USB nativa, riservata (docs/studio-componenti.md)."}
    fonti:
      - "guida/problemi/schemi.yaml S-15 (piedinatura dall'immagine dell'inserzione)"
      - "guida/schemi/schemi.md 1.2 (pin dell'ESP32, riga 2 da coda a testa: 5V … 3V3) e sezione 3, riga 4.03"
      - "docs/BOM.md A2 (la RE1.3 si legge sulla scheda)"
      - "docs/studio-componenti.md ('Scheda UICPAL ESP32-S3-CAM', pinout, USB-C)"
      - "CLAUDE.md, 'Da guardare sui pezzi in casa'"

  - id: "4.04"
    titolo: ESP32, passo dei pin e scheda TF
    formato: grande
    in_evidenza: [corpo/ESP32]
    vista: {direzione: [0.4, -0.55, -0.73], su: [0, 0, 1]}
    evidenzia:
      - {chiave: corpo/ESP32, lav: "corpo:pin_header"}
      - {chiave: corpo/ESP32, lav: "corpo:slot_tf"}
    etichette:
      - {testo: scheda TF, punto: [30, 0, 12]}
      - {testo: "25,4 [S]", punto: [60, 0, 6]}
    testo:
      - "Gira l'ESP32: pin e sede della scheda TF in alto."
      - "Infila le due strip femmina 1 × 20 sui pin."
      - "Prova a secco: infila le strip nelle righe 2 e 12 della millefori ancora intera, 10 passi fra le file [S]."
      - "Controlla che entrino senza forzare, con i pin dritti; poi togli la millefori."
      - "Controlla che nella sede TF non ci sia una microSD, e guarda se sotto la scheda ci sono altri componenti."
      - "Misura e annota, a scheda spenta, la resistenza fra il pin GPIO40 e il pin 3V3."
    tabella:
      intestazione: [Misura, Atteso, Misurato]
      righe:
        - ["Prova a secco, strip nelle righe 2 e 12", "entrano senza forzare: file a 25,4 mm [S]", ""]
        - ["Sotto la scheda, oltre la sede TF", "niente [C]", ""]
        - ["GPIO40 contro 3V3, scheda spenta", "circa 10 kΩ, il pull-up della microSD [S]", ""]
    avvisi:
      - {tipo: importante, testo: "Se le strip non entrano nelle righe 2 e 12, fermati e non tagliare la millefori: lo schema della basetta va rifatto (D-076, P-005)."}
      - {tipo: nota, testo: "File a 25,4 mm anche nel CAD dalla 2.1.7 [S]: il 24,7 di prima era fra le facce interne dei pin. Decide la prova a secco, non il calibro (D-076). Niente microSD: GPIO38–40 portano microfoni e audio (S-21)."}
    attrezzi: [calibro, multimetro]
    fonti:
      - "D-076 e guida/problemi.md P-005 (25,4 mm, 10 passi, S; prova a secco al posto del calibro)"
      - "cad/script/rif_componenti.py esp_file (25,4, S, dalla 2.1.7)"
      - "docs/ricerca/dati-moduli.md, Q-18 (interasse 25,4; 10 kΩ su GPIO40 verso 3V3)"
      - "guida/problemi/schemi.yaml S-08, S-21"
      - "docs/dimensioni-componenti.md:82-84 (GPIO38-40 della microSD)"
      - "guida/schemi/schemi.md 1.1 (U1, file a 25,4) e sezione 3, riga 4.03"

  - id: "4.05"
    titolo: ESP32 su USB, prova B0
    formato: grande
    immagine: false
    testo:
      - "Appoggia l'ESP32 sul tavolo, senza basetta, batteria e regolatori."
      - "Collega la porta USB-C TTL, quella del CH340, al Mac."
      - "Carica lo scheletro del firmware: . ~/esp/esp-idf/export.sh, poi dalla cartella firmware idf.py -p porta flash monitor [C]."
      - "Misura e annota le tensioni della tabella, contro GND."
      - "Stacca la USB."
    tabella:
      intestazione: [Punto, Atteso, Misurato]
      righe:
        - ["LED di alimentazione", "acceso [S]", ""]
        - ["Porta seriale sul Mac", "nuova, ls /dev/cu.* [C]", ""]
        - ["Flash con idf.py", "senza errori [C]", ""]
        - ["GPIO42 contro GND", "0 V: il firmware lo tiene basso [V]", ""]
        - ["Pin 5V contro GND, con la sola USB", "4,7–5,0 V: la USB arriva al pin dal PTC [S]", ""]
        - ["Pin 3V3 contro GND", "3,3 V [V]", ""]
    avvisi:
      - {tipo: attenzione, testo: "Una alimentazione alla volta: mai la USB con l'ESP32 negli strip della basetta accesa. Il pin 5V è legato alla VBUS della USB da un PTC da 0,5 A, senza diodo [S]: D1 protegge U2, non la porta USB (S-07)."}
      - {tipo: nota, testo: "Dato dello schema Freenove, stesso modulo; sulla UICPAL lo dice questa misura. Se il pin 5V resta a 0 V, la scheda ha un diodo: annotalo (S-07)."}
      - {tipo: nota, testo: "Lo scheletro del firmware non è mai stato provato sul chip e non accende il LED né legge GPIO1: si provano con il programma di banco S1, che non c'è ancora. Se il flash non parte: tieni BOOT, premi RST, rilascia BOOT [S]."}
    attrezzi: [multimetro, mac_seriale]
    fonti:
      - "docs/software.md 6.7 (B0: flash, LED, ADC su GPIO1, GPIO42 con il multimetro)"
      - "firmware/README.md ('Compilare il firmware', 'Non provato sul chip') e firmware/main/main.cpp (GPIO42 basso)"
      - "guida/problemi/schemi.yaml S-07; guida/schemi/schemi.md sezione 3, righe 4.03 e 4.08"
      - "docs/ricerca/dati-moduli.md, tabella dell'ESP32 (pin 5V legato alle VBUS da un PTC MF-PSMF050X-2, nessun diodo: V Freenove, S UICPAL)"
      - "guida/problemi/banco.yaml (programma di banco; diodo fra USB e pin 5V)"

  # ------------------------------------------------------------------------------------------------ basetta (schemi.md 1.4)
  - id: "4.06"
    titolo: Basetta, taglio, fori e croci
    formato: grande
    figura: schemi/basetta_saldature.svg
    testo:
      - "Taglia la millefori a 56 × 35 mm: 21 colonne (A–U) e 13 righe di fori, con 1,8 mm di bordo dietro la colonna A e 3,4 davanti alla U."
      - "Posa la basetta sulle colonnine del vassoio, usato come dima, e segna i quattro fori (D-053)."
      - "Trapana i quattro fori Ø 2,2."
      - "Pulisci le piazzole con alcol."
      - "Segna con il pennarello, sul lato saldature, i fori con la croce sopra le quattro colonnine: lì non va stagno."
    avvisi:
      - {tipo: importante, testo: "Taglia solo dopo la prova a secco del passo 4.04: le strip entrano nelle righe 2 e 12 (D-076, P-005)."}
      - {tipo: nota, testo: "Dalla 2.1.7 il vassoio si avvita con M2 svasate a filo e sotto la basetta non ci sono più teste M3 (D-076, P-003). Le croci delle teste (C e D nelle righe 1–3 e 11–13, T-2, T-12, U-1…U-3, U-11…U-13) non valgono più; restano quelle delle colonnine, con C-3, C-11, U-3 e U-11."}
      - {tipo: nota, testo: "Il disegno è il lato saldature, specchiato: riga 1 in basso, colonne A–U da sinistra (coda) a destra (testa). Un circuito stampato al posto della millefori arriverà in una versione successiva (D-076)."}
    extra: [{nome: "millefori 50 × 70 a doppia faccia (taglio 56 × 35) e 2 strip femmina 1 × 20", qta: 1, bom: C2}]
    attrezzi: [seghetto, trapanino, nastro_pennarello]
    fonti:
      - "guida/schemi/schemi.md 1 (griglia), 1.0 (zone vietate, della 2.1.6), 1.4 punto 1"
      - "D-053 (basetta 56 × 35 su quattro colonnine); D-076 (P-003, P-005); D-077"
      - "guida/dati/fori.json: Corpo_Vassoio foro_pa/pb/aa/ab svasati M2, bas_col_* (colonnine a (29; ±6,8) e (75,5; ±6,5))"
      - "docs/BOM.md C2 (millefori a doppia faccia, una piazzola per foro)"

  - id: "4.07"
    titolo: Basetta, prova a secco
    formato: grande
    figura: schemi/basetta.svg
    testo:
      - "Infila le due strip femmina 1 × 20 sui pin dell'ESP32."
      - "Infila sulla basetta, senza saldare, U3, U4 sulle sue strip, D1 e le resistenze, ognuno nei fori del disegno."
      - "Posa U2 su un quadrato di nastro, e un quadrato di nastro su U3 con PTC1 sdraiato sopra: Kapton o nastro isolante in PVC."
      - "Posa l'ESP32 con le strip nelle righe 2 e 12, antenna verso la colonna U."
      - "Controlla che l'ESP32 vada in fondo, senza toccare U2, U4 e PTC1."
    avvisi:
      - {tipo: importante, testo: "Se l'ESP32 non va in fondo, fermati: il PTC passa in linea fuori dalla basetta (S-08) [C]. Sotto l'ESP32 restano 8,5 mm: PTC1 su U3 arriva a 8,1 [S]."}
      - {tipo: nota, testo: "Il disegno è il lato componenti, visto dall'alto: testa del robot a destra, sinistra del robot (+Y) in alto. Kapton o nastro in PVC, quello che hai in casa: non sono nel BOM (D-076, P-072)."}
    extra:
      - {nome: "D24V22F5, traslatore KAmod, 1N5819, 4,7 kΩ (2), 47 kΩ 1 %, 100 nF SMD (2)", qta: 1, bom: "B2, C1, C3, B10, B8"}
      - {nome: "luci: SN74AHCT125N, 10 kΩ, 330 Ω (2), PTC MF-R075", qta: 1, bom: X9}
      - {nome: "nastro Kapton o in PVC, 2 quadrati da 15 mm (in casa, non nel BOM)", qta: 1}
    fonti:
      - "guida/schemi/schemi.md 1.1 (componenti) e 1.4 punto 2"
      - "guida/problemi/schemi.yaml S-08, S-24; D-076 (P-072: Kapton o PVC, consumabile fuori dal BOM)"
      - "D-053 (8,5 mm sotto l'ESP32)"

  - id: "4.08"
    titolo: Basetta, resistenze, D1 e U3
    formato: grande
    figura: schemi/basetta.svg
    testo:
      - "Salda sdraiate, sul lato componenti, le resistenze della tabella, una alla volta."
      - "Salda D1 sdraiato, con la fascia del catodo verso A-6."
      - "Taglia i reofori a 1 mm sotto la basetta."
      - "Salda U3 senza zoccolo: pin 1 in E-8, tacca verso la coda."
      - "Controlla in continuità ogni componente fra i suoi fori."
    tabella:
      intestazione: [Sigla, Valore, Fori]
      righe:
        - ["R1", "10 kΩ", "D-8 – A-8"]
        - ["R2", "330 Ω", "L-7 – L-4"]
        - ["R4", "4,7 kΩ", "J-3 – M-3"]
        - ["R5", "4,7 kΩ", "N-3 – Q-3"]
        - ["R7", "47 kΩ 1 %", "T-11 – Q-11"]
        - ["D1", "1N5819", "catodo A-6, anodo D-6"]
        - ["U3", "SN74AHCT125N", "pin 1–7 E-8…K-8, 8–14 K-11…E-11"]
    avvisi:
