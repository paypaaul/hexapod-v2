      - "Salda prima un pin ai due capi di ogni strip; controlla che le strip siano dritte e in battuta."
      - "Salda gli altri pin usati: A-2, I-2, A-12, E-12, F-12 e da L-12 a R-12."
      - "Togli l'ESP32."
    avvisi:
