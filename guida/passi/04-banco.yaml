  - id: "4.31"
    titolo: Fili dei regolatori e R3
    formato: grande
    immagine: false
    testo:
      - "Salda su VIN e GND del regolatore due fili 14 AWG da 0,5 m [S], rosso e nero."
      - "Salda su VOUT e GND due fili 14 AWG da 0,6 m [S], rosso e nero."
      - "Salda una R3 da 22 kΩ fra ENA e GND, dal lato dei pin, con i reofori corti."
      - "Lascia liberi ENB e PG."
      - "Controlla che le saldature siano lucide e che ingresso e uscita non si tocchino. Ripeti per il regolatore destro."
    avvisi:
      - {tipo: attenzione, testo: "Controlla la polarità prima di saldare: la protezione da inversione c'è sull'ingresso (BOM B1), ma non metterla alla prova."}
      - {tipo: importante, testo: "Con la R3 sul regolatore un filo dell'ENA staccato lascia il rail spento. ENB non si usa: tirato a VIN e unito a ENA con 10 kΩ (S-05, S-20)."}
      - {tipo: nota, testo: "La seconda R3 da 22 kΩ non è sicura nel set B10 (S-05) [C]. Con gli INA260 (X7) il filo rosso d'uscita passa dalla loro morsettiera, che potrebbe non prendere un 14 AWG (sezione 8) [C]."}
    attrezzi: [saldatore, spelafili, multimetro]
    fonti:
      - "docs/cablaggio.md 3.1 ('Ingresso dei regolatori', 'Rail servo')"
      - "guida/schemi/schemi.md 1.6 (P-13 → D2 → ENA; R3 su ogni regolatore) e 1.7 scelta 6"
      - "guida/problemi/schemi.yaml S-05, S-20"
      - "D-073 (14 AWG sulle uscite dei regolatori)"

  - id: "4.32"
    titolo: Prova dei regolatori
    formato: grande
    immagine: false
    testo:
      - "Collega l'ingresso del regolatore ai Wago, con F1 da 3 A; l'uscita resta libera."
      - "Collega con un coccodrillo il suo filo dell'ENA, quello dopo D2, al pin ENA."
      - "Collega il T-plug e misura l'uscita con l'ENA a riposo."
      - "Collega con un Dupont il pin 3V3 dell'ESP32, sulla sola USB, alla presa P-12 della basetta (GPIO42), e misura l'uscita."
      - "Stacca il T-plug. Ripeti per l'altro regolatore."
    tabella:
      intestazione: [ENA, Uscita attesa, Misurato]
      righe:
        - ["a riposo, R3 da 22 kΩ verso massa", "0 V: rail spento [C]", ""]
