# Sezione di prova della pipeline (F1): si sostituisce con i passi veri del pilota (F2). I testi servono solo a provare
# l'impaginazione: non sono ancora verificati.
sezione:
  id: prova
  numero: 99
  titolo: Prova della pipeline
  colore: "#ff6a13"
  ripeti: 6
  unita: una zampa
  ripeti_testo: "6× — una zampa alla volta"
  terna: zampa
  presenti_iniziali: [zampa/Tibia]
  obiettivo: Provare le pagine della guida con tre passi della tibia.
  prima: [Tibia stampata con gli inserti a caldo (sezione 3)., Servo provato e numerato (sezione 5).]
  tempo: circa 20 minuti la prima volta [S]
  stato_elettrico: nessuno, la zampa non e' collegata
  controllo:
    - Il cuscinetto gira libero e non sporge dalla culla.
    - Le quattro viti delle alette sono strette, il servo non ha gioco.
    - Il guscio e' a filo con la tibia su tutto il bordo.
  scheda: [Servo del ginocchio (numero), Viti delle alette strette, Guscio montato]
passi:
  - id: "99.01"
    titolo: Cuscinetto nella culla della tibia
    formato: mezzo
    nuovi: [zampa/Cuscinetto_ginocchio]
    esploso: {asse: [0, -1, 0], distanza: 30}
    vista: zampa_B
    testo:
      - Premi il cuscinetto nella sede del lato B fino in battuta.
      - Controlla che giri libero con un dito.
    avvisi:
      - {tipo: nota, testo: "Il forzamento si regola con il provino della culla (sezione 1)."}
  - id: "99.02"
    titolo: Servo del ginocchio nella culla
    formato: mezzo
    nuovi: [zampa/Servo_ginocchio]
    giunzioni: [alette_ginocchio_coda, alette_ginocchio_albero]
    esploso: {asse: [0, 1, 0], distanza: 50}
    testo:
      - Cala il servo nella culla con l'albero verso il cuscinetto.
      - Accosta le quattro viti delle alette.
      - Stringi prima il lato coda, poi il lato albero.
    avvisi:
      - {tipo: importante, testo: "Lato albero: fori pilota, la vite si fa il filetto. Non usare inserti (D-049)."}
    fonti: [D-049]
  - id: "99.03"
    titolo: Guscio della tibia
    nuovi: [zampa/Cover_Tibia]
    giunzioni: [guscio_tibia]
    esploso: {asse: [1, 0, 0], distanza: 35}
    vista: zampa_fronte
    testo:
      - Posa il guscio sulla tibia partendo dalla punta.
      - Stringi la vite M3 × 10 nell'inserto, senza forzare il PLA.
    avvisi:
      - {tipo: opzionale, x: X31, quando: solo_ora, testo: "Le luci della tibia vanno messe prima del guscio."}
      - {tipo: attenzione, testo: "La vite arriva a 0,03 mm dal fondo dell'inserto [C]: controllala sul provino."}
    fonti: [D-061, D-065]
  - id: "99.04"
    titolo: Prova di un passo solo testo con tabella
    immagine: false
    testo:
      - Misura e annota la tensione del rail con il multimetro.
      - Controlla che il valore sia nella tabella.
    tabella:
      intestazione: [Punto, Atteso, Misurato]
      righe:
        - [Rail servo, "6,0 V [V]", ""]
        - [Logica, "5,0 V [V]", ""]
    attrezzi: [multimetro]
