# Sezione 2, stampa e controllo dei pezzi (D-075, docs/piano-guida.md "Struttura della guida"). F3: bozza dell'estrattore.
# Fonte principale: cad/stl/README.md (orientamento, materiale, note di ogni STL), con D-056, D-063, D-064, D-065,
# D-066, D-067, D-068, D-070, D-071, D-073, D-074. Quantita': manifest (guida/dati/manifest.json) e BOM.
# I pezzi si mostrano con in_evidenza (nessuno si monta qui: la sezione non ha giunzioni). Le immagini sono nella terna
# del CAD con la vista dal lato che va sul piatto (etichetta PIATTO) o dal lato in vista (etichetta IN ALTO).
# Quello che le fonti non dicono e' marcato [C] e sta in guida/problemi/stampa.yaml.
sezione:
  id: stampa
  numero: 2
  titolo: Stampa e controllo dei pezzi
  colore: "#2b8a3e"
  terna: zampa
  obiettivo: >-
    Stampare ogni pezzo con l'orientamento, i supporti e il materiale giusti, e controllarlo prima di montarlo. La zampa
    si stampa 6 volte; il corpo una volta. Gli STL sono quelli aggiornati dopo i provini.
  prima:
    - "Provini fatti e valori riportati nel CAD, STL riesportati (sezione 1, passo 1.18)."
    - "PETG-CF nero, PLA bianco, PLA nero, TPU 95A arancio (E1, E2, E2b, E3)."
    - "Ugello temprato da 0,4, toolchanger a 4 testine per i supporti nell'altro materiale."
  tempo: "una stampa a pezzo; la zampa 6 volte [S]"
  stato_elettrico: "nessuno"
  fonti: [D-075, D-065, "cad/stl/README.md", "docs/piano-guida.md, sezione 2"]
  attrezzi: [calibro, tronchesino, pennarello]
  controllo:
    - "Ogni pezzo della tabella ha i suoi esemplari: la zampa ×6, il corpo una volta."
    - "I pezzi a due colori sono stati stampati in un pezzo solo."
    - "S e D segnati con il pennarello sui supporti degli INA260."
    - "Calibro passato sulle quote delle tabelle di controllo."
    - "Fori degli inserti aperti e puliti; nessun inserto messo qui."

passi:
  - id: "2.01"
    titolo: Prima di stampare
    formato: grande
    immagine: false
    testo:
      - "Usa l'ugello temprato da 0,4 per il PETG-CF."
      - "Imposta il PETG-CF con 3 perimetri (1,2 mm), 4–5 strati sopra e sotto, riempimento 25 % [V]."
      - "Carica solo gli STL riesportati dopo i provini."
      - "Conferma nello slicer ogni orientamento: quelli della guida sono proposte."
      - "Assegna a ogni oggetto il materiale della tabella."
    tabella:
      intestazione: ["Materiale", "Colore", "Voce BOM", "Per cosa"]
      righe:
        - ["PETG-CF", "nero", "E1", "tutte le parti funzionali: zampa, base, chiglia, slitte, sportello, supporti, piastrina IMU"]
        - ["PLA", "bianco", "E2", "placche: carapace, lame, guscio, diffusore, vassoio"]
        - ["PLA", "nero", "E2b", "fascia, visiera, gonne, intarsi, sportellini, tappo, fondo dell'anello, lunette"]
        - ["TPU 95A", "arancio", "E3", "piedini"]
    avvisi:
      - {tipo: nota, testo: "Stampa e supporti li decidi tu nello slicer. Il bianco è «per ora» e il PLA nero per le parti nere è una proposta non confermata (D-065, BOM domanda 7)."}
      - {tipo: nota, testo: "Pareti, strati e riempimento del PETG-CF sono quelli di cad/stl/README.md; per gli altri materiali l'unico valore dato è il piedino a 4 perimetri (D-064)."}
    fonti: ["cad/stl/README.md (premessa e ultima riga)", D-065, D-064, "docs/BOM.md E1, E2, E2b, E3 e domanda 7"]

  - id: "2.02"
    titolo: Quanti pezzi, la zampa
    formato: grande
    immagine: false
    testo:
      - "Stampa la zampa 6 volte: sei esemplari di ogni pezzo della tabella."
      - "Stampa i pezzi uguali nello stesso piatto, se ci stanno."
      - "Segna ogni esemplare con la sigla del pezzo."
    tabella:
      intestazione: ["Pezzo", "File", "Materiale", "Per zampa", "Per 6 zampe"]
      righe:
        - ["Coxa", "Coxa.stl", "PETG-CF", "1", "6"]
        - ["Ponte della coxa", "Coxa_Ponte.stl", "PETG-CF", "1", "6"]
        - ["Femore lato A", "Femore_A.stl", "PETG-CF", "1", "6"]
        - ["Femore lato B", "Femore_B.stl", "PETG-CF", "1", "6"]
        - ["Tibia", "Tibia.stl", "PETG-CF", "1", "6"]
        - ["Lama A con intarsio", "Cover_Femore_A.stl + _Feritoia.stl", "PLA bianco + nero", "1", "6"]
        - ["Lama B con intarsio", "Cover_Femore_B.stl + _Feritoia.stl", "PLA bianco + nero", "1", "6"]
        - ["Guscio della tibia", "Cover_Tibia.stl", "PLA bianco", "1", "6"]
        - ["Diffusore (solo X31)", "Cover_Tibia_Diffusore.stl", "PLA bianco o PETG fumé", "1", "6"]
        - ["Piedino", "Piedino.stl", "TPU 95A arancio", "1", "6 + 2 di scorta"]
    avvisi:
      - {tipo: nota, testo: "Le sei zampe sono la stessa zampa, ruotata: nessun pezzo è destro o sinistro (manifest, trasformate senza specchio) [V]."}
      - {tipo: nota, testo: "Piedini: 6 più 2 di scorta (BOM D9). Il diffusore si stampa solo se monti le luci nelle tibie (X31)."}
    fonti: ["cad/stl/README.md 'Zampa (sei di ognuna)'", "guida/dati/manifest.json (istanze: rotazioni)", "docs/BOM.md D9", "docs/predisposizioni.md X31"]

  - id: "2.03"
    titolo: Quanti pezzi, il corpo
    formato: grande
    immagine: false
    testo:
      - "Stampa ogni pezzo del corpo una volta, salvo dove la tabella dice altro."
      - "Salta i pezzi delle predisposizioni che non monti (colonna Voce)."
      - "Scegli lo sportellino: con o senza il computer a zaino."
    tabella:
      intestazione: ["Pezzo", "File", "Materiale", "Quanti", "Voce"]
      righe:
        - ["Base", "Corpo_Base.stl", "PETG-CF", "1", "E1"]
        - ["Chiglia", "Corpo_Chiglia.stl", "PETG-CF", "1", "E1"]
        - ["Sportello della batteria", "Corpo_Sportello.stl", "PETG-CF", "1", "E1"]
        - ["Slitta del regolatore", "Corpo_Slitta_Regolatore.stl", "PETG-CF", "2", "E1"]
        - ["Vassoio dell'ESP32", "Corpo_Vassoio.stl", "PLA bianco [S]", "1", "E2"]
        - ["Carapace + fascia + visiera + gonne", "4 file, un pezzo a due colori", "PLA bianco + nero", "1", "E2, E2b"]
        - ["Sportellino di servizio", "Corpo_Sportello_Servizio.stl", "PLA nero", "1", "E2b"]
        - ["Fondo dell'anello", "Corpo_Fondo_Anello.stl", "PLA nero", "1", "E2b"]
        - ["Tappo del ToF", "Corpo_Tappo_ToF.stl", "PLA nero", "1", "E2b"]
        - ["Piastrina dell'IMU", "Corpo_Piastrina_IMU.stl", "PETG-CF", "1", "X4"]
        - ["Lunette dei microfoni", "Corpo_Lunette_Microfoni.stl (4 lunette)", "PLA nero [S]", "1 file", "X16"]
        - ["Supporto INA260 sinistro e destro", "Corpo_Supporto_INA260_S.stl e _D.stl", "PETG-CF", "1 + 1", "X7"]
        - ["Sportellino con lo zaino", "Corpo_Sportello_Servizio_Zaino.stl", "PLA nero", "1, al posto dello sportellino", "zaino"]
    avvisi:
      - {tipo: nota, testo: "Slitte: la destra è la stessa della sinistra, ruotata di 180°: due copie dello stesso STL (manifest) [V]."}
    fonti: ["cad/stl/README.md 'Corpo'", "guida/dati/manifest.json (occorrenze e corpi per file)", "docs/BOM.md E1, E2, E2b, X4, X7, X16", D-074]

  - id: "2.04"
    titolo: Tibia
    formato: mezzo
    in_evidenza: [zampa/Tibia]
    mostra: []
    vista: {direzione: [0.5, -0.8, 0.45], su: [0, 0, 1]}
    evidenzia: [{chiave: zampa/Tibia, lav: "ponte_fili_*"}]
    etichette:
      - {testo: PIATTO, punto: [120, -24.15, -12]}
      - {testo: SUPPORTO, punto: [120, -22, -75]}
    testo:
      - "Posa la tibia con il fondo della culla sul piatto e l'apertura in alto."
      - "Metti un supporto a cuneo sotto lo stinco: si stacca dal piatto fino a circa 17 mm [V]."
      - "Lascia senza supporti i tre ponticelli della gola dei fili: crescono in piedi."
      - "Stampa in PETG-CF nero, 6 volte."
    avvisi:
      - {tipo: nota, testo: "È il pezzo del provino della culla (sezione 1): con il CAD invariato, quello è già una delle sei."}
    fonti: ["cad/stl/README.md 'Tibia.stl'", D-065, D-067]

  - id: "2.05"
    titolo: Coxa e ponte
    formato: mezzo
    in_evidenza: [zampa/Coxa, zampa/Coxa_Ponte]
    mostra: []
    esploso: {pezzi: {"zampa/Coxa_Ponte": [0, 0, 22]}}
    vista: {direzione: [0.4, 0.8, 0.8], su: [0, 0, 1]}
    evidenzia:
      - {chiave: zampa/Coxa, lav: foro_perno}
      - {chiave: zampa/Coxa_Ponte, lav: sede_disco}
    etichette:
      - {testo: PIATTO, punto: [50, 9.45, -10]}
      - {testo: PIATTO, punto: [16, 0, 45.5]}
    testo:
      - "Coxa: posa la faccia +Y (orlo della culla, braccio, anima) sul piatto."
      - "Ponte: posa la faccia superiore sul piatto, con la sede del disco in alto."
      - "Stampa in PETG-CF nero, 6 coxe e 6 ponti."
      - "Controlla che il foro del perno, orizzontale in stampa, sia aperto."
    avvisi:
      - {tipo: nota, testo: "La coxa si stampa senza supporti (docs/progetto-meccanico.md, tabella dell'architettura)."}
    fonti: ["cad/stl/README.md 'Coxa.stl' e 'Coxa_Ponte.stl'", "docs/progetto-meccanico.md 'Architettura'"]

  - id: "2.06"
    titolo: Femore lato B
    formato: mezzo
    in_evidenza: [zampa/Femore_B]
    mostra: []
    vista: {direzione: [0.4, -0.9, 0.5], su: [0, 0, 1]}
    evidenzia: [{chiave: zampa/Femore_B, lav: "ins_lama_*"}]
    etichette:
      - {testo: PIATTO, punto: [110, -30.55, 12]}
    testo:
      - "Posa la faccia esterna della piastra dei perni sul piatto: il blocco resta in piedi."
      - "Controlla i due fori per gli inserti M2 sulla faccia esterna, per la lama B."
      - "Stampa in PETG-CF nero, 6 volte."
    avvisi:
      - {tipo: nota, testo: "I due fori M2 partono dal piatto e salgono: nessun supporto [S]. Posizione X 81 e 89, Z 1,5 (D-071) [V]."}
    fonti: ["cad/stl/README.md 'Femore_B.stl'", D-071]

  - id: "2.07"
    titolo: Femore lato A
    formato: mezzo
    in_evidenza: [zampa/Femore_A]
    mostra: []
    vista: {direzione: [0.4, 0.9, 0.5], su: [0, 0, 1]}
    etichette:
      - {testo: PIATTO, punto: [110, 30.55, 12]}
    testo:
      - "Posa la faccia esterna sul piatto, con le sedi delle squadrette verso l'alto."
      - "Stampa in PETG-CF nero, 6 volte."
      - "Controlla i 12 fori passanti M3 e i 2 fori di accesso Ø6,0."
    avvisi:
      - {tipo: nota, testo: "La lama A si incastra sulle teste delle 12 viti di questo pezzo (D-070): dopo i provini, le sue tasche e i suoi fori non si cambiano."}
    fonti: ["cad/stl/README.md 'Femore_A.stl'", D-070]

  - id: "2.08"
    titolo: Lama A con l'intarsio
    formato: mezzo
    in_evidenza: [zampa/Cover_Femore_A, zampa/Cover_Femore_A_Feritoia]
    mostra: []
    vista: {direzione: [0.3, -1.0, 0.5], su: [0, 0, 1]}
    evidenzia:
      - {chiave: zampa/Cover_Femore_A, lav: "tasca_testa_*"}
      - {chiave: zampa/Cover_Femore_A, lav: "tasca_squadretta_*"}
    etichette:
      - {testo: PIATTO, punto: [88, 30.6, 3]}
    testo:
      - "Carica nello slicer la lama e il suo intarsio insieme: sono già allineati."
      - "Assegna PLA bianco alla lama e PLA nero all'intarsio."
      - "Posa la faccia interna, piana, sul piatto: faccia esterna e intarsio in alto."
      - "Stampa un pezzo solo, 6 volte."
    avvisi:
      - {tipo: nota, testo: "Lama spessa 4,0, intarsio profondo 0,6 [V]. Le 12 tasche delle teste sono fori ciechi che partono dal piatto (D-070)."}
      - {tipo: nota, testo: "L'intarsio copre le tasche delle due teste basse del blocco: fra tasca e intarsio restano 0,2 mm di bianco (D-070)."}
    fonti: ["cad/stl/README.md 'Cover_Femore_A.stl + Cover_Femore_A_Feritoia.stl'", D-070, D-071, D-072]

  - id: "2.09"
    titolo: Lama B con l'intarsio
    formato: mezzo
    in_evidenza: [zampa/Cover_Femore_B, zampa/Cover_Femore_B_Feritoia]
    mostra: []
    vista: {direzione: [0.3, 1.0, 0.5], su: [0, 0, 1]}
    evidenzia: [{chiave: zampa/Cover_Femore_B, lav: "tasca_perno_*"}]
    etichette:
      - {testo: PIATTO, punto: [88, -30.6, 3]}
    testo:
      - "Carica nello slicer la lama e il suo intarsio insieme: sono già allineati."
      - "Assegna PLA bianco alla lama e PLA nero all'intarsio."
      - "Posa la faccia interna, piana, sul piatto: faccia esterna e intarsio in alto."
      - "Stampa un pezzo solo, 6 volte."
    avvisi:
      - {tipo: nota, testo: "Lama spessa 2,6, intarsio profondo 1,0 [V]. Le due svasature delle viti M2 × 5 stanno tutte nell'intarsio nero (D-071, D-073)."}
      - {tipo: nota, testo: "Le tasche dei perni partono dal piatto, come quelle della lama A."}
    fonti: ["cad/stl/README.md 'Cover_Femore_B.stl + Cover_Femore_B_Feritoia.stl'", D-070, D-071, D-073]

  - id: "2.10"
    titolo: Guscio della tibia
    formato: mezzo
    in_evidenza: [zampa/Cover_Tibia]
    mostra: []
    vista: tibia_dietro
    etichette:
      - {testo: PIATTO, punto: [120, 0, -50]}
    testo:
      - "Posa il guscio con il retro aperto sul piatto e il fronte in alto."
      - "Metti supporti piccoli sotto i due tappi a rombo e sotto il bossolo della vite."
      - "Stampa in PLA bianco, 6 volte."
    avvisi:
      - {tipo: nota, testo: "Il fronte fa da ponte fra i due smussi: nessun supporto lì (cad/stl/README.md)."}
    fonti: ["cad/stl/README.md 'Cover_Tibia.stl'", D-061, D-065]

  - id: "2.11"
    titolo: Diffusore della tibia
    formato: mezzo
    in_evidenza: [zampa/Cover_Tibia_Diffusore]
    mostra: []
    vista: tibia_dietro
    etichette:
      - {testo: PIATTO, punto: [131.8, 0, -56]}
    testo:
      - "Posa la lastra sul piatto, con il bordino in alto."
      - "Stampa in PLA bianco, oppure in PETG traslucido fumé."
      - "Stampa 6 diffusori solo se monti le luci nelle tibie."
    avvisi:
      - {tipo: opzionale, x: X31, quando: anche_dopo, testo: "Senza luci salta questo pezzo: la finestra del guscio resta aperta. Bianco o fumé si decide con il provino di luce (sezione 1)."}
    fonti: ["cad/stl/README.md 'Cover_Tibia_Diffusore.stl'", D-066, D-069]

  - id: "2.12"
    titolo: Piedino in TPU
    formato: grande
    in_evidenza: [zampa/Piedino]
    mostra: []
    vista: {direzione: [0.4, 0.25, 1.0], su: [0, 0, 1]}
    evidenzia: [{chiave: zampa/Piedino, lav: tacca_fili}]
    etichette:
      - {testo: PIATTO, punto: [121.8, 0, -94.5]}
    testo:
      - "Posa il piedino con la bocca sul piatto e la punta in alto."
      - "Imposta 4 perimetri: parete e suola da 1,6 mm [V]."
      - "Stampa in TPU 95A arancio: 6 piedini più 2 di scorta."
      - "Usa lo STL con la stretta scelta nel provino 6."
    avvisi:
      - {tipo: nota, testo: "Dalla 2.1.0 la suola è piana, con il pistoncino per l'FSR e la tacca dei fili (D-066)."}
      - {tipo: importante, testo: "Nel CAD di oggi la stretta sullo stinco è zero: se il provino dà −0,2 o −0,4, lo STL va riesportato prima di stampare [C]."}
    fonti: ["cad/stl/README.md 'Piedino.stl'", D-064, D-066, "docs/BOM.md D9"]

  - id: "2.13"
    titolo: Base
    formato: grande
    terna: robot
    in_evidenza: [corpo/Corpo_Base]
    mostra: []
    vista: {direzione: [0.35, 0.75, 0.75], su: [0, 0, 1]}
    evidenzia:
      - {chiave: corpo/Corpo_Base, lav: "pilota_*"}
    etichette:
      - {testo: PIATTO, punto: [117.5, 0, -31.95]}
      - {testo: "TUNNEL (SOTTO)", punto: [-19.5, 0, -11.4]}
    testo:
      - "Posa la base con il fondo sul piatto."
      - "Metti supporti con interfaccia nell'altro materiale sotto il tetto del tunnel, solo nella parte interna."
      - "Metti supporti anche sotto le 12 bugne delle alette dei servo di coxa."
      - "Non usare un tetto a falde: fra pacco e tetto restano 2,6 mm."
      - "Stampa in PETG-CF nero."
    avvisi:
      - {tipo: nota, testo: "Il tetto del tunnel è un ponte di 50 mm lungo 162; le 12 bugne sono sbalzi piatti a 25,6 mm dal piatto (D-056)."}
      - {tipo: nota, testo: "Con il toolchanger i supporti vanno nell'altro materiale: lo decidi nello slicer. La base pesa circa 198 g (D-063)."}
    fonti: ["cad/stl/README.md 'Corpo_Base.stl'", D-056, D-063]

  - id: "2.14"
    titolo: Chiglia
    formato: mezzo
    terna: robot
    in_evidenza: [corpo/Corpo_Chiglia]
    vista: corpo_sotto
    etichette:
      - {testo: PIATTO, punto: [0, 0, -41.4]}
    testo:
      - "Posa la chiglia con il fondo sul piatto."
      - "Stampa in PETG-CF nero."
      - "Controlla i 4 fori M3 da 3,4: centrano la chiglia sulla base, ±0,2 mm."
    avvisi:
      - {tipo: nota, testo: "Nessun labbro di centraggio: la centrano le quattro viti (D-056)."}
    fonti: ["cad/stl/README.md 'Corpo_Chiglia.stl'", D-056]

  - id: "2.15"
    titolo: Sportello della batteria
    formato: mezzo
    terna: robot
    in_evidenza: [corpo/Corpo_Sportello]
    mostra: []
    vista: corpo_coda
    evidenzia:
      - {chiave: corpo/Corpo_Sportello, lav: "rebbio_*"}
    etichette:
      - {testo: PIATTO, punto: [-87.4, 0, -25]}
    testo:
      - "Posa lo sportello con la faccia esterna, smussata, sul piatto."
      - "Stampa in PETG-CF nero."
      - "Controlla i 2 fori passanti M3."
    avvisi:
      - {tipo: nota, testo: "Regge il pacco con due rebbi e la schiuma: per questo è in PETG-CF e non in PLA (D-065)."}
    fonti: ["cad/stl/README.md 'Corpo_Sportello.stl'", D-065, D-054]

  - id: "2.16"
    titolo: Slitte dei regolatori
    formato: mezzo
    terna: robot
    in_evidenza: [corpo/Corpo_Slitta_Regolatore_S, corpo/Corpo_Slitta_Regolatore_D]
    mostra: []
    vista: corpo_alto
    evidenzia:
      - {chiave: "corpo/Corpo_Slitta_Regolatore_*", lav: "ins_*"}
    testo:
      - "Stampa due copie dello stesso STL, in PETG-CF nero."
      - "Non specchiare nessuna copia: la destra è la sinistra ruotata di 180°."
      - "Posa la faccia piana, senza bugne, sul piatto: le bugne dei 4 inserti M2 in alto [C]."
      - "Controlla i 4 inserti M2 e il foro passante M3."
    avvisi:
      - {tipo: importante, testo: "L'orientamento sul piatto non è dato dalle fonti: quello della guida è una proposta [C]."}
    fonti: ["cad/stl/README.md 'Corpo_Slitta_Regolatore.stl' (due copie)", "guida/dati/manifest.json: slitta D = rotazione di 180° attorno a Z", D-051]

  - id: "2.17"
    titolo: Supporti degli INA260
    formato: mezzo
    terna: robot
    in_evidenza: [corpo/Corpo_Supporto_INA260_S, corpo/Corpo_Supporto_INA260_D]
    mostra: []
    vista: corpo_alto
    etichette:
      - {testo: S, chiave: corpo/Corpo_Supporto_INA260_S}
      - {testo: D, chiave: corpo/Corpo_Supporto_INA260_D}
    testo:
      - "Stampa un supporto S e un supporto D, in PETG-CF nero."
      - "Posa la piastra sul piatto."
      - "Segna S o D sul pezzo appena stampato, con il pennarello."
    avvisi:
      - {tipo: importante, testo: "Il D è l'S specchiato: non si scambiano. S è il lato sinistro (+Y), D il destro (−Y) [V]."}
      - {tipo: opzionale, x: X7, testo: "Solo con gli INA260. Si appoggiano alla slitta e prendono la sua vite, una M3 più lunga di 2,4 mm [V]."}
    fonti: ["cad/stl/README.md 'Corpo_Supporto_INA260_S/D.stl'", "guida/dati/manifest.json (bbox: S a Y +40…+48, D a −48…−40; D = S specchiato)", D-069]

  - id: "2.18"
    titolo: Vassoio dell'ESP32
    formato: mezzo
    terna: robot
    in_evidenza: [corpo/Corpo_Vassoio]
    mostra: []
    vista: corpo_sotto
    etichette:
      - {testo: PIATTO, punto: [60, 0, 1]}
    testo:
      - "Posa il vassoio con il piano sul piatto."
      - "Stampa in PLA bianco: sta sotto l'antenna, niente carbonio."
      - "Controlla i 4 inserti M2 e i 4 fori passanti M3."
    avvisi:
      - {tipo: importante, testo: "docs/progetto-meccanico.md lo dà in PETG; BOM E2, D-065 e README lo danno in PLA [C]."}
    fonti: ["cad/stl/README.md 'Corpo_Vassoio.stl'", D-065, "docs/BOM.md E2"]

  - id: "2.19"
    titolo: Fondo dell'anello
    formato: mezzo
    terna: robot
    in_evidenza: [corpo/Corpo_Fondo_Anello]
    mostra: []
    vista: corpo_alto
    evidenzia: [{chiave: corpo/Corpo_Fondo_Anello, lav: "sede_pixel_*"}]
    etichette:
      - {testo: PIATTO, punto: [-23, 0, 27.2]}
    testo:
      - "Posa il disco sul piatto: gonna e sedi dei pixel in alto."
      - "Stampa in PLA nero."
      - "Controlla che la gonna calzi la parete della camera con un forzamento leggero."
    avvisi:
      - {tipo: nota, testo: "Ogni sede porta un pezzo di striscia da 2 pixel: l'anello ne ha 4 (D-068). Il README scrive «un pixel»: è precedente a D-068."}
      - {tipo: nota, testo: "Il gioco della gonna è 0,05 mm per lato, da tarare (D-067)."}
    fonti: ["cad/stl/README.md 'Corpo_Fondo_Anello.stl'", D-067, D-068]

  - id: "2.20"
    titolo: Pezzi piccoli del corpo
    formato: grande
    terna: robot
    in_evidenza: [corpo/Corpo_Sportello_Servizio, corpo/Corpo_Tappo_ToF, corpo/Corpo_Piastrina_IMU, corpo/Corpo_Lunette_Microfoni]
    mostra: []
    vista: {direzione: [0.5, 0.5, 0.75], su: [0, 0, 1]}
    etichette:
      - {testo: SPORTELLINO, chiave: corpo/Corpo_Sportello_Servizio}
      - {testo: "TAPPO ToF", chiave: corpo/Corpo_Tappo_ToF}
      - {testo: "PIASTRINA IMU", chiave: corpo/Corpo_Piastrina_IMU}
      - {testo: LUNETTE, chiave: corpo/Corpo_Lunette_Microfoni}
    testo:
      - "Stampa solo i pezzi di cui monti la predisposizione."
      - "Posa ogni pezzo come dice la tabella."
      - "Scegli lo sportellino: normale, oppure con la tacca per l'USB-C se hai il computer a zaino."
    tabella:
      intestazione: ["Pezzo", "Materiale", "Orientamento", "Note"]
      righe:
        - ["Sportellino di servizio", "PLA nero", "faccia in vista sul piatto", "resta su per attrito con 4 nervature da 1 mm (D-056)"]
        - ["Sportellino con lo zaino", "PLA nero", "come lo sportellino", "al posto dell'altro; tacca per l'USB-C"]
        - ["Tappo del ToF", "PLA nero", "flangia sul piatto", "chiude la finestra finché il sensore manca"]
        - ["Piastrina dell'IMU (X4)", "PETG-CF", "faccia inferiore sul piatto, svasature in alto", "due M2 × 5 svasate a filo; scheda su due M2 × 6 nei fori pilota Ø1,7 (D-074)"]
        - ["Lunette dei microfoni (X16)", "PLA nero [S]", "piatte sul piatto", "4 lunette in un file, simmetriche; con la Adafruit 3421 si tolgono"]
    avvisi:
      - {tipo: nota, testo: "Le nervature dello sportellino sono a filo nel modello: stampate vengono più strette di 0,1–0,2 mm e fanno l'attrito (D-056)."}
    fonti: ["cad/stl/README.md 'Corpo'", D-056, D-074, "guida/dati/manifest.json (colore PLA nero delle lunette)"]

  - id: "2.21"
    titolo: Carapace a due colori
    formato: grande
    terna: robot
    in_evidenza: [corpo/Corpo_Carapace, corpo/Corpo_Fascia, corpo/Corpo_Visiera, corpo/Corpo_Gonne]
    mostra: []
    vista: {direzione: [0.5, 0.5, 0.75], su: [0, 0, 1]}
    etichette:
      - {testo: "PIATTO (capovolto)", punto: [0, 0, 36]}
    testo:
      - "Carica nello slicer i quattro file insieme: carapace, fascia, visiera, gonne. Sono già allineati."
      - "Assegna PLA bianco al carapace e PLA nero a fascia, visiera e gonne."
      - "Capovolgi il pezzo: la faccia a z 36 sul piatto."
      - "Stampa senza supporti, un solo pezzo."
    avvisi:
      - {tipo: nota, testo: "Fascia (3 corpi) e gonne (4 corpi) restano a pezzi nello slicer: tutti nel nero [V]. L'intarsio della fascia è profondo 0,6 mm: PLA su PLA si attacca senza interlocking (D-065)."}
      - {tipo: attenzione, testo: "Il PLA del carapace rammollisce verso 55–60 °C e sotto ci sono i regolatori. Se a robot montato l'interno scalda, il carapace si ristampa in PETG (D-065)."}
    fonti: ["cad/stl/README.md 'Corpo_Carapace.stl + …'", D-063, D-065, D-074]

  - id: "2.22"
    titolo: Destri e sinistri
    formato: grande
    immagine: false
    testo:
      - "Segna con il pennarello S o D sui supporti degli INA260, appena stampati."
      - "Non segnare le slitte: sono uguali."
      - "Distingui le lame A e B dallo spessore: 4,0 e 2,6 mm [V]."
    tabella:
      intestazione: ["Pezzo", "Lato", "Come si riconosce"]
      righe:
        - ["Supporto INA260 S", "sinistro, Y positivo", "Corpo_Supporto_INA260_S.stl; è lo specchio del D"]
        - ["Supporto INA260 D", "destro, Y negativo", "Corpo_Supporto_INA260_D.stl"]
        - ["Slitta del regolatore ×2", "nessuno", "stesso STL; la destra è la sinistra ruotata di 180°"]
        - ["Pezzi della zampa ×6", "nessuno", "ogni zampa è la stessa, ruotata: nessuno specchio"]
        - ["Lama A / lama B", "lato A (+Y) / lato B (−Y) della zampa", "A: 4,0 mm con 12 tasche. B: 2,6 mm con 2 fori M2"]
        - ["Lunette dei microfoni ×4", "nessuno", "simmetriche"]
    avvisi:
      - {tipo: nota, testo: "S e D vengono dal CAD: S sul lato +Y, D sul lato −Y del robot (manifest). Le zampe sono AS, AD, MS, MD, PS, PD con la stessa convenzione."}
    fonti: ["cad/stl/README.md", "guida/dati/manifest.json (determinanti delle trasformate di slitte, INA260 e zampe)", D-074]

  - id: "2.23"
    titolo: Controlli, la zampa
    formato: grande
    in_evidenza: [zampa/Coxa, zampa/Coxa_Ponte, zampa/Femore_A, zampa/Femore_B, zampa/Tibia, zampa/Cover_Femore_A, zampa/Cover_Femore_B, zampa/Piedino]
    mostra: []
    esploso:
      pezzi:
        "zampa/Coxa_Ponte": [0, 0, 30]
        "zampa/Femore_A": [0, 45, 0]
        "zampa/Femore_B": [0, -45, 0]
        "zampa/Cover_Femore_A": [0, 85, 0]
        "zampa/Cover_Femore_B": [0, -85, 0]
        "zampa/Tibia": [60, 0, 0]
        "zampa/Piedino": [60, 0, -45]
    vista: zampa_A
    evidenzia:
      - {chiave: zampa/Tibia, lav: sede_servo}
      - {chiave: zampa/Tibia, lav: sede_cuscinetto}
      - {chiave: zampa/Tibia, lav: "pilota_corto_*"}
      - {chiave: zampa/Tibia, lav: "ins_*"}
      - {chiave: zampa/Coxa, lav: foro_perno}
      - {chiave: zampa/Coxa, lav: "pilota_corto_*"}
      - {chiave: zampa/Coxa, lav: "ins_*"}
      - {chiave: zampa/Coxa_Ponte, lav: "foro_testa_*"}
      - {chiave: zampa/Coxa_Ponte, lav: sede_disco}
      - {chiave: zampa/Femore_B, lav: "foro_perno_*"}
      - {chiave: zampa/Femore_B, lav: "ins_blocco_*"}
      - {chiave: zampa/Cover_Femore_A, lav: "tasca_testa_*"}
    testo:
      - "Misura e annota con il calibro le quote della tabella, su un pezzo per tipo."
      - "Confronta con il CAD: i fori stampati vengono più stretti di 0,1–0,2 mm [S]."
      - "Se un foro è fuori di più, ristampa il pezzo."
    tabella:
      intestazione: ["Pezzo", "Quota", "CAD", "Misurato"]
      righe:
        - ["Tibia", "sede del servo, lung. × largh.", "41,4 × 20,9 [V]", ""]
        - ["Tibia", "sede del cuscinetto Ø", "10,0 [V]", ""]
        - ["Tibia, coxa", "foro pilota Ø", "2,5 [V]", ""]
        - ["Tibia, coxa, femore B", "inserti M3, Ø × prof.", "4,2 × 6,7 [V]", ""]
        - ["Coxa, femore B", "foro del perno Ø", "5,0 [V]", ""]
        - ["Ponte", "fori teste Ø; sede disco Ø", "5,6; 20,4 [V]", ""]
        - ["Femore A", "fori passanti M3 Ø", "3,4 [V]", ""]
        - ["Lama A", "spessore; intarsio; tasche Ø", "4,0; 0,6; 5,6 [V]", ""]
        - ["Lama B", "spessore; intarsio", "2,6; 1,0 [V]", ""]
        - ["Piedino", "parete e suola", "1,6 [V]", ""]
    avvisi:
      - {tipo: nota, testo: "I valori dei provini (sezione 1) valgono al posto di quelli del CAD, se sono cambiati."}
      - {tipo: nota, testo: "Nessuna fonte dà una tolleranza oltre ai 0,1–0,2 mm di restringimento: la fissi tu dopo i provini [C]."}
    attrezzi: [calibro]
    fonti: ["cad/script/zampa.py PARAMETRI", D-049, D-056, D-064, D-070, "guida/dati/fori.json"]

  - id: "2.24"
    titolo: Controlli, il corpo
    formato: grande
    terna: robot
    in_evidenza: [corpo/Corpo_Base]
    mostra: []
    vista: {direzione: [0.35, 0.75, 0.75], su: [0, 0, 1]}
    evidenzia:
      - {chiave: corpo/Corpo_Base, lav: "ins_*"}
      - {chiave: corpo/Corpo_Base, lav: "*_ins"}
      - {chiave: corpo/Corpo_Base, lav: "pilota_*"}
      - {chiave: corpo/Corpo_Base, lav: "foro_spia_*"}
      - {chiave: corpo/Corpo_Base, lav: "chi_ins_*"}
    testo:
      - "Misura e annota con il calibro le quote della tabella."
      - "Prova ogni sede di un pezzo su quello che ci va, a secco."
      - "Se un foro è fuori di più di 0,2 mm, ristampa il pezzo."
    tabella:
      intestazione: ["Pezzo", "Quota", "CAD", "Misurato"]
      righe:
        - ["Base", "inserti M3; M2; fori pilota", "Ø4,2; 3,4; 2,5 [V]", ""]
        - ["Base", "fori delle spie dei rail", "Ø3,1 [V]", ""]
        - ["Chiglia", "fori passanti M3", "3,4, ±0,2 [V]", ""]
        - ["Sportello", "fori passanti M3", "3,4 [V]", ""]
        - ["Slitte, vassoio", "inserti M2; fori passanti M3", "Ø3,4; 3,4 [V]", ""]
        - ["Fondo dell'anello", "gioco della gonna sulla camera", "0,05 per lato [V]", ""]
        - ["Fascia, camera nera", "diametro × altezza", "Ø32 × 6 [V]", ""]
        - ["Sportellino", "nervature", "1 mm, a filo [V]", ""]
    avvisi:
      - {tipo: nota, testo: "I valori degli inserti dei provini valgono al posto di quelli del CAD di oggi, se sono cambiati."}
    attrezzi: [calibro]
    fonti: [D-056, D-067, D-051, "cad/script/corpo.py PARAMETRI", "guida/dati/fori.json"]

  - id: "2.25"
    titolo: Fori per gli inserti
    formato: grande
    immagine: false
    testo:
      - "Controlla che ogni foro per inserto sia aperto e pulito, con la tabella davanti."
      - "Non mettere gli inserti adesso: si mettono nella sezione 3, pezzo per pezzo."
      - "Non mettere mai un inserto nei fori pilota Ø2,5."
    tabella:
      intestazione: ["Pezzo", "Inserti M3", "Inserti M2", "Fori pilota", "Nel robot"]
      righe:
        - ["Coxa", "4 (2 coda, 2 ponte)", "—", "2", "6 coxe: 24 M3, 12 pilota"]
        - ["Tibia", "3 (2 coda, 1 guscio)", "—", "2", "6 tibie: 18 M3, 12 pilota"]
        - ["Femore B", "4 (blocco)", "2 (lama B)", "—", "6 femori: 24 M3, 12 M2"]
        - ["Base", "26", "8 (4 SSC-32, 2 IMU, 2 ADC)", "12", "26 M3, 4 M2 senza X4 e X6"]
        - ["Chiglia", "2", "—", "—", "2 M3"]
        - ["Slitta ×2", "—", "4 + 4", "—", "8 M2"]
        - ["Vassoio", "—", "4", "—", "4 M2"]
        - ["Supporti INA260 (X7)", "—", "2 + 2", "—", "predisposizione"]
        - ["Carapace", "—", "10 (X2, X17, zaino)", "—", "predisposizioni"]
    avvisi:
      - {tipo: nota, testo: "Totale senza predisposizioni: 94 inserti M3 e 28 M2, come il BOM (D-065, D-073): i conti vengono dai fori del CAD (guida/dati/fori.json) [V]."}
      - {tipo: importante, testo: "Il BOM elenca i 94 M3 come «30 nel corpo, 24, 18, 24» = 96: nel corpo sono 28 (26 base + 2 chiglia) [V]."}
    fonti: [D-065, D-073, D-049, "docs/BOM.md (riga 'Inserti a caldo')", "guida/dati/fori.json", "docs/piano-guida.md sezione 3"]

  - id: "2.26"
    titolo: Attrezzi da banco
    formato: grande
    in_evidenza: [attrezzo/Dima_Posa_1, zampa/Coxa, zampa/Femore_B, zampa/Perno_femore, zampa/Perno_ginocchio, zampa/Tibia]
    mostra: []
    vista: zampa_B
    testo:
      - "Stampa le due dime e il cavalletto: servono alla taratura (sezione 12)."
      - "Posa le dime con la piastra sul piatto e i denti in alto, il cavalletto con la base sul piatto."
      - "Stampa le dime in PLA o PETG, il cavalletto in PETG-CF."
      - "Controlla che i fori delle dime calzino i perni del femore con 0,15 mm di gioco per lato."
    tabella:
      intestazione: ["Attrezzo", "File", "Materiale"]
      righe:
        - ["Dima di posa 1 (imbardata 0, femore 0, ginocchio 90)", "Dima_Posa_1.stl", "PLA o PETG"]
        - ["Dima di posa 2 (30, 45, 135)", "Dima_Posa_2.stl", "PLA o PETG"]
        - ["Cavalletto, alto 137 mm", "Attrezzo_Cavalletto.stl", "PETG-CF"]
    avvisi:
      - {tipo: nota, testo: "Le dime si infilano sui perni del femore dal lato B, con la lama B tolta (sezione 12). Gli STL stanno in cad/stl/attrezzi/."}
    attrezzi: [calibro]
    fonti: ["cad/stl/README.md 'Attrezzi da banco'", D-066, "cad/script/attrezzi.py (att_gio_perno 0,15)"]

  - id: "2.27"
    titolo: Dima di posa 2
    formato: grande
    in_evidenza: [attrezzo/Dima_Posa_2, zampa/Femore_B, zampa/Perno_femore, zampa/Perno_ginocchio]
    mostra: []
    vista: zampa_B
    posa: {alfa: 45, gamma: 135, coxa: 30}
    testo:
      - "Stampa la dima di posa 2 in PLA o PETG, con la piastra sul piatto e i denti in alto."
      - "Controlla che i fori calzino i perni del femore con 0,15 mm di gioco per lato."
    avvisi:
      - {tipo: nota, testo: "La dima 2 fissa imbardata 30, femore 45 e ginocchio 135 (sezione 12)."}
      - {tipo: nota, testo: "Le dime si infilano sui perni del femore dal lato B, con la lama B tolta (sezione 12)."}
    attrezzi: [calibro]
    fonti: ["cad/stl/README.md 'Attrezzi da banco'", D-066, "cad/script/attrezzi.py (att_gio_perno 0,15)"]

  - id: "2.28"
    titolo: Cavalletto
    formato: grande
    terna: robot
    in_evidenza: [attrezzo/Cavalletto, corpo/Corpo_Chiglia, corpo/Corpo_Base]
    mostra: []
    vista: {direzione: [0.55, 0.5, 0.45], su: [0, 0, 1]}
    etichette:
      - {testo: PIATTO, punto: [80, 0, -170]}
    testo:
      - "Posa il cavalletto con la base sul piatto."
      - "Stampa in PETG-CF."
      - "Controlla con il calibro che sia alto 137 mm."
    avvisi:
      - {tipo: nota, testo: "Il cavalletto serve alla taratura (sezione 12). Nell'immagine regge la base e la chiglia del robot."}
    attrezzi: [calibro]
    fonti: ["cad/stl/README.md 'Attrezzi da banco'", D-066]
