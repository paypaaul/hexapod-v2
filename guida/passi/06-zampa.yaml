# Sezione 6, la zampa pilota (D-075, docs/piano-guida.md "Struttura della guida"). F2: la tibia (6.01-6.08), approvata
# dall'utente. F3: coxa (6.09-6.12), Femore_B e perni (6.13-6.15), calettamento (6.16-6.17), Femore_A con le rondelle di
# registro (6.18-6.19), alette strette per ultime (6.20-6.21), guscio e diffusore (6.22-6.23, prima in `rinviati`), cavi
# (6.24-6.25), lama A con l'intarsio (6.26). Lama B, ponte, squadretta e perno della coxa: sezioni 9 e 12.
# Le immagini sono nella posa come costruita (femore 0, ginocchio 90), salvo i passi con `posa` (F3c): calettamento
# (6.16-6.19, alfa 20, gamma 100), alette (6.20-6.21, alfa -25, gamma 60), prova dei cavi (6.25, alfa 20, gamma 45: 8
# gradi sopra il minimo di 37 della tabella di progetto-meccanico.md). Accessi, inserimento di Femore_B e angoli delle alette: raggi sulle mesh di build/guida/cad/mesh
# con le trasformate del manifest, femore ruotato attorno all'anca (X 55, Z 0) e tibia attorno al ginocchio (X 120, Z 0);
# i numeri e i casi di controllo sono in guida/problemi/zampa.yaml.
# Inserti a caldo: si mettono tutti nella sezione 3 (pezzo per pezzo, prima di qualsiasi montaggio); qui si controllano
# sul pezzo appena preso (6.01 tibia, 6.09 coxa, 6.13 Femore_B).
sezione:
  id: zampa
  numero: 6
  titolo: La zampa
  colore: "#ff6a13"
  terna: zampa
  ripeti: 6
  unita: una zampa
  ripeti_testo: "6× — una zampa alla volta, tutte e sei prima della sezione 7"
  obiettivo: >-
    Montare una zampa completa, senza il ponte della coxa: tibia, coxa, femore con le squadrette calettate, guscio, cavi
    e lama A. Sei volte uguale, una zampa alla volta; le differenze vanno nella scheda in fondo alla sezione.
  prima:
    - "Provini fatti, valori nel CAD (sezione 1); pezzi stampati e controllati (sezione 2)."
    - "Inserti messi (sezione 3): tibia 3 M3, coxa 4 M3, femore B 4 M3 e 2 M2."
    - "Servo numerati, a metà corsa, con le alette nude (gommini e tubetti non si montano); banco dei servo pronto (sezione 5)."
    - "Deciso se montare FSR (X5) e luci (X31): vanno nella tibia."
  tempo: "circa 2 ore la prima volta; 15 minuti in più con FSR e luci [S]"
  stato_elettrico: "Banco dei servo (sezione 5) solo in 6.16, 6.20, 6.21 e 6.25, un servo alla volta."
  fonti: [D-075, docs/piano-guida.md "Struttura della guida"]
  controllo:
    - "I due cuscinetti girano liberi, con la flangia sulla faccia della culla."
    - "I due servo stanno in culla con il passacavo nella fessura; le spine escono dalle testate."
    - "Con l'FSR: il doppino esce dalla tacca del piedino. Con le luci: striscia incollata, freccia verso il piede. I fili passano sotto i tre ponticelli."
    - "I perni sporgono 1,4 mm da Femore B; coxa e tibia girano sui perni."
    - "A metà corsa il femore sta a circa +20° e il ginocchio a circa 100°."
    - "Strette: 8 viti delle squadrette, 4 del blocco con le rondelle, 8 delle alette."
    - "Guscio con la vite stretta piano; con le luci, diffusore nella finestra."
    - "Cavo del ginocchio nella fascetta del blocco; i cavi oltre la coxa sono liberi. Lama A in battuta sulle teste."
  scheda:
    - "Servo del femore e del ginocchio (numeri)"
    - "Cuscinetti, perni a 1,4 mm, Femore B"
    - "Squadrette calettate, posa a metà corsa"
    - "Rondelle di registro (quante per vite)"
    - "Viti strette: squadrette, blocco, alette"
    - "FSR (X5) e luci (X31)"
    - "Piedino, guscio e diffusore"
    - "Fascetta del blocco e lama A"
  vista_finale: zampa_A

passi:
  - id: "6.01"
    titolo: Tibia
    formato: mezzo
    nuovi: [zampa/Tibia]
    vista: zampa_A
    evidenzia:
      - {chiave: zampa/Tibia, lav: "ins_*"}
      - {chiave: zampa/Tibia, lav: fessura_cavo}
      - {chiave: zampa/Tibia, lav: finestra_cavo}
      - {chiave: zampa/Tibia, lav: "ponte_fili_*"}
    testo:
      - "Controlla i tre inserti M3 a filo: due nelle bugne lato coda, uno sul fronte dello stinco."
      - "Controlla che fessura e finestra del cavo nella testata siano pulite."
      - "Togli le bave di stampa da fessura e finestra."
      - "Controlla che i tre ponticelli sul fronte della culla siano interi."
    avvisi:
      - {tipo: nota, testo: "Sedi e fori hanno le misure del provino della culla (sezione 1)."}
    attrezzi: [tronchesino]
    fonti: [D-049, D-067, cad/stl/README.md "Provino della culla", "docs/BOM.md, inserti a caldo: 18 nelle tibie"]

  - id: "6.02"
    titolo: Cuscinetto del ginocchio
    formato: mezzo
    nuovi: [zampa/Cuscinetto_ginocchio]
    esploso: {asse: [0, -1, 0], distanza: 30}
    vista: zampa_B
    evidenzia: [{chiave: zampa/Tibia, lav: sede_cuscinetto}]
    testo:
      - "Premi il cuscinetto nella sede dal lato B, prima del servo, flangia verso fuori."
      - "Premi fino a quando la flangia appoggia sulla faccia della tibia."
      - "Controlla che l'anello interno giri libero con un dito."
    avvisi:
      - {tipo: attenzione, testo: "Spingi solo sulla flangia: col pollice, o con un tubetto Ø 8–11,5 e dal lato A un distanziale ≥ 45 mm attorno al foro da 7,2 [C]."}
    fonti: ["D-049: foro dietro la sede da 7,2", docs/progetto-meccanico.md "Architettura", cad/script/zampa.py _sede, cad/stl/README.md "Provino della culla"]

  # Gommini e tubetti di ottone non si montano (5.02, D-076): qui resta un controllo (correzione della F3).
  - id: "6.03"
    titolo: Servo del ginocchio nella culla
    formato: mezzo
    nuovi: [zampa/Servo_ginocchio]
    esploso: {asse: [0, 1, 0], distanza: 45}
    vista: zampa_A
    evidenzia: [{chiave: zampa/Tibia, lav: fessura_cavo}, {chiave: zampa/Tibia, lav: finestra_cavo}]
    testo:
      - "Controlla che le alette siano nude: niente gommini né tubetti di ottone (sezione 5)."
      - "Annota il numero del servo nella scheda della zampa."
      - "Infila la spina del cavo nella finestra della testata, da dentro la culla."
      - "Infila il servo nella culla dal lato A, coda verso il piede e passacavo nella fessura."
    fonti: ["D-047: servo del ginocchio nella tibia, coda verso il piede", D-049, cad/stl/README.md "Provino della culla" punto 1, docs/dimensioni-componenti.md "MG996R" (gommini)]

  - id: "6.04"
    titolo: Viti delle alette, accostate
    formato: mezzo
    giunzioni: [alette_ginocchio_coda, alette_ginocchio_albero]
    vista: zampa_A
    testo:
      - "Accosta le due viti M3 × 8 lato coda, negli inserti."
      - "Accosta le due viti M3 × 8 lato albero, nei fori pilota."
    avvisi:
      - {tipo: importante, testo: "Non stringere: si stringono per ultime, a femore montato (D-049)."}
      - {tipo: nota, testo: "Nei fori pilota Ø2,5 la vite si fa il filetto: niente inserti da quel lato (D-049)."}
    fonti: [D-049, docs/progetto-meccanico.md "Modello in Fusion (zampa v0)", guida/catalogo/giunzioni.yaml]

  - id: "6.05"
    titolo: Striscia delle luci
    formato: grande
    mostra: [zampa/Tibia, zampa/Servo_ginocchio]
    vista: zampa_fronte
    evidenzia: [{chiave: zampa/Tibia, lav: sede_luce}]
    etichette:
      - {testo: "capo dei fili", punto: [132, 0, -35]}
      - {testo: "verso il piede", punto: [132, 0, -78]}
    testo:
      - "Taglia 6 pixel di striscia sulle linee di taglio: 50 mm [S]."
      - "Salda 3 fili 30 AWG al capo d'ingresso: massa, +5 V e dato."
      - "Incolla la striscia nella sede piana del fronte con il suo adesivo [C], LED verso fuori."
      - "Controlla che il capo dei fili stia in alto, contro la culla."
      - "Controlla che la freccia della striscia punti verso il piede."
    avvisi:
      - {tipo: opzionale, x: X31, quando: meglio_ora, testo: "Dopo costa togliere guscio e fascette della zampa. Senza luci salta questo passo."}
      - {tipo: nota, testo: "La sede è lunga 47,5 mm [V], la striscia 50: il capo basso ne esce di 2,5 mm."}
      - {tipo: nota, testo: "Colori proposti: nero massa, rosso +5 V, il terzo dato [S]. Solo 30 AWG: sotto i ponticelli restano 1,1 mm (D-067, D-073)."}
    extra:
      - {nome: "striscia WS2812B-2020 a 120 LED/m, 6 pixel", qta: 1, bom: X9}
      - {nome: "fili siliconici 30 AWG, 3 colori, da 0,4–0,5 m", qta: 3, bom: X31}
    attrezzi: [saldatore, spelafili, tronchesino]
    fonti: ["D-066, blocco A: luci nelle tibie", "D-068: 6 pixel, 50 mm", D-069, docs/cablaggio.md 3.3, docs/predisposizioni.md X9 e X31, cad/script/zampa.py sede_luce]

  - id: "6.06"
    titolo: Sensore del piede
    formato: grande
    nuovi: [zampa/FSR_piede]
    esploso: {asse: [0, 0, -1], distanza: 22}
    vista: tibia_capovolta
    evidenzia: [{chiave: zampa/Tibia, lav: tasca_fsr}, {chiave: zampa/Tibia, lav: "gola_fsr_*"}]
    etichette:
      - {testo: tasca, punto: [127, 0, -101]}
      - {testo: "gola dello stinco", punto: [127, 0, -60]}
    nascondi: [zampa/Cuscinetto_ginocchio]
    testo:
      - "Salda il doppino 28 AWG, rosso e nero, alle due linguette dell'FSR."
      - "Ruota la tibia con la punta in alto."
      - "Posa la testa dell'FSR al centro della punta piana."
      - "Piega la coda sullo spigolo arrotondato del fronte."
      - "Posa linguette e saldature nella tasca sul fronte."
      - "Infila il doppino nella gola dello stinco, fino alla coda della culla."
    avvisi:
      - {tipo: opzionale, x: X5, quando: meglio_ora, testo: "Dopo costa togliere piedino, guscio e fascette della zampa. Senza FSR salta questo passo."}
      - {tipo: attenzione, testo: "Salda in pochi secondi con la punta a bassa temperatura: le linguette dell'FSR non reggono il calore a lungo [C]."}
      - {tipo: nota, testo: "Solo 28 AWG: il 26 AWG non passa sotto i ponticelli (D-073). Lascia libero l'altro capo, lungo 0,4–0,5 m [S]: la spina si fa sul corpo."}
    extra: [{nome: "doppino 28 AWG siliconico rosso e nero, da 0,4–0,5 m", qta: 1, bom: X5}]
    attrezzi: [saldatore, spelafili]
    fonti: ["D-066, blocco A", D-073, docs/cablaggio.md 3.3, docs/predisposizioni.md X5, cad/script/zampa.py fai_tibia, guida/problemi/zampa.yaml (dati dell'FSR)]

  - id: "6.07"
    titolo: Piedino
    formato: mezzo
    nuovi: [zampa/Piedino]
    esploso: {asse: [0, 0, -1], distanza: 35}
    vista: tibia_capovolta
    evidenzia: [{chiave: zampa/Piedino, lav: tacca_fili}]
    etichette: [{testo: tacca, punto: [131, 16, -128]}]
    nascondi: [zampa/Cuscinetto_ginocchio]
    testo:
      - "Cala il piedino sulla punta, con la tacca sul fronte."
      - "Premi il piedino fino in fondo, dritto."
      - "Controlla che il doppino dell'FSR esca dalla tacca senza essere schiacciato."
    avvisi:
      - {tipo: prova, testo: "Con l'FSR: premendo il piedino, la resistenza sul doppino cala da oltre 1 MΩ a pochi kΩ [C]."}
    attrezzi: [multimetro]
    fonti: [D-064, "D-066, blocco A: pistoncino e tacca", cad/stl/README.md "Piedino.stl", docs/predisposizioni.md X5]

  - id: "6.08"
    titolo: Fili nel fermo della culla
    formato: mezzo
    mostra: [zampa/Tibia, zampa/Piedino, zampa/Servo_ginocchio]
    vista: zampa_fronte
    evidenzia: [{chiave: zampa/Tibia, lav: gola_fili}, {chiave: zampa/Tibia, lav: "sotto_ponte_*"}]
    etichette:
      - {testo: "coda della culla", punto: [132, 6.5, -33]}
      - {testo: testata, punto: [132, 6.5, 12]}
    testo:
      - "Infila i fili sotto i tre ponticelli, dalla coda della culla alla testata."
      - "Controlla che stiano affiancati nella gola, senza incrociarsi."
      - "Posa i fili accanto al cavo del servo, sopra la testata."
    avvisi:
      - {tipo: opzionale, x: X5 X31, quando: meglio_ora, testo: "Senza FSR e luci salta questo passo. Le spine all'altro capo si mettono dopo: sotto i ponticelli passano solo i fili."}
    fonti: [D-067, D-058, docs/cablaggio.md 3.3 "Gola del fermo"]


  # ------------------------------------------------------------------------------------------------- coxa
  - id: "6.09"
    titolo: Coxa
    formato: mezzo
    nuovi: [zampa/Coxa]
    mostra: []
    vista: zampa_A
    evidenzia:
      - {chiave: zampa/Coxa, lav: "ins_*"}
      - {chiave: zampa/Coxa, lav: fessura_cavo}
      - {chiave: zampa/Coxa, lav: finestra_cavo}
    etichette:
      - {testo: "2 × M3", punto: [55, 9.45, -46]}
      - {testo: "2 × M3 del ponte", punto: [38.6, 0, 31]}
    testo:
      - "Controlla i quattro inserti M3 a filo: due nelle bugne lato coda della culla, due in cima all'anima."
      - "Controlla che fessura e finestra del cavo nella testata siano pulite."
      - "Togli le bave di stampa da fessura e finestra."
    avvisi:
      - {tipo: nota, testo: "Gli inserti in cima all'anima servono al ponte (sezione 9). I due fori Ø2,5 lato albero restano senza inserto (D-049)."}
    attrezzi: [tronchesino]
    fonti: [D-048, D-049, "guida/dati/fori.json: Coxa ins_coda_a/b, ins_ponte_a/b, pilota_corto_a/b", "docs/BOM.md, inserti a caldo: 24 nelle coxe"]

  - id: "6.10"
    titolo: Cuscinetto del femore
    formato: mezzo
    nuovi: [zampa/Cuscinetto_femore]
    mostra: [zampa/Coxa]
    esploso: {asse: [0, -1, 0], distanza: 30}
    vista: zampa_B
    evidenzia: [{chiave: zampa/Coxa, lav: sede_cuscinetto}]
    testo:
      - "Premi il cuscinetto nella sede della culla dal lato B, prima del servo, flangia verso fuori."
      - "Premi fino a quando la flangia appoggia sulla faccia della coxa."
      - "Controlla che l'anello interno giri libero con un dito."
    avvisi:
      - {tipo: attenzione, testo: "Spingi solo sulla flangia: col pollice, o con un tubetto Ø 8–11,5 e dal lato A un distanziale ≥ 45 mm attorno al foro da 7,2 [C]."}
    fonti: ["D-049: foro dietro la sede da 7,2", docs/progetto-meccanico.md "Architettura", "cad/script/zampa.py _sede (la culla della coxa e' quella della tibia)", "guida/problemi/zampa.yaml 'Come si preme il cuscinetto del ginocchio' (esito)"]

  - id: "6.11"
    titolo: Servo del femore nella culla
    formato: mezzo
    nuovi: [zampa/Servo_femore]
    mostra: [zampa/Coxa, zampa/Cuscinetto_femore]
    esploso: {asse: [0, 1, 0], distanza: 45}
    vista: zampa_A
    evidenzia: [{chiave: zampa/Coxa, lav: fessura_cavo}, {chiave: zampa/Coxa, lav: finestra_cavo}]
    testo:
      - "Controlla che le alette siano nude: niente gommini né tubetti di ottone (sezione 5)."
      - "Annota il numero del servo nella scheda della zampa."
      - "Infila la spina del cavo nella finestra della testata, da dentro la culla."
      - "Infila il servo nella culla dal lato A, coda in basso e passacavo nella fessura."
    avvisi:
      - {tipo: importante, testo: "Coda in basso, albero in alto sull'asse dell'anca: girato, il servo occupa il posto del blocco del femore (D-047)."}
    fonti: ["D-047: servo del femore con la coda in basso", D-049, cad/stl/README.md "Provino della culla" punto 1]

  - id: "6.12"
    titolo: Viti delle alette del femore, accostate
    formato: mezzo
    giunzioni: [alette_femore_coda, alette_femore_albero]
    mostra: [zampa/Coxa, zampa/Cuscinetto_femore, zampa/Servo_femore]
    vista: zampa_A
    testo:
      - "Accosta le due viti M3 × 8 lato coda, negli inserti."
      - "Accosta le due viti M3 × 8 lato albero, nei fori pilota."
    avvisi:
      - {tipo: importante, testo: "Non stringere: si stringono per ultime, a femore montato (D-049)."}
    fonti: [D-049, docs/progetto-meccanico.md "Modello in Fusion (zampa v0)", guida/catalogo/giunzioni.yaml]

  # ------------------------------------------------------------------------------------------ Femore_B e perni
  - id: "6.13"
    titolo: Femore B
    formato: mezzo
    nuovi: [zampa/Femore_B]
    mostra: []
    vista: zampa_A
    evidenzia:
      - {chiave: zampa/Femore_B, lav: "ins_blocco_*"}
      - {chiave: zampa/Femore_B, lav: "foro_perno_*"}
    etichette:
      - {testo: "4 × M3", punto: [88, 27.15, 9.5]}
    testo:
      - "Controlla i quattro inserti M3 a filo sulla faccia del blocco, lato A."
      - "Controlla i due inserti M2 a filo sulla faccia esterna, lato B."
      - "Controlla che i due fori dei perni siano puliti e dritti."
    avvisi:
      - {tipo: nota, testo: "Gli inserti M2 servono alla lama B, che si monta dopo la taratura (sezione 12)."}
    fonti: [D-047, D-061, D-065, D-071, "guida/dati/fori.json: Femore_B ins_blocco_aa/ab/ga/gb, ins_lama_a/g, foro_perno_anca/ginocchio"]

  - id: "6.14"
    titolo: Perni nel femore B
    formato: mezzo
    nuovi: [zampa/Perno_femore, zampa/Perno_ginocchio]
    mostra: [zampa/Femore_B]
    esploso: {asse: [0, -1, 0], distanza: 25}
    vista: zampa_B
    evidenzia: [{chiave: zampa/Femore_B, lav: "foro_perno_*"}]
    testo:
      - "Infila i due perni nei fori dal lato esterno della piastra."
      - "Premi ogni perno con la morsa finché fuori ne restano 1,4 mm [V]."
      - "Misura e annota quanto sporgono dall'altro lato: 5,0 mm [V]."
    avvisi:
      - {tipo: attenzione, testo: "In morsa appoggia la piastra su un distanziale forato alto più di 5 mm, mai sul blocco [C]."}
    attrezzi: [morsa_morbida, calibro]
    fonti: ["D-047: perni Ø5 × 12", "D-049: perni forzati senza ritegno assiale", D-070, "cad/script/rif_componenti.py perno_l (5,2 nella piastra, 0,4 rialzo, 4 cuscinetto, 1 nel fondo, 1,4 sporgente)", "cad/script/zampa.py perno_sporge", "docs/ricerca/zampa-architetture.json, proposta scalata, montaggio punto 1"]

  - id: "6.15"
    titolo: Femore B sulla coxa e sulla tibia
    formato: grande
    assiemi:
      - {chiavi: "zampa/[FP]e[mr]*", esclusi: [zampa/Femore_A, zampa/Perno_coxa], nome: "Femore B con i perni (6.14)"}
    esploso: {asse: [0, -1, 0], distanza: 40}
    vista: zampa_B
    testo:
      - "Tieni coxa e tibia con i cuscinetti dal lato B, la tibia più in basso."
      - "Infila il perno dell'anca nel cuscinetto della coxa e quello del ginocchio nel cuscinetto della tibia."
      - "Spingi Femore B fino a quando il rialzo dei mozzi tocca gli anelli interni."
      - "Controlla che coxa e tibia girino libere sui perni."
    avvisi:
      - {tipo: importante, testo: "Non girare gli alberi dei due servo: restano a metà corsa per il calettamento."}
      - {tipo: nota, testo: "Il blocco passa fra le due culle senza toccarle, dalla posa del calettamento a quella come costruita [V]. I perni h8 scorrono nei cuscinetti; con perni m6 serve il provino (BOM D2) [C]."}
    fonti: [D-047, D-049, "docs/BOM.md D2", "docs/ricerca/zampa-architetture.json, proposta scalata, montaggio punto 6", "raggi sulle mesh: Femore_B libero lungo +Y con (alfa, gamma) = (20, 100), (17,5, 95), (0, 90), (60, 100), (20, 40); controllo con la coxa spostata di 15 mm: 196 urti"]

  # ------------------------------------------------------------------------------------------------- calettamento
  - id: "6.16"
    titolo: Posa del calettamento
    formato: grande
    posa: {alfa: 20, gamma: 100, coxa: 0}
    vista: {direzione: [0.25, -0.93, 0.27], su: [0, 0, 1]}
    etichette:
      - {testo: "femore +20°", punto: [75, -31, 32]}
      - {testo: "ginocchio 100°", punto: [140, -20, -10]}
    testo:
      - "Controlla che i due servo siano ancora a metà corsa; se hai girato un albero, riportalo a 1500 µs con il banco della sezione 5."
      - "Ruota il femore sulla coxa fino a +20°: ginocchio in alto, 20° sopra la squadra con la culla [V]."
      - "Ruota la tibia fino a 100° dal femore: 10° oltre la squadra, piede verso l'esterno [V]."
      - "Tieni la zampa in questa posa fino alla fine del passo 6.17."
    tabella:
      intestazione: [Giunto, Servo, Posa, Come la riconosci]
      righe:
        - ["Anca", "metà corsa, 1500 µs", "α +20° [V]", "femore 20° sopra la squadra con la culla della coxa"]
        - ["Ginocchio", "metà corsa, 1500 µs", "γ 100° [V]", "tibia 10° oltre la squadra con il femore"]
    avvisi:
