    extra: [{nome: "fascetta da 2,5 mm", qta: 1, bom: D11}]
    attrezzi: [calibro, tronchesino]
    fonti: ["D-058: cavi lungo la zampa, anse", "D-061, B1: fascetta dentro il blocco (feritoie a X 79,5, tunnel a Z 10)", "docs/cablaggio.md 3.2 'Ginocchio' e 3.3", "docs/BOM.md D11: 6 fascette corte nel blocco dei femori", "cad/script/zampa.py fem_fascetta_u, fem_fascetta_fondo", "guida/problemi/zampa.yaml 'Ansa del cavo del ginocchio'"]

