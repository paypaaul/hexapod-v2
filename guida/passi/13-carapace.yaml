# Sezione 13, il carapace (D-075, docs/piano-guida.md "Struttura della guida"). F3, estrattore delle sezioni 13-15;
# F3c: allineata agli schemi della scheda del carapace (guida/schemi/scheda_carapace*.svg, schemi.md sezione 2).
# Terna del robot. Il carapace si prepara al banco, capovolto su un panno, e poi si porta sul corpo: i passi 13.01-13.18
# non toccano il robot (nascondi: il corpo e le zampe non si disegnano), da 13.19 il carapace sale sul corpo.
# Pezzi della sezione: carapace, fascia, visiera e gonne (un solo pezzo stampato a due colori), pulsante, anello di
# stato (X11), luci dei lobi (X12), altoparlante e amplificatore (X17), lunette e microfoni (X16), ToF posteriore (X19),
# cicalino, tappo del ToF frontale (alternativa di X8), scheda del carapace (X2), sportellino. Lo sportellino con lo
# zaino e' un'alternativa: solo avviso. Il pulsante e la scheda arrivano alla basetta con il cavo piatto a 16 vie.
# La scheda si prepara in 4.22-4.25 (taglio, CE1, testata, ponticelli, fili 101-112) e qui si completa con i fili dei moduli
# (13.16); i fori e i fili sono nella notazione colonna-riga degli schemi (D-2, G-8). S-01 (la testata con la spina non
# sta sotto la scheda) e' bloccante: 13.16, 13.17 e 13.19 lo dicono e marcano [C] quello che ne dipende
# (guida/problemi/schemi.yaml, guida/problemi/carapace.yaml). Il CAD non ha strisce LED, fili, spine e nastri: li
# mostrano le etichette. Il carapace sale sul corpo con 13.21, quando anche T-plug e batteria sono a posto.
sezione:
  id: carapace
  numero: 13
  titolo: Il carapace
  colore: "#1c7ed6"
  terna: robot
  istanza: AS
  presenti_iniziali: &robot
    - corpo/Corpo_Base
    - corpo/Corpo_Chiglia
    - "corpo/Corpo_Slitta_Regolatore_*"
    - "corpo/Servo_Coxa_*"
    - "corpo/Cuscinetto_Coxa_*"
    - corpo/SSC32
    - corpo/Basetta
    - corpo/ESP32
    - corpo/Camera
    - corpo/Portafusibile_F1
    - corpo/Tplug
    - "corpo/Wago_*"
    - "corpo/Regolatore_*"
    - "corpo/Corpo_Supporto_INA260_*"
    - "corpo/INA260_*"
    - corpo/Corpo_Vassoio
    - corpo/Prese_piedi
    - corpo/Prese_luci
    - corpo/ToF_frontale
    - corpo/Interruttore
    - corpo/ADC
    - corpo/Corpo_Piastrina_IMU
    - corpo/IMU
    - corpo/Batteria
    - corpo/Corpo_Sportello
    - "zampa/Coxa@*"
    - "zampa/Coxa_Ponte@*"
    - "zampa/Cuscinetto_*@*"
    - "zampa/Perno_*@*"
    - "zampa/Squadretta_*@*"
    - "zampa/Servo_*@*"
    - "zampa/Femore_A@*"
    - "zampa/Femore_B@*"
    - "zampa/Tibia@*"
    - "zampa/Piedino@*"
    - "zampa/FSR_piede@*"
    - "zampa/Cover_Tibia@*"
    - "zampa/Cover_Tibia_Diffusore@*"
    - "zampa/Cover_Femore_A@*"
    - "zampa/Cover_Femore_A_Feritoia@*"
    - "zampa/Cover_Femore_B@*"
    - "zampa/Cover_Femore_B_Feritoia@*"
  obiettivo: >-
    Preparare il carapace al banco, capovolto, con pulsante, luci, audio, ToF e scheda; provarlo; collegarlo al corpo
    con il cavo piatto e avvitarlo; chiudere l'ottagono con lo sportellino; provare il T-plug a mano.
  prima:
    - "Pezzo a due colori stampato e controllato (sezione 2)."
    - "Inserti M2 di scheda e amplificatore messi (sezione 3, 3.20)."
    - "Scheda del carapace con CE1 e fili 101–112 (4.22–4.25) e cavo piatto sulla basetta (4.15); J2 dopo S-01 [C]."
    - "Zampe, batteria e cicalino provati (sezioni 9–12)."
    - "Scelte le predisposizioni X2, X11, X12, X16, X17, X19."
    - "Pronti: striscia LED 133 mm (X9), fili 30 AWG 2,5 m e 26 AWG 2 m, 6 viti M2 × 5."
  tempo: "circa 2 ore e mezza, la prima volta [S]"
  stato_elettrico: "Nessuno fino a 13.18. Con T-plug collegato solo in 13.20, rail dei servo spento."
  note: "Il PLA rammollisce verso 55–60 °C: il saldatore non tocca mai il carapace (D-065)."
  fonti: [D-052, D-056, D-063, D-065, D-066, D-067, D-068, D-069, D-074, D-075, docs/cablaggio.md 3.5 e 4, docs/predisposizioni.md 2.3 e 5, "cad/stl/README.md", guida/problemi/carapace.yaml, "guida/schemi/schemi.md sezione 2", guida/problemi/schemi.yaml]
  attrezzi: [multimetro, saldatore, spelafili, tronchesino, croce_ph0, brugola_2_5, termorestringente]
  controllo:
    - "Il pulsante è fermo dal dado, l'anello bianco è centrato e i fili dei pixel escono dalla tacca."
    - "Nelle luci dei lobi: sei pezzi da 2 pixel nelle piastrine, fra i ganci, con la freccia nel verso della catena."
    - "Altoparlante, amplificatore, microfoni con le lunette, ToF posteriore e cicalino sono fermi; nessun filo è teso o schiacciato."
    - "La scheda è avvitata con tutti i fili saldati (101–112 e moduli) e le nove prove di 13.18 sono passate."
    - "Il carapace è sul corpo con le quattro viti M3 × 8 strette; lo sportellino è a filo e si toglie con l'unghia."
    - "Il T-plug e lo spinotto di bilanciamento si afferrano dalla porta di coda con il carapace montato."
  vista_finale: {direzione: [0.55, -0.6, 0.55], su: [0, 0, 1]}

passi:
  - id: "13.01"
    titolo: Carapace a due colori
    formato: grande
    nuovi: [corpo/Corpo_Carapace, corpo/Corpo_Fascia, corpo/Corpo_Visiera, corpo/Corpo_Gonne]
    nascondi: *robot
    vista: {direzione: [0.45, 0.55, -0.7], su: [0, 0, -1]}
    evidenzia:
      - {chiave: corpo/Corpo_Carapace, lav: "bugna_sch_*"}
      - {chiave: corpo/Corpo_Carapace, lav: "bugna_amp_*"}
    etichette:
      - {testo: viso, punto: [101.0, 0.0, 6.0]}
      - {testo: coda, punto: [-96.0, 0.0, 30.0]}
      - {testo: scheda, punto: [39.5, 0.0, 31.0]}
      - {testo: ampli, punto: [67.4, 0.0, 31.0]}
    testo:
      - "Posa il carapace capovolto su un panno, con l'interno verso l'alto."
      - "Controlla che fascia, visiera e gonne nere siano saldate al bianco, senza distacchi."
      - "Controlla che foro del pulsante, finestre e quattro pozzetti siano puliti."
      - "Controlla i sei inserti M2 nelle bugne gialle: quattro per la scheda, due per l'amplificatore."
      - "Togli le bave dai bordi."
    avvisi:
      - {tipo: nota, testo: "Un pezzo solo a due colori: fascia, visiera e gonne in PLA nero, il resto in PLA bianco (D-063)."}
      - {tipo: attenzione, testo: "Il PLA rammollisce verso 55–60 °C: non appoggiare il saldatore sul carapace (D-065)."}
      - {tipo: opzionale, x: "X2 X17", quando: meglio_ora, testo: "Inserti M2 di scheda e amplificatore: nella sezione 3. Dopo, i moduli vanno tolti."}
    attrezzi: [tronchesino]
    fonti: [D-063, D-065, D-066, "cad/stl/README.md Corpo_Carapace.stl", "cad/script/corpo.py fai_carapace_dettagli e fai_carapace_predisposizioni", "guida/passi/03-inserti.yaml 3.20"]

  - id: "13.02"
    titolo: Pulsante nel dorso
    formato: grande
    nuovi: [corpo/Pulsante]
    esploso: {asse: [0, 0, 1], distanza: 32}
    nascondi: *robot
    vista: corpo_alto
    etichette:
      - {testo: anello, punto: [-40.0, 10.0, 36.0]}
    testo:
      - "Controlla con il multimetro: i due contatti sono aperti a riposo e chiusi premendo [C]."
      - "Infila il pulsante dall'esterno nel foro Ø 12,2 al centro dell'anello bianco."
      - "Tienilo con un dito e capovolgi il carapace sul panno."
    avvisi:
      - {tipo: importante, testo: "Se i contatti sono chiusi a riposo il pulsante è normalmente chiuso: non va bene per la 2813, che vuole un contatto normalmente aperto. Non montarlo (BOM B3b) [C]."}
      - {tipo: nota, testo: "Pulsante da pannello Ø 12, testa Ø 15 alta 2 mm, corpo lungo circa 20 mm sotto il dorso [C]: le misure vere si guardano sul pezzo (BOM B3b)."}
    attrezzi: [multimetro]
    fonti: [D-059, "D-066 blocco B", "docs/BOM.md B3b", "cad/script/corpo.py _fori_dorso (foro_pulsante)", "cad/script/rif_componenti.py Rif_Pulsante_12", guida/problemi/carapace.yaml]

  - id: "13.03"
    titolo: Dado del pulsante
    formato: mezzo
    mostra: []
    in_evidenza: [corpo/Pulsante]
    evidenzia: [{chiave: corpo/Corpo_Fascia, lav: camera_nera}]
    vista: {direzione: [0.35, 0.45, -0.6], su: [0, 0, -1]}
    etichette:
      - {testo: dado, punto: [-40.0, 0.0, 33.4]}
      - {testo: camera nera, punto: [-40.0, 17.0, 30.0]}
    testo:
      - "Avvita il dado sul corpo del pulsante, da sotto, contro il dorso."
      - "Stringi a mano, senza forzare."
      - "Controlla che il pulsante sia dritto e al centro della camera nera, gialla."
    avvisi:
      - {tipo: nota, testo: "Il dado resta dentro la camera nera Ø 32 × 6: i pixel dell'anello passano sotto di lui, con circa 3 mm di margine [C, il dado vero non è misurato] (D-067)."}
    fonti: [D-067, "docs/BOM.md B3b", "cad/script/rif_componenti.py Rif_Pulsante_12 (dado alto 2 mm)", "cad/script/corpo.py fai_fascia camera_nera"]

  - id: "13.04"
    titolo: Pixel nel fondo dell'anello
    formato: grande
    mostra: []
    in_evidenza: [corpo/Corpo_Fondo_Anello]
    evidenzia: [{chiave: corpo/Corpo_Fondo_Anello, lav: "sede_pixel_*"}]
    vista: {direzione: [0.3, 0.45, 0.8], su: [0, 0, 1]}
    etichette:
      - {testo: "+Y", punto: [-40.0, 9.2, 28.0]}
      - {testo: "−Y", punto: [-40.0, -9.2, 28.0]}
    testo:
      - "Taglia due pezzi da 2 pixel dalla striscia, sulle linee di taglio: 16,7 mm ciascuno [V]."
      - "Salda 3 fili da 30 AWG a ogni capo, prima di posare i pezzi: massa, +5 V, dato."
      - "Posa ogni pezzo nella sua sede gialla del fondo, con i LED in su."
      - "Collega i pezzi come nella tabella."
    tabella:
      intestazione: [Pezzo, Ingresso del dato, Uscita del dato]
      righe:
        - ["+Y", "dalla scheda, lato coda", "ponticello di 3 fili, circa 30 mm [S], al pezzo −Y"]
        - ["−Y", "dal ponticello, lato testa", "verso la tacca, lato coda, poi ai lobi"]
    avvisi:
      - {tipo: opzionale, x: X11, quando: meglio_ora, testo: "Anello di stato: 4 pixel. Senza X11 non salda i pixel e passa al fondo: il fondo chiude comunque la camera [S]."}
      - {tipo: attenzione, testo: "Salda i fili fuori dal fondo: è di PLA nero e rammollisce verso 55–60 °C (D-065)."}
      - {tipo: nota, testo: "Striscia WS2812B-2020 a 120 LED/m: un pixel ogni 8,33 mm, taglio a ogni LED (D-068). Il pezzo ha la sua freccia: punta dall'ingresso all'uscita."}
    attrezzi: [saldatore, spelafili, tronchesino]
    fonti: ["D-067: fondo e sedi dei pixel", "D-068: 2 pixel per sede, 4 in tutto", "docs/cablaggio.md 3.5 'Dentro la camera dell'anello'", "docs/predisposizioni.md X11", "cad/script/corpo.py fai_fondo_anello", guida/problemi/carapace.yaml]

  - id: "13.05"
    titolo: Fondo sul pulsante
    formato: grande
    nuovi: [corpo/Corpo_Fondo_Anello]
    esploso: {asse: [0, 0, -1], distanza: 26}
    nascondi: *robot
    vista: {direzione: [0.3, 0.45, -0.8], su: [0, 0, -1]}
    evidenzia:
      - {chiave: corpo/Corpo_Fascia, lav: camera_nera}
      - {chiave: corpo/Corpo_Fascia, lav: camera_nera_tacca}
    etichette:
      - {testo: tacca, punto: [-56.0, 0.0, 31.0]}
    testo:
      - "Porta i fili dei pixel verso la tacca della camera, dalla parte della coda."
      - "Infila il fondo sul corpo del pulsante, dal basso, con i pixel in su."
      - "Premi il fondo finché la gonna calza la parete della camera."
      - "Controlla che i fili escano dalla tacca senza essere schiacciati."
    avvisi:
      - {tipo: importante, testo: "Se i contatti del pulsante non passano nel foro del fondo, non allargarlo: fermati e leggi il problema in guida/problemi/carapace.yaml [C]."}
      - {tipo: nota, testo: "Forzamento leggero: 0,05 mm di gioco per lato nel modello, da tarare con il provino di luce (X10) [C] (D-067)."}
    fonti: ["D-067", "cad/script/corpo.py fai_fondo_anello", "cad/stl/README.md Corpo_Fondo_Anello.stl", guida/problemi/carapace.yaml]

  - id: "13.06"
    titolo: Fili del pulsante
    formato: mezzo
    mostra: [corpo/Corpo_Fondo_Anello]
    in_evidenza: [corpo/Pulsante]
    vista: {direzione: [0.35, 0.45, -0.6], su: [0, 0, -1]}
    etichette:
      - {testo: contatti, punto: [-40.0, 0.0, 14.4]}
    testo:
      - "Salda due fili da 26 AWG ai contatti del pulsante, lunghi circa 9 cm [S]."
      - "Lascia liberi gli altri capi: si saldano sui pin D-9 ed E-9 della testata, poli 15 e 16 (13.16)."
    avvisi:
      - {tipo: nota, testo: "Il pulsante è in parallelo al pulsantino della 2813: dalla scheda i due fili vanno, con il cavo piatto, ai pin A e B (BOM B3b, docs/cablaggio.md 3.1)."}
      - {tipo: importante, testo: "La tensione dei pin A e B della 2813 non è scritta da nessuna parte: si misura al banco (4.27) prima di collegare la spina IDC (S-10) [C]."}
    attrezzi: [saldatore, spelafili]
    fonti: ["docs/cablaggio.md 3.1 e 3.5 'Pulsante'", "docs/BOM.md B3b, B17", D-059]

  - id: "13.07"
    titolo: Luci dei lobi
    formato: grande
    volte: 6
    nascondi: *robot
    in_evidenza: [corpo/Corpo_Carapace]
    evidenzia:
      - {chiave: corpo/Corpo_Carapace, lav: "luce_lobo_*"}
      - {chiave: corpo/Corpo_Carapace, lav: "gancio_lobo_*"}
    vista: {direzione: [0.45, 0.55, -0.7], su: [0, 0, -1]}
    etichette:
      - {testo: "1 PS", punto: [-94.7, 52.5, 33.8]}
      - {testo: "2 MS", punto: [0.0, 65.0, 33.8]}
      - {testo: "3 AS", punto: [94.7, 52.5, 33.8]}
      - {testo: "4 AD", punto: [94.7, -52.5, 33.8]}
      - {testo: "5 MD", punto: [0.0, -65.0, 33.8]}
      - {testo: "6 PD", punto: [-94.7, -52.5, 33.8]}
    testo:
      - "Taglia sei pezzi da 2 pixel dalla striscia, 16,7 mm ciascuno [V]."
      - "Salda 3 fili da 30 AWG a ogni capo: massa, +5 V, dato."
      - "Posa un pezzo nella sede gialla sotto il dorso di ogni lobo, con i LED verso il basso, fra i due ganci."
      - "Segui l'ordine delle etichette: l'ingresso del dato guarda il lobo prima."
    avvisi:
      - {tipo: opzionale, x: X12, quando: meglio_ora, testo: "Luci dei lobi: 12 pixel. Dopo costa togliere moduli e fili dal carapace. Senza X12 salta questo passo e il successivo."}
      - {tipo: nota, testo: "Piastrina 5 × 22 × 0,6 mm con due ganci, a 17 mm dall'asse della coxa, sulla direzione neutra della zampa (D-066, D-067). Il pezzo è lungo 16,7, i fili stanno nei 22 mm [S]."}
      - {tipo: nota, testo: "Ordine della catena: anello, lobi PS, MS, AS, AD, MD, PD (docs/cablaggio.md 3.5). La catena ha 16 pixel in tutto (D-068)."}
    attrezzi: [saldatore, spelafili, tronchesino]
    fonti: ["D-066 blocco B: luci dei lobi", D-067, "D-068: lobi a 2 pixel", "docs/predisposizioni.md X12", "docs/cablaggio.md 3.5 'Catena LED'", "cad/script/corpo.py fai_carapace_predisposizioni (luce_lobo, gancio_lobo, labbro_lobo)"]

  - id: "13.08"
    titolo: Cavo della catena nei ganci
    formato: grande
    nascondi: *robot
    in_evidenza: [corpo/Corpo_Carapace]
    evidenzia:
      - {chiave: corpo/Corpo_Carapace, lav: "gancio_cavo_*"}
      - {chiave: corpo/Corpo_Carapace, lav: "gancio_lobo_*"}
      - {chiave: corpo/Corpo_Fascia, lav: camera_nera_tacca}
    vista: {direzione: [0.45, 0.55, -0.7], su: [0, 0, -1]}
    etichette:
      - {testo: scheda, punto: [39.5, -14.0, 31.0]}
      - {testo: anello, punto: [-40.0, 0.0, 31.0]}
      - {testo: "1 PS", punto: [-94.7, 52.5, 33.8]}
      - {testo: "4 AD", punto: [94.7, -52.5, 33.8]}
    tabella:
      intestazione: [Tratto, "Da → a", "Fili da tagliare, 3 × 30 AWG [S]"]
      righe:
        - ["1", "scheda (A-9 +5 V, B-9 massa, pin E-3 dato) → anello (tacca)", "misura sul carapace + 20 mm"]
        - ["2", "anello → lobo PS", "circa 100 mm"]
        - ["3", "lobo PS → lobo MS", "circa 115 mm"]
        - ["4", "lobo MS → lobo AS", "circa 115 mm"]
        - ["5", "lobo AS → lobo AD, davanti", "circa 125 mm"]
        - ["6", "lobo AD → MD → PD", "circa 115 mm ciascuno"]
    testo:
      - "Porta il cavo dalla scheda alla camera dell'anello, lungo il lato sinistro dell'ottagono, dentro e fuori dalla stessa tacca."
      - "Passa il cavo nei ganci gialli sotto il dorso, dai lobi di sinistra a quelli di destra, e davanti sotto il viso."
      - "Lascia libero il capo della scheda fino a 13.16."
      - "Controlla che nessun tratto sia teso e che nessun filo tocchi i pozzetti delle viti."
    avvisi:
      - {tipo: opzionale, x: "X11 X12", quando: meglio_ora, testo: "Senza X11 e X12 salta questo passo."}
      - {tipo: nota, testo: "Ganci a x −40, 0 e 40, due denti per posizione: il cavo corre fra i due. Lunghezze in linea retta più 20 mm: misurale sul pezzo [S] (docs/cablaggio.md 3.5)."}
      - {tipo: importante, testo: "Il percorso non è nel CAD: cavo lasco, con un'ansa a ogni lobo [C] (guida/problemi/carapace.yaml)."}
    attrezzi: [tronchesino]
    fonti: ["docs/cablaggio.md 3.5 'Catena LED'", "docs/predisposizioni.md X9, X12", "cad/script/corpo.py fai_carapace_predisposizioni (ganci del cavo)", guida/problemi/carapace.yaml]

  - id: "13.09"
    titolo: Altoparlante
    formato: grande
    nuovi: [corpo/Altoparlante]
    esploso: {asse: [-1, 0, 0], distanza: 30}
    nascondi: *robot
    vista: {direzione: [-0.6, -0.65, -0.45], su: [0, 0, -1]}
    evidenzia:
      - {chiave: corpo/Corpo_Carapace, lav: "guida_altoparlante_*"}
      - {chiave: corpo/Corpo_Carapace, lav: fermo_altoparlante}
    etichette:
      - {testo: guide, punto: [-94.0, -24.0, 4.0]}
      - {testo: fermo, punto: [-88.0, 20.0, 28.0]}
    testo:
      - "Allunga i due fili dell'altoparlante fino a circa 17 cm [S]; guaina termorestringente sulle giunzioni."
      - "Infila l'altoparlante da dietro, fra le due guide gialle della guancia destra."
      - "Spingilo fino al fermo giallo, davanti: dietro la guancia ne sporgono 3,3 mm."
      - "Porta i fili sotto il dorso, verso l'amplificatore."
    avvisi:
      - {tipo: opzionale, x: X17, quando: meglio_ora, testo: "Altoparlante tondo da 15 mm. Dopo, i fili non si portano più sotto il dorso."}
      - {tipo: importante, testo: "Nessuna sede lo tiene all'indietro: fermalo con colla a caldo o nastro [C]."}
      - {tipo: nota, testo: "Guide a 15,4 mm, spessore 4 mm non dichiarato [C] (D-074). Limita il volume nel firmware: a 5 V l'amplificatore arriva a circa 1,4 W, l'altoparlante regge 1 W."}
    attrezzi: [saldatore, termorestringente]
    fonti: [D-066, "D-074: guide, fermo, altoparlante tondo", "docs/cablaggio.md 3.5 'Altoparlante'", "docs/predisposizioni.md X17", "cad/script/corpo.py fai_carapace_predisposizioni (guide_altoparlante, fermo_altoparlante)", guida/problemi/carapace.yaml]

  - id: "13.10"
    titolo: Amplificatore
    formato: grande
    nuovi: [corpo/Ampli]
    esploso: {asse: [0, 0, -1], distanza: 28}
    nascondi: *robot
    vista: {direzione: [0.45, 0.55, -0.7], su: [0, 0, -1]}
    evidenzia: [{chiave: corpo/Corpo_Carapace, lav: "bugna_amp_*"}]
    etichette:
      - {testo: morsettiera, punto: [72.0, 0.0, 28.0]}
      - {testo: pin, punto: [50.0, 0.0, 28.0]}
    testo:
      - "Salda cinque fili ai pin, circa 5 cm [S]: 5 V, massa, BCLK, WS (LRC), dati (DIN)."
      - "Lascia GAIN e SD liberi: guadagno e canale di fabbrica [S]."
      - "Posa l'amplificatore sulle due bugne gialle, con i pin verso la scheda e la morsettiera verso il viso [S]."
