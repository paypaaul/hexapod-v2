  - id: "13.18"
    titolo: Prova al banco, senza corrente
    formato: grande
    immagine: false
    tabella:
      intestazione: [Punto, Atteso, Misurato]
      righe:
        - ["1. Polo 1 contro polo 3", "non 0 Ω; la lettura sale mentre il 470 µF si carica [S]", ""]
        - ["2. Polo 7 contro poli 3, 5, 9", "non 0 Ω", ""]
        - ["3. Polo 1 contro polo 7", "aperto", ""]
        - ["4. Poli 1 e 4 (5 V, dato) contro poli 6, 8, 10, 11, 12, 13", "aperto", ""]
        - ["5. Poli 15 e 16 contro tutti gli altri", "aperto", ""]
        - ["5. Poli 15 e 16 fra loro", "aperto a riposo; chiuso, vicino a 0 Ω, a pulsante premuto [C]", ""]
        - ["6. Polo 12 contro massa, con i microfoni collegati", "circa 100 kΩ, R8 [S]", ""]
        - ["7. Polo 14 contro tutti", "aperto", ""]
        - ["8. Ogni filo 101–112 dal polo alla piazzola, e ogni piazzola al pin del suo modulo", "0 Ω [S]", ""]
        - ["8. Polo 4 contro il DIN del primo pixel dell'anello; poli 15 e 16 contro i contatti del pulsante", "0 Ω [S]", ""]
        - ["9. I fori vicini alle quattro viti, sul lato saldature", "nessuno stagno, nessun filo sopra", ""]
    testo:
      - "Posa il carapace capovolto sul panno, senza spina IDC né batteria."
      - "Misura con il multimetro ogni riga della tabella e annota il valore."
      - "Se una riga non torna, torna al passo del suo modulo o a 4.22–4.25 e ripara: non proseguire."
    avvisi:
      - {tipo: attenzione, testo: "Un corto fra +5 V e massa fa scattare PTC1 e può bruciare il regolatore da 5 V: non collegare la spina IDC finché le righe 1–4 non tornano (BOM B2)."}
      - {tipo: nota, testo: "Sono le nove prove di schemi.md 2.6, sul disegno A.17. I poli si misurano sulle saldature dei pin della testata a 90°, sul lato saldature, che con il carapace capovolto sta in alto [C]. I nomi dei fori dello schema non valgono finché non è ridisegnato (13.16)."}
    attrezzi: [multimetro]
    fonti: ["guida/schemi/schemi.md 2.6", "docs/cablaggio.md 3.5", "docs/predisposizioni.md 2.3", "D-074", "D-076: testata a 90°", "guida/passi/12-accensione.yaml 12.03 (stesso stile di prova)", guida/problemi/carapace.yaml]

  - id: "13.19"
    titolo: Spina IDC e cicalino
    formato: grande
    assiemi:
      - chiavi: "corpo/*"
        esclusi: &esclusi_corpo
          - corpo/Corpo_Base
          - corpo/Corpo_Chiglia
          - "corpo/Corpo_Slitta_Regolatore_*"
          - "corpo/Servo_Coxa_*"
          - "corpo/Cuscinetto_Coxa_*"
          - corpo/SSC32
          - corpo/Basetta
          - corpo/ESP32
          - corpo/Camera
          - corpo/Portafusibile_F1
          - corpo/Tplug
          - "corpo/Wago_*"
          - "corpo/Regolatore_*"
          - "corpo/Corpo_Supporto_INA260_*"
          - "corpo/INA260_*"
          - corpo/Corpo_Vassoio
          - corpo/Prese_piedi
          - corpo/Prese_luci
          - corpo/ToF_frontale
          - corpo/Interruttore
          - corpo/ADC
          - corpo/Corpo_Piastrina_IMU
          - corpo/IMU
          - corpo/Batteria
          - corpo/Corpo_Sportello
          - corpo/IMU_Pololu
          - "corpo/Microfono_Adafruit_*"
          - "corpo/Corpo_Sportello_Servizio*"
        nome: Carapace con i suoi moduli (13.01-13.17)
    esploso: {asse: [0, 0, 1], distanza: 70}
    nascondi: [corpo/Corpo_Carapace, corpo/Corpo_Fascia, corpo/Corpo_Visiera, corpo/Corpo_Gonne]
    vista: {direzione: [-0.8, -0.5, 0.3], su: [0, 0, 1]}
    etichette:
      - {testo: testata e spina, punto: [30.0, 0.0, 95.0]}
      - {testo: "2 strisce", punto: [24.0, -9.0, 31.0]}
      - {testo: cicalino, punto: [-74.5, 0.0, 88.0]}
    testo:
      - "Solleva il carapace di circa 10 cm sopra il corpo, senza tirare i cavi."
      - "Infila la spina IDC, orizzontale, nella testata a 90° sotto la scheda, verso il viso, con la chiave in basso."
      - "Controlla che il filo rosso, polo 1, sia dal lato del polo 1 della testata [C]."
      - "Piega il nastro sopra la spina; le due strisce girano a 45° a destra, la sinistra sopra la destra, e scendono a destra dell'ESP32 [C]."
      - "Infila la prolunga di bilanciamento nel cicalino, nero sul polo −; il verso dei pin si guarda sul pezzo [C]."
      - "Controlla che il display mostri le due celle."
    avvisi:
      - {tipo: attenzione, testo: "Il cicalino assorbe sempre: a fine uso staccalo dalla prolunga (BOM B9)."}
      - {tipo: attenzione, testo: "Spina IDC al contrario: il +5 V arriva sui pin A e B della 2813. La chiave della testata lo impedisce: se la spina non entra, non forzare (S-26)."}
      - {tipo: importante, testo: "Il cavo piatto non passa intero: dopo il fermacavo è in due strisce da 8 conduttori, fra l'8 e il 9 (4.15). Il percorso lascia 0,25 mm dal PCB dell'ESP32 e 0,3 dalla battuta dell'ottagono [S]. Se non passa: soluzione B di P-002, a scelta di chi progetta (P-140)."}
      - {tipo: nota, testo: "Cavo di circa 15 cm: il carapace si solleva di circa 10 cm. La spina si sfila dall'ottagono [S]."}
    fonti: ["docs/cablaggio.md 3.5, 3.5bis e 4 'Carapace'", "docs/predisposizioni.md 2.3 'Come si toglie il carapace'", "docs/BOM.md B9, C7", "D-076: testata a 90° (P-002)", "D-077: cavo piatto in due strisce (P-140)", "guida/passi/12-accensione.yaml 12.04"]

  - id: "13.20"
    titolo: Prova con la logica accesa
    formato: grande
    immagine: false
    tabella:
      intestazione: [Prova, Atteso, Misurato]
      righe:
        - ["Pulsante del carapace", "accende e spegne la logica come il pulsantino della 2813 [V]", ""]
        - ["Anello di stato", "si accende all'avvio [C]", ""]
        - ["Luci dei lobi", "si accendono, in ordine PS, MS, AS, AD, MD, PD [C]", ""]
        - ["Display del cicalino", "mostra le due celle [V]", ""]
        - ["Microfoni e altoparlante", "il firmware li riconosce e suona un tono di prova [C]", ""]
        - ["ToF posteriore", "risponde sul bus all'indirizzo 0x31 [C]", ""]
        - ["Spie dei rail, se montate", "spente: il rail è spento [V]", ""]
    testo:
      - "Controlla che F1 abbia il fusibile da 30 A e che T-plug e cicalino siano collegati."
      - "Collega il T-plug: il rail dei servo resta spento, non dare comandi di rail."
      - "Premi il pulsante del carapace e controlla ogni riga della tabella."
      - "Spegni con lo stesso pulsante e stacca il T-plug."
    avvisi:
      - {tipo: attenzione, testo: "Il rail dei servo deve restare spento: con il carapace sollevato e le zampe libere, un servo che parte può colpire le dita. Tieni il T-plug a portata (software.md 2.6)."}
      - {tipo: importante, testo: "La prova dipende dal firmware S2–S6, che non c'è ancora: i comandi e i colori sono marcati [C] (guida/problemi/carapace.yaml)."}
      - {tipo: nota, testo: "L'anello mostra il modo del robot: avvio, rete, rail acceso, batteria bassa, errore (docs/predisposizioni.md X11, software.md 3.3). I colori non sono ancora definiti."}
    attrezzi: [multimetro]
    fonti: ["docs/BOM.md B3b (pulsante in parallelo alla 2813)", "docs/predisposizioni.md X11, X12, X16, X17, X19", "docs/software.md 2.6 e 3.3", "guida/passi/12-accensione.yaml 12.07", guida/problemi/carapace.yaml]

  - id: "13.21"
    titolo: Carapace sul corpo
    formato: grande
    assiemi:
      - chiavi: "corpo/*"
        esclusi: *esclusi_corpo
        nome: Carapace con i suoi moduli (13.01-13.17)
    giunzioni: [{id: carapace, esploso: 18}]
    esploso: {asse: [0, 0, 1], distanza: 60}
    vista: corpo_alto
    testo:
      - "Cala il carapace sul corpo, con i quattro pozzetti sopra le quattro colonnine del tetto."
      - "Controlla che il viso scavalchi la camera e che nessun filo resti sotto i bordi."
      - "Accosta le quattro viti M3 × 8 negli inserti delle colonnine."
      - "Stringi le quattro viti, a croce."
    avvisi:
      - {tipo: importante, testo: "Calalo in verticale: a 2 mm dal tetto le gonne e il carapace toccano la base (D-063). Lo sfilamento è libero da 5 a 40 mm."}
      - {tipo: nota, testo: "Quattro colonnine a x 40 e −56, |y| 22,5; la vite prende 6,4 mm di inserto dopo 1,6 mm di dorso (D-052)."}
      - {tipo: attenzione, testo: "Stringi piano: il pozzetto è di PLA e si segna."}
    fonti: ["D-052: colonnine e viti", "D-063: sfilamento", "docs/cablaggio.md 4 'Carapace'", guida/catalogo/giunzioni.yaml]
    attrezzi: [brugola_2_5]

  - id: "13.22"
    titolo: Sportellino di servizio
    formato: grande
    nuovi: [corpo/Corpo_Sportello_Servizio]
    esploso: {asse: [0, 0, 1], distanza: 50}
    vista: {direzione: [0.55, 0.35, 0.75], su: [0, 0, 1]}
    etichette:
      - {testo: tacca, punto: [30.5, 0.0, 36.0]}
    testo:
      - "Posa lo sportellino sull'ottagono del dorso, sulla battuta, con la tacca verso il viso."
      - "Premi i bordi: le quattro nervature tengono per attrito."
      - "Controlla che sia a filo del dorso."
      - "Solleva l'angolo dalla tacca con l'unghia: deve staccarsi."
    avvisi:
      - {tipo: nota, testo: "Nervature a filo nel modello: stampate sono più strette di 0,1–0,2 mm e fanno l'attrito, da tarare sul pezzo [C] (D-056)."}
      - {tipo: opzionale, x: zaino, quando: anche_dopo, testo: "Con il computer a zaino monta al suo posto lo sportellino con la tacca per l'USB-C (D-066)."}
    fonti: [D-056, "D-066 blocco B: sportellino per lo zaino", "cad/stl/README.md Corpo_Sportello_Servizio.stl", "cad/script/corpo.py fai_sportellino"]

  - id: "13.23"
    titolo: T-plug a carapace montato
    formato: grande
    mostra: [corpo/Portafusibile_F1, corpo/Cicalino, corpo/ToF_posteriore, corpo/Altoparlante, corpo/Corpo_Sportello]
    in_evidenza: [corpo/Tplug]
    vista: {direzione: [-1.0, 0.25, 0.3], su: [0, 0, 1]}
    etichette:
      - {testo: T-plug, punto: [-72.0, 0.0, 9.0]}
      - {testo: ToF, punto: [-93.5, 18.4, 25.0]}
      - {testo: altoparlante, punto: [-96.3, -25.4, 21.0]}
      - {testo: cicalino, punto: [-74.5, 0.0, 29.5]}
    testo:
      - "Controlla che il T-plug sia collegato."
      - "Infila le dita nella porta di coda, sul retro e sui fianchi del T-plug."
      - "Stacca il T-plug del robot da quello del pacco: deve riuscire senza toccare altro."
      - "Ricollegalo; prova anche lo spinotto di bilanciamento dietro il cicalino."
    avvisi:
      - {tipo: prova, testo: "Aria attorno al T-plug: 3,3 mm sotto il cicalino, 7 mm verso l'altoparlante, 10,4 mm verso la guancia sinistra; il ToF copre solo un angolo di 3 × 3 mm visto da dietro [V] (D-069)."}
      - {tipo: importante, testo: "Se non riesci ad afferrarlo, metti una linguetta di nastro sulla metà del T-plug lato batteria, oppure alza ToF e altoparlante sopra il piano del T-plug (D-069)."}
      - {tipo: nota, testo: "Il T-plug è il sezionamento d'emergenza dei servo: deve potersi staccare in pochi secondi (BOM, schema di alimentazione)."}
    fonti: ["D-069: T-plug con il ToF posteriore", "docs/cablaggio.md 4 'T-plug'", "docs/BOM.md 'Schema di alimentazione'"]
