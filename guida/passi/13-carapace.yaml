      - "Posa la scheda sulle quattro bugne gialle, lato saldature sulle bugne, testata a 90° dal lato della coda: la sua apertura guarda l'ottagono."
      - "Avvita quattro viti M2 × 4 negli inserti, a croce."
      - "Controlla che i fili siano liberi e non tocchino le viti."
    avvisi:
      - {tipo: opzionale, x: X2, quando: meglio_ora, testo: "Senza X2 il pulsante e le luci non hanno il cavo a 16 poli. Dopo costa smontare il carapace."}
      - {tipo: importante, testo: "Bugne alte 2,9 mm: la chiave della spina passa 0,54 mm sopra la USB-C dell'ESP32. Niente rondelle sotto la scheda (D-077)."}
      - {tipo: nota, testo: "Viti M2 × 4, inserto profondo 3,4 mm. Se il kit non ha le M2 × 4: M2 × 5 con una rondella sotto la testa (BOM) [C]."}
