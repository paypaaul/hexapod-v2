      - {tipo: importante, testo: "Salda tutto prima di avvitare: il lato saldature poggia sulle bugne. Se il 470 µF è da 11 mm, salda prima SDA e SCL (S-18) [C]."}
      - {tipo: nota, testo: "Un PCB stampato sostituirà la millefori in una versione futura; la guida resta sulla millefori (D-076)."}
