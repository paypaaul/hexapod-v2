  - id: "13.14"
    titolo: Cicalino nel collare
    formato: grande
    nuovi: [corpo/Cicalino]
    esploso: {asse: [0, 0, -1], distanza: 24}
    nascondi: *robot
    vista: {direzione: [-0.55, 0.5, -0.65], su: [0, 0, -1]}
    evidenzia:
      - {chiave: corpo/Corpo_Carapace, lav: "collare_*"}
      - {chiave: corpo/Corpo_Carapace, lav: finestra_cicalino}
    etichette:
      - {testo: finestra, punto: [-74.5, 6.0, 36.0]}
      - {testo: collare, punto: [-66.0, -21.0, 28.0]}
    testo:
      - "Misura il cicalino con il calibro e confrontalo con l'ingombro del collare, 40 × 25 × 11 mm [C]. Annota le misure."
      - "Premi il cicalino nel collare giallo, dal basso, con il display verso la finestra del dorso."
      - "Controlla che i pin guardino la coda."
      - "Scuoti piano il carapace: il cicalino non deve muoversi."
    avvisi:
      - {tipo: nota, testo: "Il collare ha due nervature per lato, a filo del cicalino nel modello: la stretta la dà la stampa. Il collare segue l'ingombro stimato 40 × 25 × 11 mm [C] (D-063, cad/stl/README.md 'Provini della passata estetica')."}
      - {tipo: nota, testo: "Il cicalino suona sotto 3,3 V per cella: è l'ultimo livello, indipendente dal firmware, che spegne il rail sotto 3,5 V per 5 s (12.04, software.md 2.6, D-076)."}
      - {tipo: importante, testo: "Il verso dei pin e il posto del display si guardano sul pezzo, non sul CAD: le quote del BX100 non sono scritte [C] (Q-34). Se i pin stanno sul lato lungo, la spina di bilanciamento non arriva alla prolunga: fermati."}
      - {tipo: importante, testo: "Il cicalino resta staccato dalla prolunga di bilanciamento fino a 13.19."}
    attrezzi: [calibro]
    fonti: [D-059, D-063, D-076, "docs/cablaggio.md 4 'Carapace'", "cad/stl/README.md", "cad/script/corpo.py fai_carapace_dettagli (collare_*)", guida/problemi/carapace.yaml]

