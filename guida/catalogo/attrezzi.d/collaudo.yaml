bilancia:      {nome: "Bilancia da cucina, portata almeno 5 kg", icona: peso, uso: "peso del robot completo, atteso fino a 3047 g (2.1.7; 3045 g in D-074)"}
termometro_ir: {nome: "Termometro a infrarossi (o a termocoppia)", icona: multimetro, uso: "temperatura di carapace, regolatori e servo dopo la marcia (D-065)"}
