# Simulazione e gemello nel browser: i job "sim" e "app" di docs/software.md 6.4 (gli altri stanno in ci.yml).
name: sim

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim:
    name: modelli generati e prova SIL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sim/requirements.txt
      - name: Dipendenze
        run: pip install -r sim/requirements.txt
      - name: URDF e MJCF uguali a quelli generati dalla descrizione
        run: python tools/genera_modelli.py --controlla
      # nessuna prova disegna, quindi MuJoCo non ha bisogno di MUJOCO_GL (egl o osmesa servirebbero solo per le immagini)
      - name: Emulatore, andatura, modelli e 20 s di tripode in MuJoCo
        run: python -m pytest sim/tests -q

  app:
    name: gemello nel browser
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Formule contro il CAD
        run: npm test
      - name: Build (prepara anche i modelli compressi)
        run: npm run build
      - name: Dimensione della build
        run: npm run dimensione
