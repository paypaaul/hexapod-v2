# Differenze volute fra le PCB e le reti della guida (guida/schemi/sorgenti/*_def.py), lette da script/verifica_reti.py.
#   tolti:      componenti dei *_def.py che sulla PCB non ci sono
#   aggiunti:   componenti solo della PCB (si possono usare * e ?)
#   pin:        RIF.PIN: rete voluta al posto di quella dei *_def.py; +NOME è una rete solo della PCB, null un pin libero
#   rinominate: rete dei *_def.py: nome della stessa rete in KiCad
#   fili:       piazzole dei fili, pad per pad: il foro dei *_def.py da cui viene il filo (la rete attesa e' la sua),
#               oppure rete:NOME per le reti nuove della PCB, null per un pad libero

basetta:
  tolti:
    - U4          # traslatore KAmod (DU-1 = sì)
  aggiunti:
    - CS2         # 100 nF su VCC di U3: nei *_def.py è nell'elenco SMD ma non ha fori (lato saldature)
    - R9          # 330 Ω su DATA2, prima nella guaina (piano 2)
    - R10         # pull-up di 3A verso il 3V3 dell'ESP32 (piano 4.1)
    - R11         # partitore della RX, 20 kΩ
    - R12         # partitore della RX, 33 kΩ
    - R13         # R-TX, 330 Ω su 3Y
    - R16         # 10 kΩ in serie fra GPIO41 e la piazzola OFF della 2813 (verifica R1)
    - JP1         # JP-3V3, tre piazzole
    - TP*         # punti di prova
    - P*          # piazzole dei fili
    - H*          # fori delle fascette
  pin:
    U2.6: GND         # secondo GND del D24V22F5, fuori fila (STEP Pololu): sulla millefori non c'era
    U3.9: TX3         # 3A: TX dell'ESP32 sul canale 3 del buffer (DU-1)
    U3.8: +TX5_3Y     # 3Y verso R13 (R-TX); dopo R13 la rete TX5 va alla piazzola del filo
    U3.11: null       # 4Y libero; 4A e 4OE restano a massa (SN74AHCT125: ingressi non usati a VCC o GND)
    PTC1.1: 5V_LED    # PTC simmetrico, piazzole scambiate per il piazzamento (F4)
    PTC1.2: 5V_REG
  fili:
    P1: [rete:VBAT, S13]                  # VBAT sulla millefori era saldato su U2 (P-4)
    P2: [R13, rete:OFF_2813]              # OFF dopo R16
    P3: [P13]
    P4: [F3, H3, E3]                      # TX5 dopo R13, RX5 prima del partitore, massa della seriale
    P5: [A1, B1, E1, F1, rete:GND]        # bus: quattro rami piu' uno di riserva
    P6: [K1, L1, M1, N1, rete:3V3S]
    P7: [Q1, R1, S1, T1, rete:SDA]
    P8: [G1, H1, I1, J1, rete:SCL]
    P9: [rete:DATA_TIBIE]                 # dato delle luci delle tibie dopo R9; 5 V e massa nei poli 2 e 9 (F4)
    P10: [A13, B13, E13, F13, G13, H13, I13, J13, K13, L13, M13, N13, O13, null]
    P11: [rete:3V3_X3]

carapace:
  aggiunti:
    - TP*
    - P*
    - H*
  fili:
    # una piazzola per rete, due fili per foro (D-082): i fori della millefori della guida (scheda_def.py, mod)
    P1: [G3, A3, B9, B3, G4, G8, G9, G5]
    P2: [A9, rete:DATA, B4, A4, G6, G7]
    P3: [rete:BTN_A, rete:BTN_B]

partitori:
  aggiunti:
    - P*
    - H*
